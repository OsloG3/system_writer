[project]
name = "bidding-dt"
version = "0.1.0"
description = "Bridge bidding decision transformer (supervised pretraining, offline-RL-ready)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
cpu = ["torch>=2.4"]
cuda = ["torch>=2.4"]
dev = ["pytest>=8.0"]
rl = ["endplay>=0.5.10"]
plot = ["matplotlib>=3.8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidding_dt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
