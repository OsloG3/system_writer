            .cb-handfoot {

            /* the bidding fan centers exactly like the play fan below, so

            .cb-handfoot .cb-fan {

            .cb-card {

                margin-left: -1.55rem;

            }
            .cb-card:first-child {
                margin-left: 0;
            }

            .cb-card.blk { color: #1b1f27; }

            .cb-fan-sm .cb-corner i { font-size: 0.5rem; margin-top: 0; }
            .cb-fan-sm .cb-midsuit { display: none; }
            @media (max-width: 400px) {
                .cb-card {
                    width: 2.6rem;
                    height: 3.8rem;
                    margin-left: -1.35rem;
                }
                .cb-corner b { font-size: 0.7rem; }
                .cb-corner i { font-size: 0.6rem; }
                .cb-midsuit { font-size: 0.95rem; }
            }

            /* ---- Card-play hands on the table ----
               Your hand stays along the bottom in the same big .cb-card faces
               as while bidding, but only the cards you still hold: all 13 (or
               fewer) in one continuous overlapping line, suits in order with
               no gaps (like the reference photo). The tabled dummy is laid out
               face up at its seat the same way: one row (top seat) or column
               (side seats). Hidden seats show one card back per card still
               held. Tapping a legal card selects it (lifts / gold ring);
               tapping it again plays it. Cards you may not play look like any
               other card -- they are simply not clickable. */
            .cb-fan-play {
                flex-wrap: nowrap;
                /* centered like the bidding fan; "safe" falls back to start
                   alignment when a row is wider than the screen, so overflow
                   scrolls from the first card and is never cut off */
                justify-content: safe center;
                max-width: 100%;
                overflow-x: auto;
                overscroll-behavior-x: contain;
                padding-top: 0.8rem; /* room for the lifted card */
            }
            .cb-fan-play .cb-card {
                width: 3.05rem;
                height: 4.5rem;
                margin-left: -1.4rem;
                transition:
                    transform 0.14s ease,
                    box-shadow 0.14s ease;
            }
            .cb-fan-play .cb-card:first-child { margin-left: 0; }
            /* big, uncut indices, shared by your fan and the tabled dummy:
               the overlap step (1.65rem) is wider than the widest rank ("10")
               plus its inset */
            .cb-fan-play .cb-corner,
            .cb-flat .cb-corner { left: 0.18rem; top: 0.18rem; }
            .cb-fan-play .cb-corner b,
            .cb-flat .cb-corner b { font-size: 1.05rem; }
            .cb-fan-play .cb-corner i,
            .cb-flat .cb-corner i { font-size: 0.95rem; margin-top: 0; }
            .cb-fan-play .cb-midsuit {
                font-size: 1.6rem;
                right: 0.25rem;
                bottom: 0.3rem;
            }
            .cb-fan-play .cb-card.playable {
                cursor: pointer;
                box-shadow:
                    0 0 0 1.5px rgba(232, 230, 227, 0.5),
                    0 2px 6px rgba(0, 0, 0, 0.45);
            }
            .cb-fan-play .cb-card.playable:hover {
                transform: translateY(-4px);
            }
            /* the tabled dummy: exactly the same card faces and sizes as
               your own fan at the bottom */
            .cb-flat {
                display: flex;
                padding: 0.15rem 0.4rem;
            }
            .cb-flat-h {
                flex-direction: row;
                /* centered like your fan; "safe" keeps overflow scrollable
                   from the first card instead of cutting either edge */
                justify-content: safe center;
                width: 100%;
                max-width: 100%;
                overflow-x: auto;
                overscroll-behavior-x: contain;
                /* room for the selected card to step down towards the table
                   without being clipped by (or scrolling) this box */
                padding-bottom: 0.6rem;
            }
            /* a column keeps the height of a full 13-card hand (plus its
               padding), so the table never grows or shrinks (and never
               re-centers) as dummy plays */
            .cb-flat-v {
                flex-direction: column;
                height: 20.4rem;
            }
            .cb-flat .cb-card {
                width: 3.05rem;
                height: 4.5rem;
                margin: 0;
                border-radius: 0.35rem;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
                flex-shrink: 0;
                transition: box-shadow 0.14s ease;
            }
            .cb-flat-h .cb-card + .cb-card { margin-left: -1.4rem; }
            .cb-flat-v .cb-card + .cb-card { margin-top: -3.2rem; }
            .cb-flat .cb-card:first-child { margin-left: 0; margin-top: 0; }
            /* in a column only a thin top strip of each card shows, so the
               corner turns sideways: rank and suit side by side */
            .cb-flat-v .cb-corner {
                flex-direction: row;
                align-items: baseline;
                gap: 1px;
            }
            .cb-flat .cb-midsuit { display: none; }
            .cb-flat .cb-card.playable {
                cursor: pointer;
                box-shadow:
                    0 0 0 1.5px rgba(232, 230, 227, 0.5),
                    0 1px 4px rgba(0, 0, 0, 0.45);
            }
            /* selected card: yellow border in either hand, second tap plays
               it (declared after the playable ring so it always wins) */
            .cb-fan-play .cb-card.sel,
            .cb-flat .cb-card.sel {
                transform: translateY(-0.55rem);
                box-shadow:
                    0 0 0 2px #ffd54a,
                    0 6px 12px rgba(0, 0, 0, 0.55);

            /* ---- Card-play table ----

               contract (with X/XX and the declarer's letter, e.g. 4♠XN) sits
               top-left on North's row, the You/Them trick stack top-right. */
            .cb-ptable {
                display: grid;
                grid-template-columns: auto 1fr auto;
                grid-template-areas:
                    "tl n tr"
                    "w c e"
                    ". s .";
                grid-template-rows: auto minmax(7.8rem, 1fr) auto;
                gap: 0.5rem 0.6rem;
                align-items: center;
                justify-items: center;
                padding: 0.5rem 0;

            .cb-pt-e { grid-area: e; }
            .cb-pt-s { grid-area: s; }
            .cb-pt-w { grid-area: w; }
            .cb-pt-c { grid-area: c; }

                grid-area: tl;
                justify-self: start;

                color: #e8e6e3;

            .cb-pt-tr {
                grid-area: tr;
                justify-self: end;
                align-self: start;

            .cb-ptable.dv {

               as your fan below, so the two hands line up card for card */
            .cb-ptable.dh {

            /* ---- The single play screen ----
               Table and your hand are ONE view that always fits the screen:

            .cb-playview {

            }
            /* short screens: compress the table so everything still fits */
            @media (max-height: 640px) {

        <div id="app"></div>
        <script>
            // ===================== Card Problems (drills) =====================
            // A self-contained section: author fully-scripted card-play
            // problems (deal, auction, comments, every card with the hero's
            // "why") and practice anyone's problems against that script. No
            // bots, no sidecar -- the author's line is the truth.

            document.getElementById("app").innerHTML = renderLayout({
                mode: "drill",
                badge: "Card problems",
                title: "Card problems",
                subtitle:
                    "Author fully-scripted card-play problems -- the deal, the auction, your defensive agreements and every card of the play, each hero card annotated with a hint about why it was chosen -- then practise the library. A wrong card buzzes and flashes red without giving anything away; the author's hints are opt-in and all of them, plus the problem's explanation, are revealed in the review after the hand. The hand is never scored in IMPs, only the final result.",
            });

            const SEAT_NAMES = ["North", "East", "South", "West"];
            const VULN_NAMES = ["None", "N-S", "E-W", "Both"];
            const SUIT_SYMBOL = { S: "\u2660", H: "\u2665", D: "\u2666", C: "\u2663", N: "NT" };
            const SUIT_ORDER = ["C", "D", "H", "S", "N"];
            const TILE_CLS = { C: "c", D: "d", H: "h", S: "s", N: "n" };
            const PLAY_RANK_ORDER = "AKQJT98765432";
            const HAND_SUIT_ORDER = ["S", "H", "C", "D"]; // display order
            const STORE_SUIT_ORDER = ["S", "H", "D", "C"]; // 'S.H.D.C' storage
            const PLAY_PACE_MS = 1000;
            const SESSION_KEY = "atheneum_drill_session";

            // ---- app state ----
            let view = "lobby"; // "lobby" | "session"
            let lobbyTab = "practice"; // "practice" | "create"
            let library = null; // [{id,owner,title,role,played,...}]
            let archives = null; // my archives: [{id,name,drillIds,...}]
            let selArchive = "all"; // "all" | archive id
            let filters = { role: "all", author: "all", difficulty: 0, played: "all", search: "" }; // difficulty 0 = any
            let busy = false;

            // live practice session
            let state = null;
            let revealCount = 0;
            let revealBoardId = null;
            let lastRevealTs = 0;
            let paceTimer = null;
            let selectedCard = null;
            let selectedCtx = null;
            let showLastTrick = false;
            let showAuction = false;
            let showNotes = false;
            let hintMsg = null; // opt-in hint for the current card (Hint button)
            let hintBusy = false; // a hint fetch is in flight
            let wrongMsg = null; // red "try again" bubble after a refused pick
            let wrongFlash = false; // red flash + shake while a wrong pick stings
            let wrongTimer = null;
            let showIntro = false; // pre-play briefing overlay
            let stepping = false; // a bot-phase fetch is in flight
            let autoRetries = 0; // bot-phase fetch backoff

            // authoring wizard
            let wiz = null; // draft problem (see blankWiz)
            let wizModal = null; // {kind:'msg'|'claim'|'delete', ...}
            let summaryOpen = false; // the "hero cards scripted" list stays open across renders

            // ---- shared formatting helpers (ported from play.html) ----
            function dcolorSuits(text) {
                return escapeHtml(text)
                    .replace(/\u2663/g, '<span style="color:#8fd694;">\u2663</span>')
                    .replace(/\u2660/g, '<span style="color:#8fd694;">\u2660</span>')
                    .replace(/\u2666/g, '<span style="color:#f08a8a;">\u2666</span>')
                    .replace(/\u2665/g, '<span style="color:#f08a8a;">\u2665</span>');
            }
            // Suit shorthand, exactly like the system collections: typing !s
            // in a comment/message inserts ♠ (and !h ♥, !d ♦, !c ♣) live.
            function replaceSymbols(text) {
                return String(text == null ? "" : text)
                    .replace(/!c/g, "\u2663")
                    .replace(/!d/g, "\u2666")
                    .replace(/!h/g, "\u2665")
                    .replace(/!s/g, "\u2660");
            }
            // display a comment/reasoning string: expand any !s tokens, escape,
            // and colour the suit glyphs (used for every description box).
            function suitify(text) { return dcolorSuits(replaceSymbols(text)); }
            function hcpOf(handStr) {
                let t = 0;
                for (const c of String(handStr || "").replace(/\./g, "")) {
                    if (c === "A") t += 4; else if (c === "K") t += 3;
                    else if (c === "Q") t += 2; else if (c === "J") t += 1;
                }
                return t;
            }
            function stars(n) {
                let s = "";
                for (let i = 1; i <= 5; i++)
                    s += `<span class="${i <= n ? "" : "off"}">\u2605</span>`;
                return `<span class="dr-stars">${s}</span>`;
            }
            function spinner(msg) {
                return `
                    <span class="material-symbols-outlined text-[#bababa] animate-spin">progress_activity</span>
                    <span class="text-sm text-[#908f8d] font-label">${msg}</span>`;
            }
            function timeAgo(ts) {
                const d = new Date(ts);
                if (isNaN(d)) return "";
                const s = (Date.now() - d.getTime()) / 1000;
                if (s < 60) return "just now";
                if (s < 3600) return Math.floor(s / 60) + "m ago";
                if (s < 86400) return Math.floor(s / 3600) + "h ago";
                return Math.floor(s / 86400) + "d ago";
            }

            function diagramSeatHtml(seat, handStr, youSeat) {
                const suits = [["\u2660", 0, "s"], ["\u2665", 1, "h"], ["\u2666", 2, "d"], ["\u2663", 3, "c"]];
                const parts = String(handStr || "").split(".");
                const lines = suits.map(([sym, pi, cls]) => {
                    const cards = (parts[pi] || "").split("").filter(Boolean)
                        .map((r) => (r === "T" ? "10" : r)).join(" ");
                    return `<div class="cb-dg-line"><span class="cb-dg-su ${cls}">${sym}</span><span class="cb-dg-cards">${cards || "\u2014"}</span></div>`;
                }).join("");
                return `<div class="cb-dg-name">${SEAT_NAMES[seat]}${youSeat === seat ? " \u00b7 you" : ""} \u00b7 ${hcpOf(handStr)} HCP</div>${lines}`;
            }
            function handsDiagramHtml(hands, youSeat) {
                const cls = ["cb-dg-n", "cb-dg-e", "cb-dg-s", "cb-dg-w"];
                return `<div class="cb-diagram">` +
                    [0, 1, 2, 3].map((s) => `<div class="cb-dg-seat ${cls[s]}">${diagramSeatHtml(s, hands[s], youSeat)}</div>`).join("") +
                    `</div>`;
            }

            function cbChip(c) {
                if (c === "P") return `<span class="cb-call cb-call-p">pass</span>`;
                if (c === "X") return `<span class="cb-call cb-call-x">X</span>`;
                if (c === "XX") return `<span class="cb-call cb-call-xx">XX</span>`;
                const sym = c[1] === "N" ? "NT" : SUIT_SYMBOL[c[1]];
                return `<span class="cb-call cb-call-${TILE_CLS[c[1]]}">${c[0]}<b style="font-size:.75rem;">${sym}</b></span>`;
            }
            function auctionHtml(dealer, vuln, calls, pending, youSeat) {
                // columns run in calling order ending at the viewer's own
                // seat, so you are always the rightmost column no matter who
                // deals; every call still lands under the seat that made it
                const first = youSeat === null || youSeat === undefined ? dealer : youSeat;
                const cols = [0, 1, 2, 3].map((k) => (first + 1 + k) % 4);
                const off = (dealer - first + 3) % 4; // blank cells before the dealer opens
                const list = calls || [];
                const rows = [];
                for (let i = 0; i < list.length; i++) {
                    const L = i + off;
                    const r = Math.floor(L / 4);
                    if (!rows[r]) rows[r] = [];
                    while (rows[r].length < L % 4) rows[r].push({ c: null });
                    rows[r].push({ c: list[i], i });
                }
                if (pending !== null && pending !== undefined) {
                    const pos = (pending - first + 3) % 4;
                    let r = Math.floor((list.length + off) / 4);
                    if (!rows[r]) rows[r] = [];
                    if (pos < rows[r].length) { r++; rows[r] = []; }
                    while (rows[r].length < pos) rows[r].push({ c: null });
                    rows[r].push({ q: true });
                }
                const vulnSeat = (s) => vuln === 3 || (vuln === 1 && s % 2 === 0) || (vuln === 2 && s % 2 === 1);
                const head = cols.map((s) => {
                    const v = vulnSeat(s);
                    const cls = `cb-seatv ${v ? "v" : "nv"}${s === dealer ? " dlr" : ""}${s === youSeat ? " you" : ""}`;
                    return `<div><span class="${cls}">${SEAT_NAMES[s][0]}</span></div>`;
                }).join("");
                const body = rows.length
                    ? rows.map((row) => `<div class="cb-auc-row">` +
                        row.map((cell) => `<div class="cb-auc-cell">${cell.q ? `<span class="cb-q">?</span>` : cell.c ? cbChip(cell.c) : ""}</div>`).join("") +
                        `</div>`).join("")
                    : `<div class="cb-auc-empty">no calls yet</div>`;
                return `<div class="cb-auction">
                    <div class="cb-auc-meta">
                        <span>Dealer ${SEAT_NAMES[dealer][0]} \u00b7 <span class="${vuln === 0 ? "cb-vuln-nv" : "cb-vuln-v"}">Vuln ${VULN_NAMES[vuln]}</span></span>
                        <span>${list.length} call${list.length === 1 ? "" : "s"}</span>
                    </div>
                    <div class="cb-auc-head">${head}</div>
                    <div class="cb-auc-body">${body}</div>
                </div>`;
            }
            function miniChip(c) {
                if (c === "P") return `<span class="cb-mini cb-mini-p">P</span>`;
                if (c === "X") return `<span class="cb-mini cb-mini-x">X</span>`;
                if (c === "XX") return `<span class="cb-mini cb-mini-xx">XX</span>`;
                const sym = c[1] === "N" ? "NT" : SUIT_SYMBOL[c[1]];
                return `<span class="cb-mini cb-mini-${TILE_CLS[c[1]]}">${c[0]}${sym}</span>`;
            }
            function miniAuctionHtml(dealer, calls, youSeat) {
                // rightmost column is the viewer's own seat, like auctionHtml
                const first = youSeat === null || youSeat === undefined ? dealer : youSeat;
                const cols = [0, 1, 2, 3].map((k) => (first + 1 + k) % 4);
                const off = (dealer - first + 3) % 4;
                const head = cols.map((s) => `<span class="${s === dealer ? "dlr" : ""}">${SEAT_NAMES[s][0]}</span>`).join("");
                const list = calls || [];
                const rows = [];
                for (let i = 0; i < list.length; i++) {
                    const L = i + off;
                    const r = Math.floor(L / 4);
                    if (!rows[r]) rows[r] = [];
                    // blank lead-in cells keep every call in its seat's column
                    while (rows[r].length < L % 4) rows[r].push(null);
                    rows[r].push(list[i]);
                }
                let body = "";
                for (const row of rows) {
                    let cells = "";
                    for (let k = 0; k < 4; k++) cells += row[k] ? miniChip(row[k]) : `<span></span>`;
                    body += `<div class="cb-auc-mini-row">${cells}</div>`;
                }
                return `<div class="cb-auc-mini-head">${head}</div>${body}`;
            }
            function doneDiagramHtml(hands, youSeat, dealer, calls) {
                const cls = ["cb-dg-n", "cb-dg-e", "cb-dg-s", "cb-dg-w"];
                return `<div class="cb-diagram cb-diagram-done">` +
                    [0, 1, 2, 3].map((s) => `<div class="cb-dg-seat ${cls[s]}">${diagramSeatHtml(s, hands[s], youSeat)}</div>`).join("") +
                    `<div class="cb-dg-a">${miniAuctionHtml(dealer, calls, youSeat)}</div></div>`;
            }

            // ---- API plumbing ----
            async function api(method, path, body) {
                const res = await fetch(path, {
                    method,
                    headers: body ? { "Content-Type": "application/json" } : undefined,
                    body: body ? JSON.stringify(body) : undefined,
                });
                if (res.status === 401) {
                    showAuthDialog("login");
                    throw { auth: true };
                }
                const data = await res.json().catch(() => null);
                return { ok: res.ok, status: res.status, data };
            }

            // ---- auction / contract helpers (mirror play.go) ----
            function isBid(c) { return /^[1-7][CDHSN]$/.test(c); }
            function bidRank(c) { return isBid(c) ? parseInt(c[0]) * 10 + "CDHSN".indexOf(c[1]) : -1; }
            function auctionOver(calls) {
                const n = calls.length;
                return n >= 3 && calls[n - 1] === "P" && calls[n - 2] === "P" && calls[n - 3] === "P";
            }
            // legal continuations of an auction, for the authoring bidding box
            function legalCalls(dealer, calls) {
                if (auctionOver(calls)) return [];
                const n = calls.length, seat = (dealer + n) % 4;
                let lastBidSeat = -1, lastBidRank = -1;
                for (let i = 0; i < n; i++)
                    if (isBid(calls[i])) { lastBidRank = bidRank(calls[i]); lastBidSeat = (dealer + i) % 4; }
                const prev = n > 0 ? calls[n - 1] : "";
                const out = [];
                for (let lv = 1; lv <= 7; lv++)
                    for (const d of "CDHSN") { const tok = lv + d; if (bidRank(tok) > lastBidRank) out.push(tok); }
                if (isBid(prev) && lastBidSeat >= 0 && lastBidSeat % 2 !== seat % 2) out.push("X");
                if (prev === "X" && lastBidSeat >= 0 && lastBidSeat % 2 === seat % 2) out.push("XX");
                out.push("P");
                return out;
            }
            // recover the final contract (declarer/denom/penalty), or null if passed out
            function contractFromCalls(dealer, calls) {
                let lastBid = -1, doubled = false, redoubled = false;
                const firstDenom = {};
                for (let i = 0; i < calls.length; i++) {
                    const c = calls[i];
                    if (c === "X") { doubled = true; redoubled = false; }
                    else if (c === "XX") { redoubled = true; }
                    else if (isBid(c)) {
                        lastBid = i; doubled = redoubled = false;
                        const seat = (dealer + i) % 4;
                        const key = "CDHSN".indexOf(c[1]) + "_" + (seat % 2);
                        if (firstDenom[key] === undefined) firstDenom[key] = seat;
                    }
                }
                if (lastBid < 0) return null;
                const c = calls[lastBid];
                const denomIdx = "CDHSN".indexOf(c[1]);
                const bidder = (dealer + lastBid) % 4;
                const declarer = firstDenom[denomIdx + "_" + (bidder % 2)];
                return {
                    level: parseInt(c[0]), denom: c[1], declarer,
                    penalty: redoubled ? 2 : doubled ? 1 : 0,
                };
            }
            function contractText(c) {
                if (!c) return "passed out";
                const pen = ["", "X", "XX"][c.penalty] || "";
                const sym = c.denom === "N" ? "NT" : SUIT_SYMBOL[c.denom];
                return `${c.level}${sym}${pen} by ${SEAT_NAMES[c.declarer]}`;
            }
            // The result of a hand as contract + margin, e.g. "4\u2660\u22121",
            // "3NT=", "4\u2665+2" -- no score, no IMPs.
            function resultText(c, tricks) {
                if (!c) return "passed out";
                const pen = ["", "X", "XX"][c.penalty] || "";
                const sym = c.denom === "N" ? "NT" : SUIT_SYMBOL[c.denom];
                const margin = (tricks || 0) - (c.level + 6);
                const tail = margin === 0 ? "=" : margin > 0 ? "+" + margin : "\u2212" + Math.abs(margin);
                return `${c.level}${sym}${pen}${tail}`;
            }

            // ===================== Practice table (hero rotated to bottom) =====================
            function handToCards(handStr) {
                const parts = String(handStr || "").split(".");
                const out = [];
                for (let s = 0; s < 4; s++)
                    for (const r of parts[s] || "") out.push(r + "SHDC"[s]);
                return out;
            }
            function seatForArea(r) { return (r + state.heroSeat - 2 + 8) % 4; } // r: 0 top,1 right,2 bottom,3 left
            function rotOf(seat) { return (seat - state.heroSeat + 2 + 4) % 4; }
            function revealedPlays() { return (state.plays || []).slice(0, revealCount); }
            function playReady() {
                return !!state && state.phase === "play" && state.yourTurn &&
                    revealCount >= (state.plays || []).length && !busy && !stepping;
            }
            function origHandOf(seat) {
                if (!state) return null;
                if (seat === state.heroSeat) return state.hand;
                if (seat === state.dummy) return state.dummyHand || null;
                return null;
            }
            function remainingOf(seat) {
                const orig = origHandOf(seat);
                if (orig == null) return null;
                const played = new Set(revealedPlays().filter((p) => p.seat === seat).map((p) => p.card));
                return handToCards(orig).filter((c) => !played.has(c));
            }
            function trickWinnerJS(trick, trump) {
                let win = trick[0];
                for (let i = 1; i < trick.length; i++) {
                    const c = trick[i];
                    if (c.card[1] === win.card[1]) {
                        if (PLAY_RANK_ORDER.indexOf(c.card[0]) < PLAY_RANK_ORDER.indexOf(win.card[0])) win = c;
                    } else if (c.card[1] === trump) win = c;
                }
                return win.seat;
            }
            function sortHand(cards) {
                return cards.slice().sort((a, b) => {
                    const d = HAND_SUIT_ORDER.indexOf(a[1]) - HAND_SUIT_ORDER.indexOf(b[1]);
                    return d || PLAY_RANK_ORDER.indexOf(a[0]) - PLAY_RANK_ORDER.indexOf(b[0]);
                });
            }
            function gridCardHtml(token, cls, dataAttr) {
                const r = token[0], s = token[1];
                const red = s === "H" || s === "D";
                const rank = r === "T" ? "10" : r;
                return `<span class="cb-card ${red ? "red" : "blk"} ${cls || ""}" ${dataAttr || ""}><span class="cb-corner"><b>${rank}</b><i>${SUIT_SYMBOL[s]}</i></span><span class="cb-midsuit">${SUIT_SYMBOL[s]}</span></span>`;
            }
            function playCardHtml(token, acting, playable) {
                if (!acting || !playable.has(token)) return gridCardHtml(token);
                const cls = selectedCard === token ? "playable sel" : "playable";
                return gridCardHtml(token, cls, `data-play="${token}"`);
            }
            function dummyLayoutHtml(seat) {
                const acting = (state.heroSeats || []).indexOf(seat) >= 0 &&
                    playReady() && state.actSeat === seat;
                const playable = new Set(acting ? state.legal || [] : []);
                const cards = sortHand(remainingOf(seat) || [])
                    .map((c) => playCardHtml(c, acting, playable)).join("");
                return `<div class="cb-flat ${rotOf(seat) === 0 ? "cb-flat-h" : "cb-flat-v"}">${cards}</div>`;
            }
            function playFanHtml() {
                const seat = state.heroSeat;
                const acting = playReady() && state.actSeat === seat;
                const playable = new Set(acting ? state.legal || [] : []);
                const cards = sortHand(remainingOf(seat) || [])
                    .map((c) => playCardHtml(c, acting, playable)).join("");
                return `<div class="cb-fan cb-fan-play">${cards}</div>`;
            }
            function playSeatHtml(seat) {
                const isDummy = seat === state.dummy;
                const isHero = seat === state.heroSeat;
                const acting = playReady() && state.actSeat === seat;
                const botActing = !state.yourTurn && state.nextSeat === seat;
                const dummyUp = isDummy && !isHero && revealedPlays().length > 0;
                let body;
                if (isHero) body = "";
                else if (dummyUp) body = dummyLayoutHtml(seat);
                else {
                    const cnt = Math.max(0, 13 - revealedPlays().filter((pl) => pl.seat === seat).length);
                    let backs = "";
                    for (let i = 0; i < cnt; i++) backs += `<div class="cb-pback"></div>`;
                    const vert = rotOf(seat) === 1 || rotOf(seat) === 3;
                    body = `<div class="cb-pbacks${vert ? " cb-pbacks-v" : ""}">${backs}</div>`;
                }
                const actCls = acting || botActing ? " act" : "";
                return `<div class="cb-pseat${actCls}">
                    <div class="cb-pseat-name"><span class="cb-pbadge">${"NESW"[seat]}</span>${SEAT_NAMES[seat]}${isHero ? ' <span class="you">you</span>' : ""}</div>
                    ${body}
                </div>`;
            }
            function trickToDisplay() {
                const plays = revealedPlays();
                const n = plays.length;
                const cur = plays.slice(Math.floor(n / 4) * 4);
                if (cur.length) return { cards: cur, complete: cur.length === 4 };
                if (n >= 4) return { cards: plays.slice(n - 4, n), complete: true };
                return { cards: [], complete: false };
            }
            function trickCrossHtml(cards, win, extra) {
                const areaOf = ["tk-n", "tk-e", "tk-s", "tk-w"]; // by rot
                const cells = cards.map((pc) => {
                    const r = pc.card[0], s = pc.card[1];
                    const red = s === "H" || s === "D";
                    const rank = r === "T" ? "10" : r;
                    const w = win !== null && win !== undefined && pc.seat === win ? " win" : "";
                    const pos = areaOf[rotOf(pc.seat)];
                    return `<div class="tk ${pos}"><span class="who">${SEAT_NAMES[pc.seat][0]}</span><div class="tkc ${red ? "red" : "blk"}${w}"><span>${rank}</span><span>${SUIT_SYMBOL[s]}</span></div></div>`;
                }).join("");
                return `<div class="cb-ptrick">${cells}${extra || ""}</div>`;
            }
            function trickCenterHtml() {
                const td = trickToDisplay();
                const win = td.complete ? trickWinnerJS(td.cards, state.trump) : null;
                let slots = "";
                if (!td.complete) {
                    const areaOf = ["tk-n", "tk-e", "tk-s", "tk-w"];
                    const played = new Set(td.cards.map((c) => c.seat));
                    const plays = revealedPlays();
                    const next = plays.length ? (plays[plays.length - 1].seat + 1) % 4 : state.opener;
                    for (let s = 0; s < 4; s++) {
                        if (played.has(s)) continue;
                        const mine = s === next && playReady();
                        // same seat label a played card carries, so slot and
                        // card occupy exactly the same space: no jump when the
                        // card lands
                        slots += `<div class="tk ${areaOf[rotOf(s)]}"><span class="who">${SEAT_NAMES[s][0]}</span><div class="tk-slot${mine ? " mine" : s === next ? " now" : ""}"></div></div>`;
                    }
                    // before the opening lead the table is empty: the final
                    // contract sits in the middle until the first card lands
                    if (!plays.length)
                        slots += `<div class="cb-leadc">${dcolorSuits(contractTagString())}</div>`;
                }
                return trickCrossHtml(td.cards, win, slots);
            }
            // Contract tag: level and suit (NT for notrump), X/XX when
            // doubled, then the declarer's letter -- 4♠XN, 3NTS. Small in the
            // table corner, big in the empty center before the opening lead.
            function contractTagString() {
                const c = state.contract;
                if (!c) return "";
                const pen = ["", "X", "XX"][c.penalty] || "";
                const suit = c.denom === "N" ? "NT" : SUIT_SYMBOL[c.denom];
                return `${c.level}${suit}${pen}${"NESW"[c.declarer]}`;
            }
            function contractTagHtml() {
                return dcolorSuits(contractTagString());
            }
            function playTallyHtml() {
                const plays = revealedPlays();
                let decl = 0;
                for (let t = 0; t * 4 + 4 <= plays.length; t++) {
                    const w = trickWinnerJS(plays.slice(t * 4, t * 4 + 4), state.trump);
                    if (w === state.declarer || w === state.dummy) decl++;
                }
                const done = Math.floor(plays.length / 4);
                const def = done - decl;
                const heroDecl = state.role === "declarer";
                const yours = heroDecl ? decl : def, theirs = heroDecl ? def : decl;
                return `<div class="cb-ptally"><span>You <b>${yours}</b></span><span>Them <b>${theirs}</b></span></div>`;
            }
            function playPromptHtml() {
                if (busy) return spinner("Playing the hand\u2026");
                if (playReady()) return state.bot ? "Your turn \u2014 play any card" : "Your turn";
                const plays = state.plays || [];
                const nextSeat = revealCount < plays.length ? plays[revealCount].seat : state.nextSeat;
                return spinner(SEAT_NAMES[nextSeat] + " is playing\u2026");
            }
            function lastTrickPlays() {
                const plays = revealedPlays();
                const full = Math.floor(plays.length / 4) * 4;
                if (full === 0) return null;
                return plays.slice(full - 4, full);
            }
            function lastTrickBtnHtml() {
                const trick = lastTrickPlays();
                const open = showLastTrick && trick;
                return `<button id="drLastTrickBtn" class="cb-trickbtn${open ? " on" : ""}"${trick ? "" : " disabled"}>
                    <span class="material-symbols-outlined">${open ? "expand_less" : "style"}</span>Last trick</button>`;
            }
            function lastTrickPanelHtml() {
                const trick = lastTrickPlays();
                if (!showLastTrick || !trick) return "";
                const win = trickWinnerJS(trick, state.trump);
                const no = Math.floor(revealedPlays().length / 4);
                return `<div class="cb-lasttrick"><div class="cap">${SEAT_NAMES[win]} won trick ${no}</div>${trickCrossHtml(trick, win)}</div>`;
            }
            function auctionBtnHtml() {
                return `<button id="drAuctionBtn" class="cb-trickbtn${showAuction ? " on" : ""}">
                    <span class="material-symbols-outlined">${showAuction ? "expand_less" : "gavel"}</span>Bidding</button>`;
            }
            function auctionPanelHtml() {
                if (!showAuction) return "";
                return `<div class="cb-auctionpop">${auctionHtml(state.dealer, state.vuln, state.calls, null, state.heroSeat)}</div>`;
            }
            function notesBtnHtml() {
                const has = (state.problemComment || state.bidComment);
                if (!has) return "";
                return `<button id="drNotesBtn" class="cb-trickbtn${showNotes ? " on" : ""}">
                    <span class="material-symbols-outlined">${showNotes ? "expand_less" : "notes"}</span>Notes</button>`;
            }
            function notesPanelHtml() {
                if (!showNotes) return "";
                const parts = [];
                if (state.problemComment) parts.push(`<div style="margin-bottom:.4rem"><div class="dr-label">Problem / defence</div><div class="dr-comment">${suitify(state.problemComment)}</div></div>`);
                if (state.bidComment) parts.push(`<div><div class="dr-label">Bidding</div><div class="dr-comment">${suitify(state.bidComment)}</div></div>`);
                return `<div class="cb-auctionpop" style="left:0;right:0"><div style="padding:.4rem .5rem">${parts.join("")}</div></div>`;
            }
            function hintBubbleHtml() {
                if (!hintMsg) return "";
                return `<div class="dr-msg dr-msg-float"><span class="material-symbols-outlined">tips_and_updates</span><span style="flex:1">${suitify(hintMsg)}</span><button id="drHintClose" class="dr-hintclose" title="Dismiss"><span class="material-symbols-outlined">close</span></button></div>`;
            }
            function wrongBubbleHtml() {
                if (!wrongMsg) return "";
                const n = state && state.wrong ? ` \u00b7 \u2717 ${state.wrong}` : "";
                return `<div class="dr-msg dr-msg-float dr-msg-bad"><span class="material-symbols-outlined">priority_high</span><span style="flex:1">${escapeHtml(wrongMsg)} \u2014 try again${n}. Tap <b>Hint</b> if you are stuck.</span><button id="drWrongClose" class="dr-hintclose" title="Dismiss"><span class="material-symbols-outlined">close</span></button></div>`;
            }
            // the opt-in hint: only while the script is in charge and it is
            // the hero's turn (in the bot phase every legal card is fine)
            function hintBtnHtml() {
                if (!playReady() || state.bot) return "";
                return `<button id="drHintBtn" class="cb-trickbtn${hintMsg ? " on" : ""}" title="Reveal the author's note for this card">
                    <span class="material-symbols-outlined">tips_and_updates</span>Hint</button>`;
            }
            function playTableView() {
                // dh/dv: where the tabled dummy will lie on screen (row at the
                // top, column at a side) so the table reserves its space up
                // front, exactly like the play-bridge table
                const dr = rotOf(state.dummy);
                const dcls = dr === 0 ? " dh" : (dr === 1 || dr === 3) ? " dv" : "";
                // the target is known before the first card, not at the end
                const tEq = state.role === "declarer" ? state.target : 13 - state.target;
                const target = state.target
                    ? `<div class="dr-sub" style="text-align:right;white-space:nowrap" title="Your side must take at least ${state.target} tricks">target ${dcolorSuits(resultText(state.contract, tEq))}</div>`
                    : "";
                return `<div class="cb-ptable${dcls}">
                    <div class="cb-pt-tl">${contractTagHtml()}</div>
                    <div class="cb-pt-n">${playSeatHtml(seatForArea(0))}</div>
                    <div class="cb-pt-tr">${playTallyHtml()}${target}</div>
                    <div class="cb-pt-w">${playSeatHtml(seatForArea(3))}</div>
                    <div class="cb-pt-c">${trickCenterHtml()}</div>
                    <div class="cb-pt-e">${playSeatHtml(seatForArea(1))}</div>
                    <div class="cb-pt-s">${playSeatHtml(seatForArea(2))}</div>
                </div>
                <div class="cb-playbottom">
                    ${auctionPanelHtml()}${notesPanelHtml()}${lastTrickPanelHtml()}${hintBubbleHtml()}${wrongBubbleHtml()}
                    <div class="cb-playrow">
                        <div class="cb-pprompt">${playPromptHtml()}</div>
                        ${auctionBtnHtml()}${notesBtnHtml()}${lastTrickBtnHtml()}${hintBtnHtml()}
                    </div>
                </div>`;
            }

            // two-click: lift, then tap again to play
            function onCardClick(card) {
                if (!state || state.phase !== "play" || !playReady()) return;
                if (selectedCard === card) { makePlay(card); return; }
                selectedCard = card;
                render();
            }
            async function makePlay(card) {
                if (busy || !state) return;
                selectedCard = null;
                wrongMsg = null;
                busy = true;
                render();
                try {
                    const r = await api("POST", `/api/drill/session/${state.id}/card`, { card });
                    busy = false;
                    if (r.status === 409) {
                        // refused: buzz + red flash, nothing about the right
                        // card is revealed (the Hint button stays opt-in)
                        if (r.data && typeof r.data.wrong === "number") state.wrong = r.data.wrong;
                        const err = (r.data && r.data.error) || "not the card the author played";
                        wrongMsg = err.charAt(0).toUpperCase() + err.slice(1);
                        hintMsg = null;
                        wrongFlash = true;
                        try { if (navigator.vibrate) navigator.vibrate([90, 50, 90]); } catch (e) { }
                        render();
                        clearTimeout(wrongTimer);
                        wrongTimer = setTimeout(() => { wrongFlash = false; render(); }, 650);
                        return;
                    }
                    if (!r.ok) { showToast((r.data && r.data.error) || "Play failed", true); render(); return; }
                    onSessionState(r.data, false);
                } catch (e) {
                    busy = false;
                    if (!e || !e.auth) showToast("Network error", true);
                    render();
                }
            }
            // the opt-in hint for the card the script expects now
            async function toggleHint() {
                if (hintMsg) { hintMsg = null; render(); return; }
                if (!state || hintBusy) return;
                hintBusy = true;
                try {
                    const r = await api("GET", `/api/drill/session/${state.id}/hint`);
                    hintBusy = false;
                    if (r.ok && r.data && r.data.hint !== undefined) { hintMsg = r.data.hint; wrongMsg = null; }
                    else showToast((r.data && r.data.error) || "No hint right now", true);
                } catch (e) { hintBusy = false; }
                render();
            }
            function drivePlay() {
                clearTimeout(paceTimer); paceTimer = null;
                if (!state || view !== "session") return;
                const plays = state.plays || [];
                if (revealCount < plays.length) {
                    const next = plays[revealCount];
                    const hero = (state.heroSeats || []).indexOf(next.seat) >= 0;
                    const wait = hero ? 0 : Math.max(0, PLAY_PACE_MS - (Date.now() - lastRevealTs));
                    paceTimer = setTimeout(() => { revealCount++; lastRevealTs = Date.now(); render(); }, wait);
                    return;
                }
                // caught up with everything the server has sent
                if (state.phase === "done") return; // the done view takes over
                if (state.yourTurn) return; // wait for the hero to click
                // bot phase, a bot seat to act: the server plays exactly one
                // bot card per request, so keep fetching (the play-a-hand
                // pacing) until it is the hero's turn or the hand is over
                if (state.bot && !stepping && !busy) fetchDrillStep();
            }
            async function fetchDrillStep() {
                if (!state || stepping || busy || state.phase === "done") return;
                stepping = true;
                try {
                    const res = await fetch(`/api/drill/session/${state.id}`);
                    if (res.status === 401) { stepping = false; showAuthDialog("login"); return; }
                    if (res.status === 404) {
                        stepping = false;
                        showToast("This practice session is no longer on the server", true);
                        view = "lobby"; state = null;
                        localStorage.removeItem(SESSION_KEY);
                        render(); loadLibrary();
                        return;
                    }
                    const data = await res.json().catch(() => null);
                    if (!res.ok || !data) {
                        stepping = false; autoRetries++;
                        if (autoRetries === 1 && data && data.error) showToast(data.error, true);
                        paceTimer = setTimeout(() => drivePlay(), Math.min(1500 + autoRetries * 1500, 8000));
                        return;
                    }
                    stepping = false; autoRetries = 0;
                    onSessionState(data, false);
                } catch (e) {
                    stepping = false; autoRetries++;
                    paceTimer = setTimeout(() => drivePlay(), Math.min(1500 + autoRetries * 1500, 8000));
                }
            }
            function syncReveal() {
                if (!state) { revealBoardId = null; revealCount = 0; selectedCard = null; selectedCtx = null; return; }
                if (state.id !== revealBoardId) {
                    revealBoardId = state.id;
                    revealCount = (state.plays || []).length;
                    lastRevealTs = 0; selectedCard = null; showLastTrick = false; showAuction = false; showNotes = false;
                }
                const ctx = state.phase === "play" ? `${state.actSeat}|${revealCount}|${state.yourTurn}` : "";
                if (ctx !== selectedCtx) { selectedCtx = ctx; selectedCard = null; }
            }
            function onSessionState(data, snap) {
                const fresh = !state || state.id !== data.id;
                state = data;
                if (fresh || snap) {
                    revealBoardId = data.id;
                    revealCount = (data.plays || []).length;
                    lastRevealTs = 0;
                }
                if (data.id) localStorage.setItem(SESSION_KEY, data.id);
                hintMsg = null;
                wrongMsg = null;
                wrongFlash = false;
                clearTimeout(wrongTimer);
                render();
                drivePlay();
            }

            // ===================== Session chrome, intro, done =====================
            function cardNameJS(token) {
                const ranks = { A: "A", K: "K", Q: "Q", J: "J", T: "10" };
                const r = ranks[token[0]] || token[0];
                return r + SUIT_SYMBOL[token[1]];
            }
            function topBarHtml() {
                const t = state.title || "Card problem";
                return `<div class="cb-topbar">
                    <button id="drBackBtn" class="cb-iconbtn" title="Leave"><span class="material-symbols-outlined">close</span></button>
                    <div class="cb-title">
                        <div class="t">${escapeHtml(t)}</div>
                        <div class="s">${state.role === "declarer" ? "Declarer" : "Defense"} \u00b7 ${stars(state.difficulty)} \u00b7 by ${escapeHtml(state.owner || "")} \u00b7 \u2717 ${state.wrong || 0}</div>
                    </div>
                    <button id="drRestartBtn" class="cb-iconbtn" title="Restart"><span class="material-symbols-outlined">restart_alt</span></button>
                </div>`;
            }
            function introHtml() {
                const c = state.contract;
                return `<div class="dr-overlay" id="drIntro">
                    <div class="dr-modal">
                        <h3>${escapeHtml(state.title || "Card problem")}</h3>
                        <div class="dr-sub" style="margin-bottom:.6rem">${contractText(c)} \u00b7 Dealer ${SEAT_NAMES[state.dealer][0]} \u00b7 Vuln ${VULN_NAMES[state.vuln]} \u00b7 ${stars(state.difficulty)}</div>
                        ${state.problemComment ? `<div class="dr-label">Problem / defensive agreements</div><div class="dr-comment" style="margin-bottom:.6rem">${suitify(state.problemComment)}</div>` : ""}
                        <div class="dr-label">Auction</div>
                        ${auctionHtml(state.dealer, state.vuln, state.calls, null, state.heroSeat)}
                        ${state.bidComment ? `<div class="dr-comment" style="margin-top:.5rem">${suitify(state.bidComment)}</div>` : ""}
                        <div class="dr-modalfoot">
                            <button class="dr-btn ghost" id="drIntroClose">Back</button>
                            <button class="dr-btn gold" id="drIntroStart"><span class="material-symbols-outlined">playing_cards</span>Start play</button>
                        </div>
                    </div>
                </div>`;
            }
            function lineReviewHtml() {
                const line = state.line || [];
                const trump = state.trump;
                const scriptLen = state.scriptLen === undefined ? line.length : state.scriptLen;
                let out = "";
                let marked = false;
                for (let t = 0; t < line.length; t += 4) {
                    const trick = line.slice(t, t + 4);
                    if (trick.length < 4) break;
                    if (!marked && t >= scriptLen) {
                        out += `<div class="dr-line-msg" style="margin:.3rem 0 .3rem 1.6rem;color:#9fd0ff">\u2014 the bots took over here \u2014</div>`;
                        marked = true;
                    }
                    const win = trickWinnerJS(trick.map((p) => ({ seat: p.seat, card: p.card })), trump);
                    const cards = trick.map((p) => {
                        const red = p.card[1] === "H" || p.card[1] === "D";
                        const rank = p.card[0] === "T" ? "10" : p.card[0];
                        const wc = p.seat === win ? " win" : "";
                        return `<span style="display:inline-flex;flex-direction:column;align-items:center;gap:1px"><span class="dr-tk-seat">${SEAT_NAMES[p.seat][0]}</span><span class="dr-tk-mini ${red ? "red" : "blk"}${wc}">${rank}<br>${SUIT_SYMBOL[p.card[1]]}</span></span>`;
                    }).join("");
                    const msgs = trick.filter((p) => p.msg || (p.alts && p.alts.length)).map((p) => {
                        const alts = (p.alts && p.alts.length) ? ` <span style="color:#8fd694">\u2261 ${dcolorSuits(p.alts.map(cardNameJS).join(" "))} also fine</span>` : "";
                        const msg = p.msg ? ` ${suitify(p.msg)}` : "";
                        return `<div class="dr-line-msg"><b>${SEAT_NAMES[p.seat][0]}</b> ${cardNameJS(p.card)}:${alts}${msg}</div>`;
                    }).join("");
                    out += `<div class="dr-line-trick"><span class="dr-line-no">${t / 4 + 1}</span><span style="display:flex;gap:.3rem">${cards}</span></div>${msgs}`;
                }
                return `<div class="dr-line">${out}</div>`;
            }
            function rateWidgetHtml() {
                const me = (window.currentUser || "").toLowerCase();
                const isOwner = (state.owner || "").toLowerCase() === me && me !== "";
                const n = state.ratings || 0;
                const avg = n ? (state.rating || 0).toFixed(1) : "";
                const your = state.yourRating || 0;
                const avgLine = n
                    ? `<span class="dr-rate"><span class="material-symbols-outlined">star</span>${avg} <span class="cnt">\u00b7 ${n} rating${n === 1 ? "" : "s"}</span></span>`
                    : `<span class="dr-rate dr-rate-empty"><span class="material-symbols-outlined">star</span>no ratings yet</span>`;
                if (isOwner)
                    return `<div class="dr-rate-row"><span class="dr-label" style="margin:0">Rating</span>${avgLine}<span class="dr-hint">(your problem)</span></div>`;
                const starBtns = [1, 2, 3, 4, 5].map((i) =>
                    `<button data-rate="${i}" class="${i <= your ? "on" : ""}" title="Rate ${i} star${i === 1 ? "" : "s"}">\u2605</button>`).join("");
                return `<div class="dr-rate-cta">
                    <div class="dr-rate-cta-head"><span class="material-symbols-outlined">grade</span>Rate this problem</div>
                    <div class="dr-rater">${starBtns}</div>
                    <span class="dr-hint">${your ? `you rated ${your}\u2605 \u2014 tap a star to change it` : "tap a star \u2014 it tells the author how good it was"}</span>
                    <div>${avgLine}</div>
                </div>`;
            }
            async function rateProblem(star) {
                if (!state || !state.problemId) return;
                try {
                    const r = await api("POST", `/api/drills/${state.problemId}/rate`, { stars: star, sessionId: state.id });
                    if (!r.ok) { showToast((r.data && r.data.error) || "Could not rate", true); return; }
                    state.rating = r.data.rating; state.ratings = r.data.ratings; state.yourRating = r.data.yourRating;
                    showToast("Thanks for rating!");
                    render();
                } catch (e) { /* auth handled */ }
            }
            function doneViewHtml() {
                const r = state.result || {};
                const c = r.contract || state.contract;
                const decl = c ? SEAT_NAMES[c.declarer] : "";
                const heroTook = state.role === "declarer" ? r.tricks : 13 - r.tricks;
                const grade = r.success
                    ? `<div class="dr-msg" style="background:rgba(143,214,148,.12);border-color:rgba(143,214,148,.5);color:#c9ecd0"><span class="material-symbols-outlined">verified</span><span><b>Success</b> \u2014 your side took ${heroTook} trick${heroTook === 1 ? "" : "s"} against a target of ${r.target}, finishing ${dcolorSuits(resultText(c, r.tricks))}.</span></div>`
                    : `<div class="dr-msg" style="background:rgba(240,138,138,.1);border-color:rgba(240,138,138,.5);color:#f3c1c1"><span class="material-symbols-outlined">error</span><span><b>Short of the target</b> \u2014 your side took ${heroTook} of the ${r.target} tricks needed; the hand finished ${dcolorSuits(resultText(c, r.tricks))}.</span></div>`;
                return `<div class="flex-1 min-h-0 flex flex-col">
                    ${topBarHtml()}
                    <div class="cb-mid" style="max-width:42rem">
                        <div class="cb-done pop-in">
                            ${rateWidgetHtml()}
                            <div class="cb-done-head">
                                <div class="cb-done-score">
                                    <div class="dr-result-big" style="color:#e8e6e3">${dcolorSuits(resultText(c, r.tricks))}</div>
                                    <div class="cb-done-tricks">by ${decl} \u00b7 ${r.tricks || 0} trick${r.tricks === 1 ? "" : "s"}${r.claimed ? " \u00b7 claimed" : ""}${r.botted ? " \u00b7 bots finished" : ""}</div>
                                </div>
                                <div class="cb-done-par"><div class="lbl">Wrong picks</div><div class="val">${r.wrong || 0}</div></div>
                            </div>
                            ${grade}
                            ${state.hands ? doneDiagramHtml(state.hands, state.heroSeat, state.dealer, state.calls) : ""}
                            ${(state.problemComment || state.bidComment) ? `<div style="display:flex;flex-direction:column;gap:.4rem">
                                ${state.problemComment ? `<div><div class="dr-label">Problem / defence</div><div class="dr-comment">${suitify(state.problemComment)}</div></div>` : ""}
                                ${state.bidComment ? `<div><div class="dr-label">Bidding</div><div class="dr-comment">${suitify(state.bidComment)}</div></div>` : ""}
                            </div>` : ""}
                            ${state.explanation ? `<div><div class="dr-label">Explanation</div><div class="dr-comment">${suitify(state.explanation)}</div></div>` : ""}
                            <div><div class="dr-label">The author's line</div>${lineReviewHtml()}</div>
                            <div class="cb-done-foot" style="gap:.5rem">
                                <button id="drAgainBtn" class="dr-btn gold"><span class="material-symbols-outlined">restart_alt</span>Practise again</button>
                                <button id="drLibBtn" class="dr-btn ghost"><span class="material-symbols-outlined">library_books</span>Library</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }
            function sessionHtml() {
                const plays = state.plays || [];
                const doneRevealed = state.phase === "done" && revealCount >= plays.length;
                if (doneRevealed) return doneViewHtml();
                return `<div class="flex-1 min-h-0 flex flex-col">
                    ${topBarHtml()}
                    <div class="cb-playview${wrongFlash ? " wrong" : ""}">
                        ${playTableView()}
                        ${playFanHtml()}
                    </div>
                </div>`;
            }
            function loginCardHtml() {
                return `<div class="dr-wrap"><div class="cb-ready pop-in">
                    <span class="material-symbols-outlined text-4xl text-[#e8e6e3]" style="font-variation-settings:'FILL' 1;">style</span>
                    <p class="font-headline font-extrabold text-xl text-white mt-3">Card problems</p>
                    <p class="text-xs text-[#908f8d] mt-2 leading-relaxed max-w-xs">Log in to author scripted card-play problems and practise the community library.</p>
                    <button id="loginBtn" class="dr-btn gold mt-5">Log in</button>
                </div></div>`;
            }

            // ===================== Lobby =====================
            async function loadArchives() {
                try {
                    const r = await api("GET", "/api/drill-archives");
                    archives = (r.ok && r.data && r.data.archives) ? r.data.archives : [];
                } catch (e) { archives = archives || []; }
                if (selArchive !== "all" && !selectedArchive()) selArchive = "all";
            }
            async function loadLibrary() {
                try {
                    const r = await api("GET", "/api/drills");
                    library = (r.ok && r.data && r.data.problems) ? r.data.problems : [];
                } catch (e) { library = library || []; }
                await loadArchives();
                render();
            }
            function selectedArchive() {
                return selArchive === "all" ? null : (archives || []).find((a) => a.id === selArchive) || null;
            }
            function inSelectedArchive(id) {
                const a = selectedArchive();
                return !!a && (a.drillIds || []).includes(id);
            }
            function filteredLibrary() {
                const arch = selectedArchive();
                const q = filters.search || "";
                return (library || []).filter((p) =>
                    (filters.role === "all" || p.role === filters.role) &&
                    (filters.difficulty === 0 || p.difficulty === filters.difficulty) &&
                    (filters.author === "all" || p.owner === filters.author) &&
                    (filters.played === "all" || !!p.played === (filters.played === "played")) &&
                    (!arch || (arch.drillIds || []).includes(p.id)) &&
                    (!q || (p.title || "").toLowerCase().includes(q) ||
                        (p.owner || "").toLowerCase().includes(q) ||
                        contractLabel(p).toLowerCase().includes(q)));
            }
            function authors() {
                const s = new Set((library || []).map((p) => p.owner));
                return [...s].sort();
            }
            function ratingBadge(p) {
                const n = p.ratings || 0;
                if (!n) return `<span class="dr-rate dr-rate-empty" title="No ratings yet"><span class="material-symbols-outlined">star</span>new</span>`;
                const r = (p.rating || 0).toFixed(1);
                return `<span class="dr-rate" title="Average rating"><span class="material-symbols-outlined">star</span>${r} <span class="cnt">\u00b7 ${n}</span></span>`;
            }
            function problemRow(p, mine) {
                const title = p.title || contractLabel(p);
                const badge = p.role === "declarer"
                    ? `<span class="dr-badge decl">declarer</span>`
                    : `<span class="dr-badge def">defense</span>`;
                const arch = selectedArchive();
                const bm = arch
                    ? `<button class="dr-btn ghost" data-arch-toggle="${p.id}" title="${inSelectedArchive(p.id) ? "Remove from" : "Add to"} ${escapeHtml(arch.name)}"><span class="material-symbols-outlined" style="${inSelectedArchive(p.id) ? "font-variation-settings:'FILL' 1;color:#cbb3ff" : ""}">${inSelectedArchive(p.id) ? "bookmark" : "bookmark_border"}</span></button>`
                    : "";
                const right = mine
                    ? `<button class="dr-btn ghost" data-edit="${p.id}"><span class="material-symbols-outlined">edit</span>Edit</button>
                       <button class="dr-btn danger" data-del="${p.id}"><span class="material-symbols-outlined">delete</span></button>`
                    : `<button class="dr-btn gold" data-practice="${p.id}"><span class="material-symbols-outlined">playing_cards</span>Practise</button>`;
                return `<div class="dr-row${p.played ? " played" : ""}"${p.played ? ` title="You finished this problem"` : ""}>
                    <div class="dr-title">${escapeHtml(title)}</div>
                    <div class="dr-actions">${bm}${right}</div>
                    <div class="dr-sub">${badge} <span class="dr-lbl">diff</span>${stars(p.difficulty)} <span class="dr-lbl">rating</span>${ratingBadge(p)} \u00b7 ${dcolorSuits(contractLabel(p))} \u00b7 ${escapeHtml(p.owner)}${p.updated ? " \u00b7 " + timeAgo(p.updated) : ""}</div>
                </div>`;
            }
            function contractLabel(p) { return p.contract || "auction"; }
            function filterChip(label, on, attr, val) {
                return `<button class="dr-chip${on ? " on" : ""}" data-filter="${attr}" data-val="${val}">${label}</button>`;
            }
            function archiveOptions() {
                return ['<option value="all">All problems</option>']
                    .concat((archives || []).map((a) =>
                        `<option value="${a.id}"${selArchive === a.id ? " selected" : ""}>${escapeHtml(a.name)} (${(a.drillIds || []).length})</option>`)).join("");
            }
            function libraryListHtml(list) {
                if (list === undefined) list = filteredLibrary();
                return list.length ? list.map((p) => problemRow(p, false)).join("")
                    : `<div class="dr-empty">No problems match. ${selectedArchive() ? "Use \u201cAdd problems\u201d in the Archives panel to fill this archive." : (library && library.length ? "Try loosening the filters." : "Be the first to author one in the Create tab.")}</div>`;
            }
            function practiceTabHtml() {
                const list = filteredLibrary();
                const arch = selectedArchive();
                const authOpts = ['<option value="all">Everyone</option>']
                    .concat(authors().map((a) => `<option value="${escapeHtml(a)}"${filters.author === a ? " selected" : ""}>${escapeHtml(a)}</option>`)).join("");
                return `<div class="dr-panel">
                    <h3><span class="material-symbols-outlined" style="font-size:18px">inventory_2</span>Archives</h3>
                    <div class="dr-filters" style="align-items:center">
                        <select class="dr-input" id="drArchive" style="max-width:16rem;padding:.4rem .6rem">${archiveOptions()}</select>
                        <button class="dr-btn ghost" id="drArchNew"><span class="material-symbols-outlined">create_new_folder</span>New</button>
                        ${arch ? `<button class="dr-btn ghost" id="drArchAdd" title="Add problems to this archive"><span class="material-symbols-outlined">playlist_add</span>Add problems</button>` : ""}
                        ${arch ? `<button class="dr-btn danger" id="drArchDel" title="Delete this archive"><span class="material-symbols-outlined">delete</span></button>` : ""}
                    </div>

                    <div class="dr-filters">
                        ${filterChip("Any \u2605", filters.difficulty === 0, "difficulty", "0")}
                        ${[1, 2, 3, 4, 5].map((d) => filterChip("\u2605".repeat(d), filters.difficulty === d, "difficulty", String(d))).join("")}
                    </div>
                    <div class="dr-filters">
                        ${filterChip("Played + unplayed", filters.played === "all", "played", "all")}
                        ${filterChip("\u2713 Played", filters.played === "played", "played", "played")}
