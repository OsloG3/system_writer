                const target =
                    team && !state.noBoard ? nextTeamBoardTarget() : null;
                const jump =
                    target !== null
                        ? `<button id="jumpHandBtn" class="cb-nexthand" title="Go to the next hand where it is your turn to bid">
                               <span class="material-symbols-outlined text-sm">touch_app</span>Next hand
                           </button>`
                        : "";
                const bell = team
                    ? `<button id="alertBellBtn" class="cb-iconbtn" title="${turnAlertsOn ? "Turn alerts on (also while the page is closed) — tap to disable" : "Turn alerts off — tap to enable"}" style="${turnAlertsOn ? "color:#f2ca4c;" : "opacity:.5;"}">
                           <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' ${turnAlertsOn ? 1 : 0};">${turnAlertsOn ? "notifications_active" : "notifications_off"}</span>
                       </button>`
                    : "";
                const menu = `
                    <div class="cb-menuwrap">
                        <button id="cbMenuBtn" class="cb-plainbtn" title="Menu">
                            <span class="material-symbols-outlined">menu</span>
                        </button>
                        <div id="cbMenu" class="cb-menu" style="display:none;">
                            <button id="historyBtn"><span class="material-symbols-outlined text-base">history</span>Past boards</button>
                            ${team && state.matchDone ? `<button id="newMatchBtn"><span class="material-symbols-outlined text-base">restart_alt</span>Start next match</button>` : ""}
                            ${!team ? `<button id="abandonBtn"><span class="material-symbols-outlined text-base">casino</span>New board</button>` : ""}
                            <button id="leaveBtn"><span class="material-symbols-outlined text-base">logout</span>${team ? "Leave table" : "Leave board"}</button>
                        </div>
                    </div>`;
                return `
                    <div class="cb-topbar">
                        <button id="backBtn" class="cb-plainbtn" title="Back to lobby">
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <div class="cb-title">
                            <div class="t">Hand ${no}</div>
                            <div class="s">${sub}</div>
                        </div>
                        ${arrows}${jump}${bell}${menu}
                    </div>`;
            }

            // ---- Card-play rendering ----
            // During the play phase the human sees their own hand and the dummy
            // face up; the two hidden seats are card backs with a count. The
            // declarer-side bot plays declarer and dummy, so when the human is
            // declarer they click cards for both those seats.

            const PLAY_RANK_ORDER = "AKQJT98765432";

            function handToCards(handStr) {
                const parts = String(handStr || "").split(".");
                const out = [];
                for (let s = 0; s < 4; s++)
                    for (const r of parts[s] || "") out.push(r + "SHDC"[s]);
                return out;
            }

            function origHandOf(seat) {
                if (!state.play) return null;
                if (seat === state.humanSeat) return state.hand;
                if (seat === state.play.dummy) return state.play.dummyHand;
                return null;
            }

            function remainingOf(seat) {
                const orig = origHandOf(seat);
                if (orig == null) return null;
                const played = new Set(
                    (state.play.plays || [])
                        .filter((p) => p.seat === seat)
                        .map((p) => p.card),
                );
                return handToCards(orig).filter((c) => !played.has(c));
            }

            function trickWinnerJS(trick, trump) {
                let win = trick[0];
                for (let i = 1; i < trick.length; i++) {
                    const c = trick[i];
                    if (c.card[1] === win.card[1]) {
                        if (
                            PLAY_RANK_ORDER.indexOf(c.card[0]) <
                            PLAY_RANK_ORDER.indexOf(win.card[0])
                        )
                            win = c;
                    } else if (c.card[1] === trump) {
                        win = c;
                    }
                }
                return win.seat;
            }

            function pcard(token, cls, dataAttr) {
                const r = token[0],
                    s = token[1];
                const red = s === "H" || s === "D";
                const rank = r === "T" ? "10" : r;
                return `<div class="cb-pcard ${red ? "red" : "blk"} ${cls || ""}" ${dataAttr || ""}><span>${rank}</span><span class="su">${SUIT_SYMBOL[s]}</span></div>`;
            }

            function cardSpan(token) {
                const r = token[0],
                    s = token[1];
                const red = s === "H" || s === "D";
                const rank = r === "T" ? "10" : r;
                return `<span style="color:${red ? "#f08a8a" : "#cdd7e4"};font-weight:600">${rank}${SUIT_SYMBOL[s]}</span>`;
            }

            function playSeatHtml(seat) {
                const p = state.play;
                const isDummy = seat === p.dummy;
                const isDecl = seat === p.declarer;
                const isYou = seat === state.humanSeat;
                const faceUp = isDummy || isYou;
                const acting = p.yourTurn && p.actSeat === seat;
                const botActing = !p.yourTurn && p.nextSeat === seat;
                const tags = [];
                if (isYou) tags.push('<span class="you">you</span>');
                if (isDecl) tags.push('<span class="role">declarer</span>');
                else if (isDummy) tags.push('<span class="role">dummy</span>');
                let body;
                if (faceUp) {
                    const cards = remainingOf(seat) || [];
                    const legalSet = new Set(acting ? p.legal || [] : []);
                    body =
                        `<div class="cb-phand">` +
                        cards
                            .map((c) => {
                                if (!acting) return pcard(c);
                                const ok = legalSet.has(c);
                                return pcard(
                                    c,
                                    ok ? "playable" : "spent",
                                    ok ? `data-play="${c}"` : "",
                                );
                            })
                            .join("") +
                        `</div>`;
                } else {
                    const cnt = (p.counts || [])[seat] || 0;
                    let backs = "";
                    const shown = Math.min(cnt, 6);
                    for (let i = 0; i < shown; i++)
                        backs += `<div class="cb-pback"></div>`;
                    body = `<div class="cb-pbacks">${backs}</div><div class="cb-pcount">${cnt}</div>`;
                }
                const actCls = acting || botActing ? " act" : "";
                return `<div class="cb-pseat${actCls}">
                    <div class="cb-pseat-name">${SEAT_NAMES[seat]} ${tags.join(" ")}</div>
                    ${body}
                </div>`;
            }

            function trickToDisplay() {
                const plays = state.play.plays || [];
                const n = plays.length;
                const cur = plays.slice(Math.floor(n / 4) * 4);
                if (cur.length) return { cards: cur, complete: false };
                if (n >= 4)
                    return { cards: plays.slice(n - 4, n), complete: true };
                return { cards: [], complete: false };
            }

            function trickCenterHtml() {
                const p = state.play;
                const td = trickToDisplay();
                if (!td.cards.length)
                    return `<div class="cb-ptrick"><div class="cb-ptrick-empty">${SEAT_NAMES[p.opener]} to lead</div></div>`;
                const win = td.complete
                    ? trickWinnerJS(td.cards, p.trump)
                    : null;
                const pos = { 0: "tk-n", 1: "tk-e", 2: "tk-s", 3: "tk-w" };
                const cells = td.cards
                    .map((pc) => {
                        const r = pc.card[0],
                            s = pc.card[1];
                        const red = s === "H" || s === "D";
                        const rank = r === "T" ? "10" : r;
                        const w = win !== null && pc.seat === win ? " win" : "";
                        return `<div class="tk ${pos[pc.seat]}"><span class="who">${SEAT_NAMES[pc.seat][0]}</span><div class="tkc ${red ? "red" : "blk"}${w}"><span>${rank}</span><span>${SUIT_SYMBOL[s]}</span></div></div>`;
                    })
                    .join("");
                return `<div class="cb-ptrick">${cells}</div>`;
            }

            function playInfoHtml() {
                const p = state.play;
                const c = p.contract;
                const pen = c
                    ? ["", " doubled", " redoubled"][c.penalty] || ""
                    : "";
                const contractStr = c
                    ? `${c.level}${SUIT_SYMBOL[c.denom]}${pen} by ${SEAT_NAMES[c.declarer]}`
                    : "—";
                const trumpStr = p.trump === "N" ? "NT" : SUIT_SYMBOL[p.trump];
                return `<div class="cb-pinfo">
                    <span>${dcolorSuits(contractStr)}</span>
                    <span class="sep">·</span><span>trump <b>${trumpStr}</b></span>
                    <span class="sep">·</span><span>dummy <b>${SEAT_NAMES[p.dummy]}</b></span>
                </div>`;
            }

            function playTallyHtml() {
                const p = state.play;
                const plays = p.plays || [];
                const humanOnDecl =
                    p.declarer === state.humanSeat ||
                    p.dummy === state.humanSeat;
                const yours = humanOnDecl ? p.declTricks : p.defTricks;
                const theirs = humanOnDecl ? p.defTricks : p.declTricks;
                const trickNo =
                    Math.floor(plays.length / 4) + (plays.length % 4 ? 1 : 0);
                return `<div class="cb-ptally">
                    <span>You <b>${yours}</b></span>
                    <span>Them <b>${theirs}</b></span>
                    <span>Trick <b>${Math.min(13, Math.max(1, trickNo))}</b>/13</span>
                </div>`;
            }

            function playPromptHtml() {
                const p = state.play;
                if (busy) return spinner("Playing the hand…");
                if (p.yourTurn) {
                    const seatName = SEAT_NAMES[p.actSeat];
                    const lead = (p.plays || []).length % 4 === 0 ? "lead" : "play";
                    const who =
                        p.actSeat === p.dummy && p.actSeat !== state.humanSeat
                            ? " (dummy)"
                            : "";
                    return `Your turn — ${lead} from ${seatName}${who}`;
                }
                return spinner(SEAT_NAMES[p.nextSeat] + " is playing…");
            }

            function playHistoryHtml() {
                const p = state.play;
                const plays = p.plays || [];
                const rows = [];
                for (let t = 0; t * 4 + 4 <= plays.length; t++) {
                    const trick = plays.slice(t * 4, t * 4 + 4);
                    const win = trickWinnerJS(trick, p.trump);
                    const cells = trick
                        .map(
                            (pc) =>
                                `${SEAT_NAMES[pc.seat][0]} ${cardSpan(pc.card)}`,
                        )
                        .join(" · ");
                    rows.push(
                        `<div class="cb-phist-row"><span class="no">${t + 1}</span><span class="cd">${cells}</span><span class="wn">${SEAT_NAMES[win][0]} wins</span></div>`,
                    );
                }
                if (!rows.length) return "";
                return `<div class="cb-phist">${rows.join("")}</div>`;
            }

            function playTableView() {
                return `
                    ${playInfoHtml()}
                    <div class="cb-ptable">
                        <div class="cb-pt-n">${playSeatHtml(0)}</div>
                        <div class="cb-pt-w">${playSeatHtml(3)}</div>
                        <div class="cb-pt-c">${trickCenterHtml()}</div>
                        <div class="cb-pt-e">${playSeatHtml(1)}</div>
                        <div class="cb-pt-s">${playSeatHtml(2)}</div>
                    </div>
                    ${playTallyHtml()}
                    <div class="cb-pprompt">${playPromptHtml()}</div>
                    ${playHistoryHtml()}`;
            }

            async function makePlay(card) {
                if (!state || busy || state.done) return;
                if (state.phase !== "play" || !state.play || !state.play.yourTurn)
                    return;
                await post(`/api/play/${state.id}/card`, { card: card });
            }

            function handFooterHtml() {
                if (state.noBoard || !state.hand || state.done) return "";
                if (state.phase === "play") return ""; // hands are on the table
                return `
                    <div class="cb-handfoot">
                        <div class="cb-handlabel">${SEAT_NAMES[state.humanSeat]} ${hcpOf(state.hand)} HCP</div>
                        ${cardFan(state.hand, false)}
                    </div>`;
            }

            function tableView() {
                const team = state.mode === "team";
                let mid;
                let midCls = "cb-mid";
                if (team && state.noBoard) {
                    mid = busy ? dealingHtml() : teamReadyHtml();
                } else if (state.done) {
                    // End of hand: one card — score, par, diagram with the
                    // mini auction at the table's center, next board
                    mid = doneViewHtml();
                } else if (state.phase === "play") {
                    mid = playTableView();
                } else {
                    midCls = "cb-mid cb-mid-bid";
                    const parts = [
                        auctionHtml(
                            state.dealer,
                            state.vuln,
                            state.calls,
                            state.nextSeat,
                            state.humanSeat,
                            state.alerts,
                        ),
                        alertBoxHtml(),
                    ];
                    if (
                        busy ||
                        !state.yourTurn ||
                        (state.yourTurn && !state.legal)
                    ) {
                        parts.push(waitingHtml());
                    } else {
                        parts.push(bidAreaHtml());
                    }
                    mid = parts.join("");
                }
                return `
                    <div class="flex-1 min-h-0 flex flex-col">
                        ${topBarHtml()}
                        <div class="${midCls}">${mid}</div>
                        ${handFooterHtml()}
                    </div>`;
            }

            function statsBarHtml() {
                if (!stats || !stats.boards) return "";
                return `
                    <div class="flex flex-wrap items-center gap-2 mb-4">
                        <span class="cb-pill"><span class="material-symbols-outlined text-base text-[#f2ca4c]">military_tech</span>Avg <b class="font-headline text-sm ${impsColor(stats.avgImps)}">${signed(stats.avgImps.toFixed(2))}</b> IMPs/board vs par</span>
                        <span class="cb-pill"><span class="material-symbols-outlined text-base text-[#43b78d]">style</span><b class="font-headline text-sm">${stats.boards}</b> boards</span>
                        <span class="cb-pill"><span class="material-symbols-outlined text-base text-[#7ea2e8]">trending_up</span>Total <b class="font-headline text-sm ${impsColor(stats.impsTotal)}">${signed(stats.impsTotal)}</b> IMPs</span>
                    </div>`;
            }

            function soloCardHtml() {
                const isPlay = PLAY_MODE === "play";
                const title = isPlay ? "Play a full hand" : "Bid with a bot partner";
                const icon = isPlay ? "casino" : "gavel";
                const desc = isPlay
                    ? "You sit South with a bidding-dt bot as your North partner against two bot opponents. Bid the auction, then play all 13 tricks — the bots choose every card by double-dummy simulation over hands consistent with the bidding. Scored on the tricks you actually take versus double-dummy par."
                    : "You sit South with a bidding-dt bot as your North partner against two bot opponents. Bid the auction; each board is scored in IMPs against double-dummy par. The cards are not played out — pure bidding practice.";
                return `
                    <div class="cb-cardpanel p-5 flex flex-col">
                        <span class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-b from-[#5b8def] to-[#2a5193] shadow-[0_3px_0_rgba(0,0,0,0.25)]">
                            <span class="material-symbols-outlined text-2xl text-white" style="font-variation-settings:'FILL' 1;">${icon}</span>
                        </span>
                        <div class="font-headline font-extrabold text-white mt-3 text-lg">
                            ${title}
                            <span class="ml-1 px-1.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase tracking-wider bg-white/10 text-[#9aa7b8] align-middle">you + bot vs 2 bots</span>
                        </div>
                        <p class="text-sm text-[#9aa7b8] mt-1.5 flex-1 leading-relaxed">
                            ${desc}
                        </p>
                        <button id="dealBtn" class="cb-btn-green mt-4 justify-center !px-5 !py-3 !text-sm">
                            <span class="material-symbols-outlined text-sm">casino</span>${isPlay ? "Deal &amp; play a board" : "Deal a board"}
                        </button>
                    </div>`;
            }

            function teamCardHtml() {
                return `
                    <div class="cb-cardpanel p-5 flex flex-col">
                        <span class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-b from-[#43b78d] to-[#1c5535] shadow-[0_3px_0_rgba(0,0,0,0.25)]">
                            <span class="material-symbols-outlined text-2xl text-white" style="font-variation-settings:'FILL' 1;">group</span>
                        </span>
                        <div class="font-headline font-extrabold text-white mt-3 text-lg">
                            Partner table
                            <span class="ml-1 px-1.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase tracking-wider bg-gold/90 text-on-gold align-middle">2 players vs 2 bots</span>
                        </div>
                        <p class="text-sm text-[#9aa7b8] mt-1.5 flex-1 leading-relaxed">
                            Team up with a partner (North–South) against the East/West bots. Each match is 8 boards dealt all at once — bid them in any order, switching between boards as the auctions unfold. Tables stay open while you are disconnected.
                        </p>
                        <div class="mt-4 flex flex-col gap-2">
                            <input id="partnerName" list="partnerList" placeholder="Partner username" autocomplete="off" class="cb-input" />
                            <datalist id="partnerList"></datalist>
                            <button id="createTableBtn" class="cb-btn-green justify-center !px-5 !py-3 !text-sm">
                                <span class="material-symbols-outlined text-sm">add</span>Create a table
                            </button>
                        </div>
                    </div>`;
            }

            function teamGamesHtml() {
                if (!games || games.length === 0) return "";
                const rows = games
                    .map((g) => {
                        const other = g.yourSeat === 2 ? g.partner : g.host;
                        const label = other
                            ? escapeHtml(other)
                            : "no partner yet";
                        let status, cls;
                        if (g.inProgress && g.yourTurn) {
                            status = "your turn";
                            cls = "bg-gradient-to-b from-[#37b26a] to-[#1e7d47] text-white";
                        } else if (g.inProgress) {
                            status = g.boards
                                ? "match in progress"
                                : "in progress";
                            cls = "bg-white/10 text-[#9aa7b8]";
                        } else {
                            status = g.boards
                                ? "match complete"
                                : "ready to start";
                            cls = "bg-gold/20 text-[#e5c558]";
                        }
                        return `
                        <div class="cb-cardpanel flex items-center gap-3 px-3 py-2.5">
                            <span class="flex items-center justify-center w-9 h-9 rounded-full bg-gradient-to-b from-[#43b78d] to-[#1c5535] shrink-0">
                                <span class="material-symbols-outlined text-lg text-white" style="font-variation-settings:'FILL' 1;">group</span>
                            </span>
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-label font-semibold text-white truncate">You &amp; ${label}</div>
                                <div class="text-[11px] text-[#8fa0b5] font-label">${g.boards} board${g.boards === 1 ? "" : "s"} · ${timeAgo(g.updated)}</div>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider whitespace-nowrap ${cls}">${status}</span>
                            <button data-open-game="${g.id}" class="cb-btn-green !px-4 !py-2 !text-xs">Resume</button>
                            <button data-del-game="${g.id}" title="Delete table" class="shrink-0 flex items-center justify-center w-8 h-8 rounded-full text-[#8fa0b5] hover:bg-[#e2543f]/20 hover:text-[#f08a8a] transition-colors">
                                <span class="material-symbols-outlined text-base">delete</span>
                            </button>
                        </div>`;
                    })
                    .join("");
                return `
                    <div class="mt-6">
                        <div class="text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label mb-2">Your tables</div>
                        <div class="space-y-2">${rows}</div>
                    </div>`;
            }

            function recentHtml() {
                if (!stats || !stats.recent || stats.recent.length === 0)
                    return "";
                const rows = stats.recent
                    .slice(0, 12)
                    .map(
                        (rec) => `
                        <tr class="border-t border-white/5">
                            <td class="px-3 py-1.5 text-xs text-[#8fa0b5] whitespace-nowrap">${timeAgo(rec.ts)}</td>
                            <td class="px-3 py-1.5 text-xs text-[#8fa0b5] whitespace-nowrap">${SEAT_NAMES[rec.dealer][0]} · ${VULN_NAMES[rec.vuln]}</td>
                            <td class="px-3 py-1.5 text-sm font-headline font-semibold text-white">${contractHtml(rec.contract)}</td>
                            <td class="px-3 py-1.5 text-xs text-[#8fa0b5] whitespace-nowrap">${tricksLabel(rec) || "—"} · par ${scoreText(rec.parNs)}</td>
                            <td class="px-3 py-1.5 text-sm font-headline font-bold text-right ${impsColor(rec.imps)}">${signed(rec.imps)}</td>
                        </tr>`,
                    )
                    .join("");
                return `
                    <div class="mt-8">
                        <div class="flex items-center justify-between mb-2">
                            <div class="text-[10px] uppercase tracking-[0.2em] text-[#8fa0b5] font-label font-bold flex items-center gap-1.5">
                                <span class="material-symbols-outlined text-sm text-[#f2ca4c]">history</span>Recent solo boards
                            </div>
                            <button id="historyBtn" class="flex items-center gap-1 text-xs font-label font-semibold text-[#6ee7a0] hover:text-[#8fd694]">
                                <span class="material-symbols-outlined text-sm">style</span>Review cards &amp; auctions
                            </button>
                        </div>
                        <div class="cb-cardpanel overflow-x-auto">
                            <table class="w-full border-collapse min-w-[520px]">
                                <thead><tr>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">When</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">Deal</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">Contract</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">Result</th>
                                    <th class="px-3 py-1.5 text-right text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">IMPs</th>
                                </tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>`;
            }

            function bidTabsHtml() {
                const tab = (id, label, icon, on) => `
                    <button data-bidtab="${id}" class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl font-label text-xs font-bold uppercase tracking-wider transition-all ${on ? "bg-gradient-to-b from-[#37b26a] to-[#1e7d47] text-white shadow-[0_2px_0_rgba(0,0,0,0.3)]" : "bg-white/5 text-[#8fa0b5] hover:bg-white/10"}">
                        <span class="material-symbols-outlined text-sm">${icon}</span>${label}
                    </button>`;
                return `
                    <div class="flex gap-2 mb-3">
                        ${tab("solo", "With a bot partner", "smart_toy", bidTab === "solo")}
                        ${tab("partner", "With a partner", "group", bidTab === "partner")}
                    </div>`;
            }

            function lobbyHtml() {
                if (PLAY_MODE === "play") {
                    return `
                        ${statsBarHtml()}
                        <div class="grid gap-3">${soloCardHtml()}</div>
                        ${recentHtml()}`;
                }
                const body =
                    bidTab === "solo"
                        ? `<div class="grid gap-3">${soloCardHtml()}</div>`
                        : `<div class="grid gap-3">${teamCardHtml()}</div>`;
                return `
                    ${statsBarHtml()}
                    ${bidTabsHtml()}
                    ${body}
                    ${teamGamesHtml()}
                    ${recentHtml()}`;
            }

            function loginCardHtml() {
                return `
                    <div class="cb-cardpanel pop-in py-12 px-6 text-center">
                        <div class="card-fan-deco">
                            <span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span>
                        </div>
                        <p class="text-white text-xl font-headline font-extrabold mt-2">Log in to play</p>
                        <p class="text-sm text-[#9aa7b8] mt-2 max-w-sm mx-auto leading-relaxed">Solo history and persistent partner tables are kept for your account. Climb the IMP ladder.</p>
                        <button id="loginBtn" class="cb-btn-green mt-6 !px-7 !py-3 !text-sm">
                            <span class="material-symbols-outlined text-sm">login</span>
                            Log in
                        </button>
                    </div>`;
            }

            function historyItemFromSolo(rec, idx) {
                return {
                    no: null,
                    ts: rec.ts,
                    dealer: rec.dealer,
                    vuln: rec.vuln,
                    calls: rec.calls || [],
                    contract: rec.contract,
                    tricks: rec.tricks,
                    played: rec.played,
                    parNs: rec.parNs,
                    scoreNs: rec.scoreNs,
                    imps: rec.imps,
                    hands: rec.hands || null,
                };
            }

            function historyItemFromTeam(b) {
                const r = b.result;
                return {
                    no: b.no,
                    match: b.match || 0,
                    ts: null,
                    dealer: b.dealer,
                    vuln: b.vuln,
                    calls: b.calls || [],
                    contract:
                        r && r.contract ? contractString(r.contract) : "passed out",
                    tricks: r ? r.tricks : null,
                    parNs: r ? r.parNs : 0,
                    scoreNs: r ? r.scoreNs : 0,
                    imps: r ? r.imps : 0,
                    hands: b.hands || null,
                };
            }

            async function openHistory() {
                overlay = { items: null, detail: null, loading: true, error: false };
                renderOverlay();
                if (state && state.mode === "team") {
                    try {
                        const res = await fetch(
                            `/api/play/team/${state.id}/history`,
                        );
                        if (res.ok) {
                            const data = await res.json();
                            overlay.items = (data.boards || [])
                                .filter((b) => b.result)
                                .map(historyItemFromTeam);
                            overlay.items.forEach((it, i) => (it.idx = i));
                            // group boards into their matches, newest first
                            const byMatch = new Map();
                            for (const it of overlay.items) {
                                if (!byMatch.has(it.match))
                                    byMatch.set(it.match, []);
                                byMatch.get(it.match).push(it);
                            }
                            overlay.groups = [...byMatch.entries()]
                                .sort((a, b) => b[0] - a[0])
                                .map(([no, boards]) => ({
                                    no,
                                    boards,
                                    total: boards.reduce(
                                        (s, b) => s + (b.imps || 0),
                                        0,
                                    ),
                                }));
                        } else {
                            overlay.error = true;
                        }
                    } catch (e) {
                        overlay.error = true;
                    }
                } else {
                    overlay.items = (stats && stats.recent
                        ? stats.recent
                        : []
                    ).map(historyItemFromSolo);
                }
                overlay.loading = false;
                renderOverlay();
            }

            function closeHistory() {
                overlay = null;
                renderOverlay();
            }

            function tricksLabel(item) {
                if (item.played !== null && item.played !== undefined)
                    return item.tricks !== null && item.tricks !== undefined
                        ? `took ${item.played} (DD ${item.tricks})`
                        : `took ${item.played}`;
                return item.tricks !== null && item.tricks !== undefined
                    ? `${item.tricks} DD tricks`
                    : "";
            }

            function historyRowHtml(item, i) {
                const idx = item.idx !== undefined ? item.idx : i;
                const label = item.no
                    ? "Board " + item.no
                    : timeAgo(item.ts) || "Board";
                const tl = tricksLabel(item);
                const resultTxt = tl ? ` · ${tl}` : "";
                return `
                    <button data-hist-item="${idx}" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left hover:brightness-125 transition-all" style="background:#202836;">
                        <span class="text-xs text-[#8fa0b5] font-label w-20 shrink-0">${label}</span>
                        <span class="text-sm font-headline font-semibold text-white min-w-0 truncate">${contractHtml(item.contract)}</span>
                        <span class="text-xs text-[#8fa0b5] font-label hidden sm:inline">${VULN_NAMES[item.vuln]}${resultTxt}</span>
                        <span class="ml-auto text-xs text-[#8fa0b5] font-label">par ${scoreText(item.parNs)}</span>
                        <span class="text-sm font-headline font-bold ${impsColor(item.imps)} w-10 text-right">${signed(item.imps)}</span>
                    </button>`;
            }

            // One match section: overall IMPs across its boards, then the
            // per-board rows (ascending, like a scoresheet)
            function matchGroupHtml(g) {
                const scored = g.boards.length;
                return `
                    <div class="mb-4">
                        <div class="flex items-center gap-2 px-1 pb-1.5">
                            <span class="text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label font-bold">Match ${g.no}</span>
                            <span class="text-[10px] text-[#8fa0b5] font-label">${scored} board${scored === 1 ? "" : "s"} scored</span>
                            <span class="ml-auto text-[9px] uppercase tracking-widest text-[#8fa0b5] font-label">overall</span>
                            <span class="text-base font-headline font-extrabold ${impsColor(g.total)} w-14 text-right">${signed(g.total, 1)}</span>
                        </div>
                        <div class="space-y-1.5">${g.boards.map((it) => historyRowHtml(it)).join("")}</div>
                    </div>`;
            }

            function historyDetailHtml(item) {
                const youSeat = state ? state.humanSeat : 2;
                const hands = item.hands
                    ? `<div class="mt-3">${handsDiagramHtml(item.hands, youSeat)}</div>`
                    : `<p class="text-xs text-[#8fa0b5] mt-3 italic">Cards were not recorded for this board.</p>`;
                return `
                    <div class="flex items-center gap-2 mb-3">
                        <button id="histBackBtn" class="cb-btn-ghost">
                            <span class="material-symbols-outlined text-sm">arrow_back</span>All boards
                        </button>
                        <div class="font-headline font-bold text-white min-w-0 truncate">${contractHtml(item.contract)}</div>
                        ${item.no ? `<span class="text-xs text-[#8fa0b5] font-label">· board ${item.no}${item.match ? ` · match ${item.match}` : ""}</span>` : ""}
                    </div>
                    <div class="text-xs text-[#8fa0b5] font-label">
                        ${SEAT_NAMES[item.dealer]} dealt · ${VULN_NAMES[item.vuln]} vuln
                        ${tricksLabel(item) ? ` · ${tricksLabel(item)}` : ""}
                        · par ${scoreText(item.parNs)} · your score ${scoreText(item.scoreNs)}
                        · <b class="${impsColor(item.imps)}">${signed(item.imps)} IMPs</b>
                    </div>
                    <div class="mt-3">${auctionHtml(item.dealer, item.vuln, item.calls, null, youSeat)}</div>
                    ${hands}`;
            }

            function historyListHtml() {
                let body;
                if (overlay.loading) {
                    body = `<div class="flex items-center gap-2 py-6 justify-center">${spinner("Loading boards…")}</div>`;
                } else if (overlay.error) {
                    body = `<p class="text-sm text-[#9aa7b8] italic py-6 text-center">Could not load the boards just now.</p>`;
                } else if (overlay.groups) {
                    body = overlay.groups.length
                        ? overlay.groups.map(matchGroupHtml).join("")
                        : `<p class="text-sm text-[#9aa7b8] italic py-6 text-center">No completed boards yet.</p>`;
                } else if (!overlay.items || overlay.items.length === 0) {
                    body = `<p class="text-sm text-[#9aa7b8] italic py-6 text-center">No completed boards yet.</p>`;
                } else {
                    body = `<div class="space-y-1.5">${overlay.items.map(historyRowHtml).join("")}</div>`;
                }
                return `
                    <div class="flex items-center justify-between mb-3">
                        <div class="font-headline font-bold text-white">${overlay.groups ? "Match history" : "Board history"}</div>
                        <button id="histCloseBtn" class="material-symbols-outlined text-[#9aa7b8] hover:text-white">close</button>
                    </div>
                    ${body}`;
            }

            function renderOverlay() {
                let el = document.getElementById("histOverlay");
                if (!overlay) {
                    if (el) el.remove();
                    return;
                }
                if (!el) {
                    el = document.createElement("div");
                    el.id = "histOverlay";
                    document.body.appendChild(el);
                }
                el.className = "history-overlay";
                el.innerHTML = `<div class="history-card">${
                    overlay.detail === null
                        ? historyListHtml()
                        : historyDetailHtml(overlay.detail)
                }</div>`;
                alignHandDiagram(el);
                el.onclick = (e) => {
                    if (e.target === el) closeHistory();
                };
                const close = el.querySelector("#histCloseBtn");
                if (close) close.onclick = closeHistory;
                const back = el.querySelector("#histBackBtn");
                if (back)
                    back.onclick = () => {
                        overlay.detail = null;
                        renderOverlay();
                    };
                el.querySelectorAll("[data-hist-item]").forEach((btn) => {
                    btn.onclick = () => {
                        overlay.detail = overlay.items[parseInt(btn.dataset.histItem, 10)];
                        renderOverlay();
                    };
                });
            }

            function closeMenu() {
                const m = document.getElementById("cbMenu");
                if (m) m.style.display = "none";
            }

            function render() {
                const content = document.getElementById("main-content");
                if (!content) return;
                const header = content.previousElementSibling;
                if (header && header.tagName === "HEADER") {
                    header.style.display = state ? "none" : "";
                }
                const appHeader = document.querySelector("#app > header");
                if (appHeader) appHeader.style.display = state ? "none" : "";
                const sidebar = document.getElementById("sidebar");
                if (sidebar) sidebar.style.display = state ? "none" : "";
                const shell = document.querySelector(".app-shell");
                if (shell) shell.style.paddingTop = state ? "0" : "";
                const wrap = content.parentElement;
                const main = content.closest("main");
                if (main) main.style.overflowY = state ? "hidden" : "";
                if (wrap) {
                    wrap.style.height = state ? "100%" : "";
                    wrap.style.display = state ? "flex" : "";
                    wrap.style.flexDirection = state ? "column" : "";
                    wrap.style.padding = state ? "0" : "";
                }
                content.className = state ? "flex-1 min-h-0 flex flex-col" : "";

                if (!window.currentUser) {
                    content.innerHTML = loginCardHtml();
                    const lb = document.getElementById("loginBtn");
                    if (lb) lb.onclick = () => showAuthDialog("login");
                    renderOverlay();
                    return;
                }
                const prevInput = document.getElementById("partnerName");
                const keepPartner =
                    prevInput && state === null
                        ? {
                              value: prevInput.value,
                              focused: document.activeElement === prevInput,
                              sel: [
                                  prevInput.selectionStart,
                                  prevInput.selectionEnd,
                              ],
                          }
                        : null;
                // Keep following the auction's latest call across re-renders,
                // unless the player scrolled up to review earlier calls
                const prevAuc = document.querySelector(
                    ".cb-mid-bid .cb-auc-body",
                );
                const followAuc =
                    !prevAuc ||
                    prevAuc.scrollHeight -
                        prevAuc.scrollTop -
                        prevAuc.clientHeight <
                        24;
                content.innerHTML = state ? tableView() : lobbyHtml();

                const deal = document.getElementById("dealBtn");
                if (deal) deal.onclick = () => newBoard();
                content.querySelectorAll("[data-bidtab]").forEach((btn) => {
                    btn.onclick = () => {
                        if (busy) return;
                        bidTab = btn.dataset.bidtab;
                        render();
                    };
                });
                const create = document.getElementById("createTableBtn");
                if (create) create.onclick = () => teamCreate();
                const partnerInput = document.getElementById("partnerName");
                if (partnerInput) {
                    if (keepPartner) {
                        partnerInput.value = keepPartner.value;
                        if (keepPartner.focused) {
                            partnerInput.focus();
                            try {
                                partnerInput.setSelectionRange(
                                    keepPartner.sel[0],
                                    keepPartner.sel[1],
                                );
                            } catch (e) {}
                        }
                    }
                    partnerInput.onkeydown = (e) => {
                        if (e.key === "Enter") teamCreate();
                    };
                }
                const partnerList = document.getElementById("partnerList");
                if (partnerList)
                    partnerList.innerHTML = allUsers
                        .filter((u) => u !== window.currentUser)
                        .map((u) => `<option value="${escapeHtml(u)}"></option>`)
                        .join("");
                content.querySelectorAll("[data-open-game]").forEach((btn) => {
                    btn.onclick = () => teamOpen(btn.dataset.openGame);
                });
                content.querySelectorAll("[data-del-game]").forEach((btn) => {
                    btn.onclick = () => teamDelete(btn.dataset.delGame);
                });

                const back = document.getElementById("backBtn");
                if (back) back.onclick = () => leaveTable();
                const prev = document.getElementById("prevHandBtn");
                if (prev)
                    prev.onclick = () => teamSelectBoard(state.boardSel - 1);
                const nxt = document.getElementById("nextHandBtn");
                if (nxt)
                    nxt.onclick = () => teamSelectBoard(state.boardSel + 1);
                const jump = document.getElementById("jumpHandBtn");
                if (jump)
                    jump.onclick = () => {
                        const t = nextTeamBoardTarget();
                        if (t !== null) teamSelectBoard(t);
                    };
                const bell = document.getElementById("alertBellBtn");
                if (bell) bell.onclick = toggleTurnAlerts;
                const mbtn = document.getElementById("cbMenuBtn");
                if (mbtn)
                    mbtn.onclick = (e) => {
                        e.stopPropagation();
                        const m = document.getElementById("cbMenu");
                        m.style.display =
                            m.style.display === "none" ? "block" : "none";
                    };
                const newMatch = document.getElementById("newMatchBtn");
                if (newMatch)
                    newMatch.onclick = () => {
                        closeMenu();
                        teamStart();
                    };
                const history = document.getElementById("historyBtn");
                if (history)
                    history.onclick = () => {
                        closeMenu();
                        openHistory();
                    };
                const leave = document.getElementById("leaveBtn");
                if (leave)
                    leave.onclick = () => {
                        closeMenu();
                        leaveTable();
                    };
                const abandon = document.getElementById("abandonBtn");
                if (abandon)
                    abandon.onclick = () => {
                        closeMenu();
                        newBoard();
                    };
                const next = document.getElementById("nextBoardBtn");
                if (next)
                    next.onclick = () => {
                        if (!state) return;
                        if (state.mode === "team") {
                            if (state.matchDone) {
                                teamStart();
                                return;
                            }
                            const target = nextTeamBoardTarget();
                            if (target) teamSelectBoard(target);
                        } else {
                            newBoard();
                        }
                    };
                content.querySelectorAll("[data-board]").forEach((btn) => {
                    btn.onclick = () =>
                        teamSelectBoard(parseInt(btn.dataset.board, 10));
                });
                wireBidArea(document);
                wireAlertChips(content);
                content.querySelectorAll("[data-play]").forEach((el) => {
                    el.onclick = () => makePlay(el.dataset.play);
                });
                const retry = document.getElementById("retryBtn");
                if (retry) retry.onclick = () => refreshBoard(true);

                updateTitleAlert(state);
                alignHandDiagram(content);
                const aucBody = content.querySelector(
                    ".cb-mid-bid .cb-auc-body",
                );
                if (aucBody && followAuc)
                    aucBody.scrollTop = aucBody.scrollHeight;
                const miniAuc = content.querySelector(".cb-dg-a");
                if (miniAuc) miniAuc.scrollTop = miniAuc.scrollHeight;
                renderOverlay();
                schedulePoll();
            }

            function schedulePoll() {
                clearTimeout(pollTimer);
                pollTimer = null;
                if (!window.currentUser || busy) return;
                if (state && state.mode === "team") {
                    pollTimer = setTimeout(() => refreshBoard(true), 3000);
                    return;
                }
                if (state) {
                    if (
                        !busy &&
                        !state.done &&
                        !state.yourTurn &&
                        autoRetries < 4
                    ) {
                        pollTimer = setTimeout(
                            refreshBoard,
                            1500 + autoRetries * 1500,
                        );
                    }
                    return;
                }
                if (games !== null) pollTimer = setTimeout(refreshLobby, 5000);
            }

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".cb-menuwrap")) closeMenu();
            });

            document.addEventListener("authchange", () => {
                if (window.currentUser) {
                    loadInitial();
                    // bind this browser's push endpoint to the new account
                    if (
                        turnAlertsOn &&
                        typeof Notification !== "undefined" &&
                        Notification.permission === "granted"
                    )
                        pushEnable();
                } else {
                    state = null;
                    stats = null;
                    games = null;
                    render();
                }
            });

            document.addEventListener("visibilitychange", () => {
                if (!document.hidden && pendingTurnToast) {
                    showToast(pendingTurnToast);
                    pendingTurnToast = null;
                }
                if (!document.hidden && state && window.currentUser && !busy)
                    refreshBoard(true);
            });

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/sw.js").catch(() => {});
            }
            refreshAuthState();
        </script>
    </body>
</html>
