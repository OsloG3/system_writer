                        <select class="dr-input" id="drAuthor" style="max-width:14rem;padding:.4rem .6rem">${authOpts}</select>
                        <input class="dr-input" id="drSearch" style="max-width:16rem;padding:.4rem .6rem" placeholder="Search title, author, contract\u2026" value="${escapeHtml(filters.search)}">
                    </div>
                </div>
                <div class="dr-panel">
                    <h3><span class="material-symbols-outlined" style="font-size:18px">library_books</span>${arch ? escapeHtml(arch.name) : "Library"} <span class="dr-sub" id="drLibCount">(${list.length})</span></h3>
                    <div id="drLibList">${libraryListHtml(list)}</div>
                </div>`;
            }
            function createTabHtml() {
                const me = (window.currentUser || "").toLowerCase();
                const mine = (library || []).filter((p) => (p.owner || "").toLowerCase() === me)
                    .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
                return `<div class="dr-panel">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem">
                        <h3 style="margin:0"><span class="material-symbols-outlined" style="font-size:18px">edit_note</span>Your problems <span class="dr-sub">(${mine.length})</span></h3>
                        <button class="dr-btn gold" id="drNewBtn"><span class="material-symbols-outlined">add</span>New</button>
                    </div>
                    ${mine.length ? mine.map((p) => problemRow(p, true)).join("") : `<div class="dr-empty">You have not authored any problems yet. Tap <b>New</b> to build one: pick the deal and auction, add your defensive agreements, then script every card with the reasoning behind the hero's plays.</div>`}
                </div>`;
            }
            function lobbyHtml() {
                return `<div class="dr-wrap">
                    <div class="dr-tabs">
                        <button class="dr-tab${lobbyTab === "practice" ? " on" : ""}" data-tab="practice"><span class="material-symbols-outlined" style="font-size:18px">playing_cards</span>Practice</button>
                        <button class="dr-tab${lobbyTab === "create" ? " on" : ""}" data-tab="create"><span class="material-symbols-outlined" style="font-size:18px">edit_note</span>Create</button>
                    </div>
                    ${busy && !library ? `<div class="dr-panel"><div class="dr-empty">${spinner("Loading\u2026")}</div></div>` : lobbyTab === "practice" ? practiceTabHtml() : createTabHtml()}
                </div>`;
            }

            // ---- session controls ----
            async function startSession(id) {
                busy = true; render();
                try {
                    const r = await api("POST", `/api/drills/${id}/session`);
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Could not start", true); render(); return; }
                    view = "session"; showIntro = true;
                    onSessionState(r.data, true);
                } catch (e) { busy = false; render(); }
            }
            async function resumeSession(id) {
                try {
                    const r = await api("GET", `/api/drill/session/${id}`);
                    if (r.status === 404) { localStorage.removeItem(SESSION_KEY); return; }
                    if (!r.ok) return; // e.g. the sidecar is down mid-bot-phase: keep the key
                    view = "session"; showIntro = false;
                    onSessionState(r.data, true);
                } catch (e) { /* ignore */ }
            }
            async function leaveSession() {
                const id = state && state.id;
                view = "lobby"; state = null; hintMsg = null; wrongMsg = null; showIntro = false;
                clearTimeout(paceTimer);
                clearTimeout(wrongTimer); wrongFlash = false;
                localStorage.removeItem(SESSION_KEY);
                render();
                if (id) { try { await api("DELETE", `/api/drill/session/${id}`); } catch (e) { } }
                loadLibrary();
            }
            function restartSession() {
                const pid = state && state.problemId;
                if (pid) startSession(pid);
            }

            // ===================== Authoring wizard =====================
            const WIZ_STEPS = ["Setup", "Hands", "Auction", "Hero", "Play"];
            function blankLine() { return { plays: [], claim: null, bot: null }; }
            function blankWiz() {
                return {
                    id: null, title: "", role: "defense", difficulty: 3, dealer: 0, vuln: 0,
                    assign: {}, calls: [], bidComment: "", problemComment: "", explanation: "",
                    target: 0, allowWrong: false,
                    heroSeat: -1, lines: [blankLine()], lineIdx: 0, step: 0, selSeat: 2,
                };
            }
            function wizLine() { return wiz.lines[wiz.lineIdx]; }
            function buildHand(assign, seat) {
                const parts = [];
                for (const suit of STORE_SUIT_ORDER) {
                    let ranks = "";
                    for (const r of PLAY_RANK_ORDER) if (assign[r + suit] === seat) ranks += r;
                    parts.push(ranks);
                }
                return parts.join(".");
            }
            function handsFromAssign(assign) { return [0, 1, 2, 3].map((s) => buildHand(assign, s)); }
            function assignFromHands(hands) {
                const a = {};
                for (let s = 0; s < 4; s++) for (const c of handToCards(hands[s] || "")) a[c] = s;
                return a;
            }
            function normLine(l) {
                return {
                    plays: (l.plays || []).map((p) => ({ seat: p.seat, card: p.card, msg: p.msg || "", alts: (p.alts || []).slice() })),
                    claim: l.claim ? { tricks: l.claim.tricks } : null,
                    bot: l.bot ? {} : null,
                };
            }
            function startWiz(existing) {
                if (existing) {
                    const src = (existing.lines && existing.lines.length)
                        ? existing.lines
                        : [{ plays: existing.plays || [], claim: existing.claim || null, bot: null }];
                    wiz = {
                        id: existing.id, title: existing.title || "", role: existing.role, difficulty: existing.difficulty,
                        dealer: existing.dealer, vuln: existing.vuln, assign: assignFromHands(existing.hands),
                        calls: (existing.calls || []).slice(), bidComment: existing.bidComment || "", problemComment: existing.problemComment || "",
                        explanation: existing.explanation || "",
                        target: existing.target || 0, allowWrong: !!existing.allowWrong,
                        heroSeat: existing.heroSeat, lines: src.map(normLine), lineIdx: 0,
                        step: 0, selSeat: 2,
                    };
                } else wiz = blankWiz();
                view = "wizard"; wizModal = null; summaryOpen = false;
                render();
            }
            function wizContract() { return contractFromCalls(wiz.dealer, wiz.calls); }
            function recHeroSeats(contract) {
                if (!contract) return [];
                return wiz.role === "declarer" ? [contract.declarer, (contract.declarer + 2) % 4] : [wiz.heroSeat];
            }
            function handsOk() {
                const h = handsFromAssign(wiz.assign);
                return h.every((x) => x.replace(/\./g, "").length === 13) && Object.keys(wiz.assign).length === 52;
            }
            function auctionOk() { return auctionOver(wiz.calls) && wizContract() !== null; }
            function heroOk() {
                const c = wizContract();
                if (!c) return false;
                if (wiz.role === "declarer") { wiz.heroSeat = c.declarer; return true; }
                return wiz.heroSeat === (c.declarer + 1) % 4 || wiz.heroSeat === (c.declarer + 3) % 4;
            }
            function recNextSeat(contract, line) {
                const plays = (line || wizLine()).plays;
                const n = plays.length;
                if (n === 0) return (contract.declarer + 1) % 4;
                if (n % 4 === 0) {
                    const trick = plays.slice(n - 4, n).map((p) => ({ seat: p.seat, card: p.card }));
                    return trickWinnerJS(trick, contract.denom[0]);
                }
                return (plays[n - 1].seat + 1) % 4;
            }
            function recRemaining(seat, line) {
                const hands = handsFromAssign(wiz.assign);
                const plays = (line || wizLine()).plays;
                const played = new Set(plays.filter((p) => p.seat === seat).map((p) => p.card));
                return handToCards(hands[seat]).filter((c) => !played.has(c));
            }
            function recLegal(seat, contract) {
                const rem = recRemaining(seat);
                const plays = wizLine().plays;
                const n = plays.length;
                if (n % 4 === 0) return rem;
                const lead = plays[Math.floor(n / 4) * 4].card[1];
                const follow = rem.filter((c) => c[1] === lead);
                return follow.length ? follow : rem;
            }
            function recDeclTricks(contract, line) {
                const plays = (line || wizLine()).plays;
                let won = 0;
                for (let t = 0; t * 4 + 4 <= plays.length; t++) {
                    const trick = plays.slice(t * 4, t * 4 + 4).map((p) => ({ seat: p.seat, card: p.card }));
                    const w = trickWinnerJS(trick, contract.denom[0]);
                    if (w === contract.declarer || w === (contract.declarer + 2) % 4) won++;
                }
                return won;
            }
            // one line is finished when it plays out all 52, claims at a trick
            // boundary, or hands the rest to the bots (the problem's target
            // grades every ending, so a bot end carries no target of its own)
            function lineOk(l, c) {
                const n = l.plays.length;
                const won = recDeclTricks(c, l);
                if (l.claim) {
                    if (n < 4 || n % 4 !== 0) return false;
                    const rem = Math.floor((52 - n) / 4);
                    return l.claim.tricks >= won && l.claim.tricks <= won + rem;
                }
                if (l.bot) return n < 52;
                return n === 52;
            }
            function targetSide() { return wiz.role === "declarer" ? "declarer's side" : "defence"; }
            function playOk() {
                const c = wizContract();
                if (!c || !heroOk()) return false;
                if (!(wiz.target >= 1 && wiz.target <= 13)) return false;
                return wiz.lines.length > 0 && wiz.lines.every((l) => lineOk(l, c));
            }
            function stepOk(step) {
                if (step === 1) return handsOk();
                if (step === 2) return auctionOk();
                if (step === 3) return heroOk();
                if (step === 4) return playOk();
                return true;
            }

            // ---- wizard step HTML ----
            function segBtns(attr, opts, cur) {
                return `<div class="dr-seg">` + opts.map((o) =>
                    `<button data-${attr}="${o.v}" class="${String(cur) === String(o.v) ? "on" : ""}">${o.label}</button>`).join("") + `</div>`;
            }
            function wizStepSetup() {
                return `
                <div class="dr-field"><label class="dr-label">Title (optional)</label>
                    <input class="dr-input" id="wizTitle" maxlength="60" placeholder="e.g. Strip squeeze, board 4" value="${escapeHtml(wiz.title)}"></div>
                <div class="dr-field"><label class="dr-label">Difficulty</label>
                    ${segBtns("diff", [1, 2, 3, 4, 5].map((d) => ({ v: d, label: "\u2605".repeat(d) })), wiz.difficulty)}</div>
                <div class="dr-field"><label class="dr-label">Dealer</label>
                    ${segBtns("dealer", [0, 1, 2, 3].map((s) => ({ v: s, label: SEAT_NAMES[s] })), wiz.dealer)}</div>
                <div class="dr-field"><label class="dr-label">Vulnerability</label>
                    ${segBtns("vuln", [0, 1, 2, 3].map((v) => ({ v, label: VULN_NAMES[v] })), wiz.vuln)}</div>
                <div class="dr-field"><label class="dr-label">Problem type (who is tested)</label>
                    ${segBtns("role", [{ v: "declarer", label: "Declarer play" }, { v: "defense", label: "Defense" }], wiz.role)}</div>`;
            }
            function deckHtml() {
                const suits = [["S", "\u2660"], ["H", "\u2665"], ["D", "\u2666"], ["C", "\u2663"]];
                return suits.map(([suit, sym]) => {
                    const red = suit === "H" || suit === "D";
                    let cells = "";
                    for (const r of PLAY_RANK_ORDER) {
                        const tok = r + suit, owner = wiz.assign[tok];
                        const cls = owner === undefined ? "free" : "s" + owner;
                        const badge = owner === undefined ? "" : `<span class="own">${"NESW"[owner]}</span>`;
                        cells += `<div class="dr-dcard ${red ? "red" : "blk"} ${cls}" data-card="${tok}">${r === "T" ? "10" : r}<span class="sym">${sym}</span>${badge}</div>`;
                    }
                    return `<div style="display:flex;align-items:center;gap:.4rem;margin-top:.3rem">
                        <span style="width:1rem;color:${red ? "#f08a8a" : "#8fd694"}">${sym}</span>
                        <div class="dr-deck" style="flex:1">${cells}</div></div>`;
                }).join("");
            }
            function fmtHand(h) {
                const parts = String(h || "").split(".");
                const suits = [["\u2660", 0], ["\u2665", 1], ["\u2666", 2], ["\u2663", 3]];
                return suits.map(([sym, i]) => {
                    const r = (parts[i] || "").split("").map((x) => x === "T" ? "10" : x).join(" ");
                    return `<span style="color:${i === 1 || i === 2 ? "#f08a8a" : "#8fd694"}">${sym}</span> ${r || "\u2014"}`;
                }).join("<br>");
            }
            function handBoxesHtml() {
                const hands = handsFromAssign(wiz.assign);
                return `<div class="dr-hands4">` + [0, 1, 2, 3].map((s) => {
                    const cnt = Object.values(wiz.assign).filter((x) => x === s).length;
                    return `<div class="dr-handbox${wiz.selSeat === s ? " sel" : ""}" data-sel="${s}">
                        <div class="hd"><span>${SEAT_NAMES[s]}</span><span class="cnt${cnt === 13 ? " ok" : ""}">${cnt}/13</span></div>
                        <div class="body">${fmtHand(hands[s])}</div></div>`;
                }).join("") + `</div>`;
            }
            function wizStepHands() {
                return `<div class="dr-hint">Tap a seat below to select it, then tap cards to deal them to that seat. Tapping a dealt card re-assigns it to the selected seat; tap a card already in the selected seat to clear it.</div>
                    ${handBoxesHtml()}
                    <div style="margin-top:.7rem">${deckHtml()}</div>
                    <div class="dr-nav"><span class="dr-hint">${Object.keys(wiz.assign).length}/52 dealt</span>
                        <button class="dr-btn ghost" id="wizClearHands">Clear</button></div>`;
            }
            function bidBoxHtml() {
                if (auctionOver(wiz.calls))
                    return `<div class="dr-hint">Auction complete \u2014 ${escapeHtml(contractText(wizContract()))}. Use Undo to change it.</div>`;
                const legal = new Set(legalCalls(wiz.dealer, wiz.calls));
                let grid = "";
                for (let lv = 1; lv <= 7; lv++)
                    for (const d of ["C", "D", "H", "S", "N"]) {
                        const tok = lv + d, sym = d === "N" ? "NT" : SUIT_SYMBOL[d];
                        grid += `<button class="cb-tile cb-tile-${TILE_CLS[d]}" data-call="${tok}" ${legal.has(tok) ? "" : "disabled"}>${lv}<b>${sym}</b></button>`;
                    }
                const specials = `<button class="cb-tile cb-tile-x" data-call="X" ${legal.has("X") ? "" : "disabled"}>X</button>
                    <button class="cb-tile cb-tile-xx" data-call="XX" ${legal.has("XX") ? "" : "disabled"}>XX</button>
                    <button class="cb-pass" data-call="P" ${legal.has("P") ? "" : "disabled"}>Pass</button>`;
                return `<div class="cb-bidpanel" style="display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem">${grid}</div>
                    <div class="cb-bidpanel" style="margin-top:.4rem;justify-content:center;gap:.5rem">${specials}</div>`;
            }
            function wizStepAuction() {
                const next = auctionOver(wiz.calls) ? null : (wiz.dealer + wiz.calls.length) % 4;
                return `<div class="dr-field">${auctionHtml(wiz.dealer, wiz.vuln, wiz.calls, next, wiz.heroSeat >= 0 ? wiz.heroSeat : null)}</div>
                    <div class="dr-field">${bidBoxHtml()}
                        ${wiz.calls.length ? `<div class="dr-nav"><span></span><button class="dr-btn ghost" id="wizUndoCall"><span class="material-symbols-outlined">undo</span>Undo call</button></div>` : ""}</div>
                    <div class="dr-field"><label class="dr-label">Comment about the bidding <span style="text-transform:none;letter-spacing:0;opacity:.7">(!s \u2660 !h \u2665 !d \u2666 !c \u2663)</span></label>
                        <textarea class="dr-input" id="wizBidComment" placeholder="What the auction shows, conventions in play\u2026">${escapeHtml(wiz.bidComment)}</textarea></div>
                    <div class="dr-field"><label class="dr-label">Problem comment \u2014 include the defenders' agreements <span style="text-transform:none;letter-spacing:0;opacity:.7">(!s \u2660 !h \u2665 !d \u2666 !c \u2663)</span></label>
                        <textarea class="dr-input" id="wizProblemComment" placeholder="Defensive carding: leads, signals, discards, count/attitude agreements\u2026">${escapeHtml(wiz.problemComment)}</textarea></div>
                    <div class="dr-field"><label class="dr-label">Explanation \u2014 revealed only after the hand is over <span style="text-transform:none;letter-spacing:0;opacity:.7">(!s \u2660 !h \u2665 !d \u2666 !c \u2663)</span></label>
                        <textarea class="dr-input" id="wizExplanation" placeholder="The explication of the problem: what the point was, why the line works, what to take away\u2026">${escapeHtml(wiz.explanation)}</textarea></div>`;
            }
            function wizStepHero() {
                const c = wizContract();
                if (!c) return `<div class="dr-hint">Complete the auction first.</div>`;
                if (wiz.role === "declarer") {
                    wiz.heroSeat = c.declarer;
                    return `<div class="dr-hint">Declarer problem: the hero is <b>${SEAT_NAMES[c.declarer]}</b> (the declarer), who plays both the closed hand and the dummy. Nothing to choose here.</div>`;
                }
                const defs = [(c.declarer + 1) % 4, (c.declarer + 3) % 4];
                return `<div class="dr-hint" style="margin-bottom:.5rem">Defense problem: choose which defender the hero is. Only that defender's cards carry your reasoning; the other defender, declarer and dummy play themselves from your script.</div>
                    ${segBtns("heroseat", defs.map((s) => ({ v: s, label: SEAT_NAMES[s] })), wiz.heroSeat)}`;
            }
            function recTrickHtml(contract) {
                const plays = wizLine().plays;
                const n = plays.length;
                const cur = plays.slice(Math.floor(n / 4) * 4);
                if (!cur.length) return `<div class="dr-hint">Opening lead by ${SEAT_NAMES[(contract.declarer + 1) % 4]}.</div>`;
                const win = cur.length === 4 ? trickWinnerJS(cur.map((p) => ({ seat: p.seat, card: p.card })), contract.denom[0]) : null;
                return `<div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap">` + cur.map((p) => {
                    const red = p.card[1] === "H" || p.card[1] === "D";
                    const rank = p.card[0] === "T" ? "10" : p.card[0];
                    const wc = win !== null && p.seat === win ? " win" : "";
                    return `<span style="display:inline-flex;flex-direction:column;align-items:center;gap:1px"><span class="dr-tk-seat">${SEAT_NAMES[p.seat][0]}</span><span class="dr-tk-mini ${red ? "red" : "blk"}${wc}">${rank}<br>${SUIT_SYMBOL[p.card[1]]}</span></span>`;
                }).join("") + `</div>`;
            }
            function recHandsHtml(contract) {
                const hands = handsFromAssign(wiz.assign);
                const line = wizLine();
                const next = recNextSeat(contract);
                const legal = new Set(recLegal(next, contract));
                const hero = recHeroSeats(contract);
                const done = line.plays.length === 52 || lineOk(line, contract);
                return [0, 1, 2, 3].map((s) => {
                    const played = new Set(line.plays.filter((p) => p.seat === s).map((p) => p.card));
                    const cards = sortHand(handToCards(hands[s])).map((c) => {
                        const red = c[1] === "H" || c[1] === "D";
                        const rank = c[0] === "T" ? "10" : c[0];
                        const isPlayed = played.has(c);
                        const clickable = !done && s === next && legal.has(c);
                        return `<span class="dr-rc ${red ? "red" : "blk"}${isPlayed ? " played" : ""}${clickable ? " legal" : ""}" ${clickable ? `data-rec="${c}"` : ""}>${rank}<span class="sym">${SUIT_SYMBOL[c[1]]}</span></span>`;
                    }).join("");
                    return `<div class="dr-rechand${!done && s === next ? " act" : ""}">
                        <div class="who">${SEAT_NAMES[s]}${hero.indexOf(s) >= 0 ? " \u2605" : ""}</div>
                        <div class="dr-reccards">${cards}</div></div>`;
                }).join("");
            }
            // compact list of the hero's scripted cards with their reasoning
            // and equivalents, so alts stay visible while recording; every
            // row is tappable to edit that play's hint/alts in place (the
            // line is re-validated, so a bad equivalence cannot break it)
            function scriptSummaryHtml(contract) {
                const line = wizLine();
                const hero = recHeroSeats(contract);
                const rows = line.plays
                    .map((p, i) => ({ p, i }))
                    .filter((x) => hero.indexOf(x.p.seat) >= 0)
                    .map((x) => {
                        const alts = (x.p.alts || []).length ? ` <span style="color:#8fd694">\u2261 ${dcolorSuits(x.p.alts.map(cardNameJS).join(" "))}</span>` : "";
                        const msg = x.p.msg ? ` \u2014 ${suitify(x.p.msg)}` : "";
                        return `<div class="dr-sub dr-scriptrow" data-editplay="${x.i}" title="Edit the hint and equivalent cards"><span class="material-symbols-outlined">edit</span>${Math.floor(x.i / 4) + 1}.${x.i % 4 + 1} ${SEAT_NAMES[x.p.seat][0]} <b style="color:#e8e6e3">${cardNameJS(x.p.card)}</b>${alts}${msg}</div>`;
                    }).join("");
                if (!rows) return "";
                return `<details id="wizScriptSum"${summaryOpen ? " open" : ""} style="margin-top:.5rem"><summary class="dr-hint" style="cursor:pointer">Hero cards scripted (${line.plays.filter((p) => hero.indexOf(p.seat) >= 0).length}) \u2014 tap one to edit its hint</summary>${rows}</details>`;
            }
            function lineTabsHtml(contract) {
                const tabs = wiz.lines.map((l, i) => {
                    const ok = lineOk(l, contract);
                    return `<button class="dr-chip${i === wiz.lineIdx ? " on" : ""}" data-line="${i}">Line ${i + 1}${ok ? " \u2713" : ""} <span style="opacity:.7">${l.plays.length}</span></button>`;
                }).join("");
                return `<div class="dr-filters">
                    ${tabs}
                    <button class="dr-chip" id="wizBranch" title="Copy the plays recorded so far into a new line and record a different continuation"><span class="material-symbols-outlined" style="font-size:14px">call_split</span>Branch here</button>
                    ${wiz.lines.length > 1 ? `<button class="dr-chip" id="wizLineDel" title="Delete this line"><span class="material-symbols-outlined" style="font-size:14px">delete</span></button>` : ""}
                </div>`;
            }
            function wizStepPlay() {
                const c = wizContract();
                if (!c) return `<div class="dr-hint">Complete the auction first.</div>`;
                if (!heroOk()) return `<div class="dr-hint">Choose the hero defender first.</div>`;

            // ---- wizard actions ----

                l.bot = null;

            // ---- editing an old play's hint / equivalents in place ----
            // The script summary rows open the same modal the recording uses,
            // pre-filled; saving re-validates the WHOLE line (mirroring the
            // server's checks in drills.go) so an edit that would break the
            // rest of the line is refused instead of saved.
            function simLinePlays(contract, hands, plays) {
                const trump = contract.denom[0];
                const remaining = [0, 1, 2, 3].map((s) => new Set(handToCards(hands[s])));
                const winners = [];
                let next = (contract.declarer + 1) % 4;
                for (let i = 0; i < plays.length; i++) {
                    const dp = plays[i];
                    if (dp.seat !== next) return { winners, error: `play ${i + 1}: ${SEAT_NAMES[dp.seat]} is out of turn` };
                    if (!remaining[dp.seat].has(dp.card)) return { winners, error: `play ${i + 1}: ${SEAT_NAMES[dp.seat]} does not hold ${cardNameJS(dp.card)}` };
                    if (i % 4 > 0) {
                        const lead = plays[Math.floor(i / 4) * 4].card[1];
                        if (dp.card[1] !== lead) {
                            let has = false;
                            for (const c of remaining[dp.seat]) if (c[1] === lead) { has = true; break; }
                            if (has) return { winners, error: `play ${i + 1}: ${SEAT_NAMES[dp.seat]} must follow suit` };
                        }
                    }
                    remaining[dp.seat].delete(dp.card);
                    if ((i + 1) % 4 === 0) {
                        const w = trickWinnerJS(plays.slice(i - 3, i + 1).map((q) => ({ seat: q.seat, card: q.card })), trump);
                        winners.push(w);
                        next = w;
                    } else next = (dp.seat + 1) % 4;
                }
                return { winners, error: null };
            }
            // union-find of each hero play with its declared alternatives, per
            // seat (same shape as DrillLine.buildClasses on the server)
            function buildLineClasses(hero, plays) {
                const parent = {};
                const find = (seat, c) => {
                    if (!parent[seat]) parent[seat] = {};
                    const m = parent[seat];
                    if (!(c in m)) m[c] = c;
                    while (m[c] !== c) c = m[c];
                    return c;
                };
                for (const dp of plays) {
                    if (hero.indexOf(dp.seat) < 0 || !(dp.alts && dp.alts.length)) continue;
                    const root = find(dp.seat, dp.card);
                    for (const a of dp.alts) {
                        const ra = find(dp.seat, a);
                        if (ra !== root) parent[dp.seat][ra] = root;
                    }
                }
                return parent;
            }
            function lineClassRoot(classes, seat, card) {
                const m = classes[seat];
                if (!m || !(card in m)) return card;

                while (m[c] !== c) c = m[c];
                return c;

            function lineClassMembers(classes, seat, card) {
                if (!classes[seat]) return [card];
                const root = lineClassRoot(classes, seat, card);
                const out = Object.keys(classes[seat]).filter((c) => lineClassRoot(classes, seat, c) === root);
                out.sort();
                return out.length ? out : [card];
            }
            // every injective assignment of a class's members onto the class's
            // scripted positions must stay legal and keep every trick winner
            function validateLineEquivalence(contract, hands, plays, hero, baseWinners) {
                const classes = buildLineClasses(hero, plays);
                const checked = {};
                for (const dp of plays) {
                    if (hero.indexOf(dp.seat) < 0) continue;
                    const root = lineClassRoot(classes, dp.seat, dp.card);
                    const key = dp.seat + "|" + root;
                    if (checked[key]) continue;
                    const members = lineClassMembers(classes, dp.seat, dp.card);
                    if (members.length < 2) continue;
                    checked[key] = true;
                    const positions = [];
                    plays.forEach((q, j) => { if (q.seat === dp.seat && lineClassRoot(classes, dp.seat, q.card) === root) positions.push(j); });
                    let perms = 1, tooBig = false;
                    for (let k = 0; k < positions.length; k++) {
                        if (members.length - k <= 0) break;
                        perms *= members.length - k;
                        if (perms > 5000) { tooBig = true; break; }
                    }
                    const names = members.map(cardNameJS).join(" ");
                    if (tooBig) return `${SEAT_NAMES[dp.seat]}'s group (${names}) is too large to verify \u2014 narrow the alternatives`;
                    const used = new Array(members.length).fill(false);
                    const pick = new Array(positions.length);
                    const rec = (k) => {
                        if (k === positions.length) {
                            const swapped = plays.map((q) => ({ seat: q.seat, card: q.card }));
                            positions.forEach((pos, idx) => { swapped[pos].card = pick[idx]; });
                            const r = simLinePlays(contract, hands, swapped);
                            if (r.error) return r.error;
                            for (let t = 0; t < r.winners.length && t < baseWinners.length; t++)
                                if (r.winners[t] !== baseWinners[t]) return `the winner of trick ${t + 1} would change`;
                            return null;
                        }
                        for (let mi = 0; mi < members.length; mi++) {
                            if (used[mi]) continue;
                            used[mi] = true; pick[k] = members[mi];
                            const err = rec(k + 1);
                            used[mi] = false;
                            if (err) return err;
                        }
                        return null;
                    };
                    const err = rec(0);
                    if (err) return `${SEAT_NAMES[dp.seat]}'s equivalent cards (${names}) are not interchangeable: ${err} \u2014 give separate lines for that choice`;
                }
                return null;
            }

                const line = wizLine();
                const p = line.plays[index];
                if (!p) return "No such play";
                const hands = handsFromAssign(wiz.assign);
                const held = handToCards(hands[p.seat]);
                for (const a of alts) {

                    if (held.indexOf(a) < 0) return `${SEAT_NAMES[p.seat]} does not hold ${cardNameJS(a)}`;
                }
                const prev = p.alts || [];
                const unchanged = alts.length === prev.length && alts.every((a) => prev.indexOf(a) >= 0);
                if (!unchanged) {
                    const trial = line.plays.map((q, j) => ({
                        seat: q.seat, card: q.card,
                        alts: j === index ? alts.slice() : (q.alts || []).slice(),
                    }));
                    const base = simLinePlays(c, hands, trial);

            function openClaimModal() {

            async function saveWiz() {

                const lines = wiz.lines.map((l) => {

                    if (l.claim) o.claim = { tricks: l.claim.tricks };
                    if (l.bot) o.bot = {};
                    return o;
                });
                const problem = {
                    title: (wiz.title || "").trim(), role: wiz.role, heroSeat: wiz.heroSeat,
                    difficulty: wiz.difficulty, dealer: wiz.dealer, vuln: wiz.vuln,
                    hands: handsFromAssign(wiz.assign), calls: wiz.calls,
                    bidComment: wiz.bidComment, problemComment: wiz.problemComment,
                    explanation: wiz.explanation,
                    target: wiz.target, allowWrong: wiz.allowWrong || undefined,
                    lines,
                };
                busy = true; render();
                try {
                    const r = wiz.id ? await api("PUT", `/api/drills/${wiz.id}`, problem) : await api("POST", "/api/drills", problem);
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Save failed", true); render(); return; }
                    showToast("Problem saved");
                    wiz = null; view = "lobby"; lobbyTab = "create"; render(); loadLibrary();
                } catch (e) { busy = false; render(); }
            }
            async function editProblem(id) {
                busy = true; render();
                try {
                    const r = await api("GET", `/api/drills/${id}`);
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Cannot open", true); render(); return; }
                    startWiz(r.data);
                } catch (e) { busy = false; render(); }
            }
            async function deleteProblem(id) {
                busy = true; render();
                try {
                    const r = await api("DELETE", `/api/drills/${id}`);
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Delete failed", true); render(); return; }
                    showToast("Deleted"); modal = null; render(); loadLibrary();
                } catch (e) { busy = false; render(); }
            }

            // ---- archives ----
            async function createArchive(name) {
                busy = true; render();
                try {
                    const r = await api("POST", "/api/drill-archives", { name });
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Could not create the archive", true); render(); return; }
                    modal = null;
                    await loadArchives();
                    if (r.data && r.data.id) selArchive = r.data.id;
                    showToast("Archive created");
                    render();
                } catch (e) { busy = false; render(); }
            }
            async function deleteArchive(id) {
                busy = true; render();
                try {
                    const r = await api("DELETE", `/api/drill-archives/${id}`);
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Delete failed", true); render(); return; }
                    modal = null; selArchive = "all";
                    await loadArchives();
                    showToast("Archive deleted");
                    render();
                } catch (e) { busy = false; render(); }
            }
            // add several problems to the selected archive in one go
            async function addDrillsToArchive(ids) {
                const arch = selectedArchive();
                if (!arch || !ids.length) return;
                busy = true; render();
                try {
                    for (const id of ids) {
                        const r = await api("POST", `/api/drill-archives/${arch.id}/drills`, { drillId: id, action: "add" });
                        if (!r.ok) { showToast((r.data && r.data.error) || "Could not update the archive", true); break; }
                    }
                    await loadArchives();
                    modal = null;
                    showToast("Added to the archive");
                } catch (e) { /* auth handled */ }
                busy = false; render();
            }
            async function toggleArchiveDrill(drillId) {
                const arch = selectedArchive();
                if (!arch) return;
                const remove = (arch.drillIds || []).includes(drillId);
                try {
                    const r = await api("POST", `/api/drill-archives/${arch.id}/drills`, { drillId, action: remove ? "remove" : "add" });
                    if (!r.ok) { showToast((r.data && r.data.error) || "Could not update the archive", true); return; }
                    if (r.data && r.data.drillIds) arch.drillIds = r.data.drillIds;
                    render();
                } catch (e) { /* auth handled */ }
            }
            // live search: only the library list is rebuilt so the input keeps focus
            function refreshLibraryList() {
                const host = document.getElementById("drLibList");
                if (!host) return;
                const list = filteredLibrary();
                host.innerHTML = libraryListHtml(list);
                const cnt = document.getElementById("drLibCount");
                if (cnt) cnt.textContent = `(${list.length})`;
                wireRowEvents();
            }
            function wireRowEvents() {
                document.querySelectorAll("[data-practice]").forEach((el) => {
                    el.onclick = () => startSession(el.getAttribute("data-practice"));
                });
                document.querySelectorAll("[data-edit]").forEach((el) => {
                    el.onclick = () => editProblem(el.getAttribute("data-edit"));
                });
                document.querySelectorAll("[data-del]").forEach((el) => {
                    el.onclick = () => { modal = { kind: "delete", id: el.getAttribute("data-del") }; render(); };
                });
                document.querySelectorAll("[data-arch-toggle]").forEach((el) => {
                    el.onclick = () => toggleArchiveDrill(el.getAttribute("data-arch-toggle"));
                });
            }

            // ===================== Master render =====================
            function render() {
                const content = document.getElementById("main-content");
                if (!content) return;
                syncReveal();
                const full = view === "session" && state; // full-screen play table
                const header = content.previousElementSibling;
                if (header && header.tagName === "HEADER") header.style.display = full ? "none" : "";
                const appHeader = document.querySelector("#app > header");
                if (appHeader) appHeader.style.display = full ? "none" : "";
                const sidebar = document.getElementById("sidebar");
                if (sidebar) sidebar.style.display = full ? "none" : "";
                const shell = document.querySelector(".app-shell");
                if (shell) shell.style.paddingTop = full ? "0" : "";
                const wrap = content.parentElement;
                const main = content.closest("main");
                if (main) main.style.overflowY = full ? "hidden" : "";
                if (wrap) {
                    wrap.style.height = full ? "100%" : "";
                    wrap.style.display = full ? "flex" : "";
                    wrap.style.flexDirection = full ? "column" : "";
                    wrap.style.padding = full ? "0" : "";
                    wrap.style.maxWidth = full ? "none" : "";
                }
                content.className = full ? "flex-1 min-h-0 flex flex-col" : "";
                document.body.classList.toggle("dr-noscroll", !!full);

                if (!window.currentUser) {
                    content.innerHTML = loginCardHtml();
                    const lb = document.getElementById("loginBtn");
                    if (lb) lb.onclick = () => showAuthDialog("login");
                    return;
                }
                if (view === "session" && state) content.innerHTML = sessionHtml();
                else if (view === "wizard" && wiz) content.innerHTML = wizHtml();
                else content.innerHTML = lobbyHtml();

                // overlays (intro briefing + modal) mount on <body>
                document.querySelectorAll("#drIntro, #drModalHost").forEach((n) => n.remove());
                if (view === "session" && state && showIntro) {
                    const d = document.createElement("div");
                    d.innerHTML = introHtml();
                    document.body.appendChild(d.firstElementChild);
                }
                if (modal) {
                    const tmp = document.createElement("div");
                    tmp.innerHTML = modalHtml();
                    const ov = tmp.firstElementChild;
                    if (ov) { ov.id = "drModalHost"; document.body.appendChild(ov); }
                }
                wireEvents();
                if (view === "session") drivePlay();
            }

            function wireEvents() {
                const $ = (id) => document.getElementById(id);
                const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
                // session
                on("drBackBtn", () => leaveSession());
                on("drRestartBtn", () => restartSession());
                on("drAgainBtn", () => restartSession());
                on("drLibBtn", () => { view = "lobby"; state = null; localStorage.removeItem(SESSION_KEY); render(); loadLibrary(); });
                document.querySelectorAll("[data-rate]").forEach((el) => {
                    el.onclick = () => rateProblem(parseInt(el.dataset.rate));
                });
                on("drIntroStart", () => { showIntro = false; render(); });
                on("drIntroClose", () => leaveSession());
                on("drAuctionBtn", () => { showAuction = !showAuction; showNotes = false; render(); });
                on("drNotesBtn", () => { showNotes = !showNotes; showAuction = false; render(); });
                on("drLastTrickBtn", () => { showLastTrick = !showLastTrick; render(); });
                on("drHintClose", () => { hintMsg = null; render(); });
                on("drWrongClose", () => { wrongMsg = null; render(); });
                on("drHintBtn", () => toggleHint());
                document.querySelectorAll("[data-play]").forEach((el) => {
                    el.onclick = () => onCardClick(el.getAttribute("data-play"));
                });
                // lobby
                document.querySelectorAll("[data-tab]").forEach((el) => {
                    el.onclick = () => { lobbyTab = el.dataset.tab; render(); };
                });
                document.querySelectorAll("[data-filter]").forEach((el) => {
                    el.onclick = () => {
                        const attr = el.dataset.filter;
                        let val = el.dataset.val;
                        if (attr === "difficulty") val = parseInt(val);
                        filters[attr] = val;
                        render();
                    };
                });
                const auth = $("drAuthor");
                if (auth) auth.onchange = () => { filters.author = auth.value; render(); };
                const archSel = $("drArchive");
                if (archSel) archSel.onchange = () => { selArchive = archSel.value; render(); };
                on("drArchNew", () => { modal = { kind: "archive" }; render(); });
                on("drArchAdd", () => { modal = { kind: "archiveAdd", sel: new Set() }; render(); });
                on("drArchDel", () => { modal = { kind: "archiveDel", id: selArchive }; render(); });
                const archName = $("archName");
                if (archName) {
                    archName.onkeydown = (e) => { if (e.key === "Enter") { const ok = $("archOk"); if (ok) ok.click(); } };
                    setTimeout(() => archName.focus(), 0);
                }
                const se = $("drSearch");
                if (se) se.oninput = () => { filters.search = se.value.trim().toLowerCase(); refreshLibraryList(); };
                wireRowEvents();
                on("drNewBtn", () => startWiz(null));
                // wizard nav
                on("wizCancel", () => { wiz = null; modal = null; view = "lobby"; render(); });
                on("wizSave", () => saveWiz());
                on("wizBack", () => { if (wiz.step > 0) { wiz.step--; render(); } });
                on("wizNext", () => { if (stepOk(wiz.step) && wiz.step < WIZ_STEPS.length - 1) { wiz.step++; render(); } });
                document.querySelectorAll("[data-goto]").forEach((el) => {
                    el.onclick = () => {
                        const s = parseInt(el.dataset.goto);
                        let ok = true;
                        for (let i = 0; i < s; i++) if (!stepOk(i)) { ok = false; break; }
                        if (ok) { wiz.step = s; render(); }
                        else showToast("Finish the earlier steps first", true);
                    };
                });
                document.querySelectorAll("[data-diff]").forEach((el) => el.onclick = () => wizSet("difficulty", el.dataset.diff));
                document.querySelectorAll("[data-dealer]").forEach((el) => el.onclick = () => wizSet("dealer", el.dataset.dealer));
                document.querySelectorAll("[data-vuln]").forEach((el) => el.onclick = () => wizSet("vuln", el.dataset.vuln));
                document.querySelectorAll("[data-role]").forEach((el) => el.onclick = () => wizSet("role", el.dataset.role));
                document.querySelectorAll("[data-heroseat]").forEach((el) => el.onclick = () => wizSet("heroseat", el.dataset.heroseat));
                document.querySelectorAll("[data-call]").forEach((el) => el.onclick = () => addCall(el.dataset.call));
                document.querySelectorAll("[data-card]").forEach((el) => el.onclick = () => assignCard(el.dataset.card));
                document.querySelectorAll("[data-sel]").forEach((el) => el.onclick = () => { wiz.selSeat = parseInt(el.dataset.sel); render(); });
                document.querySelectorAll("[data-rec]").forEach((el) => el.onclick = () => recCard(el.dataset.rec));
                document.querySelectorAll("[data-editplay]").forEach((el) => {
                    el.onclick = () => openPlayEdit(parseInt(el.getAttribute("data-editplay"), 10));
                });
                const sum = $("wizScriptSum");
                if (sum) sum.ontoggle = () => { summaryOpen = sum.open; };
                on("wizClearHands", () => { wiz.assign = {}; render(); });
                on("wizUndoCall", () => undoCall());
                on("wizUndoPlay", () => recUndo());
                on("wizClaimBtn", () => openClaimModal());
                on("wizBotBtn", () => openBotModal());
                on("wizBranch", () => {
                    const cur = wizLine();
                    wiz.lines.push({ plays: cur.plays.map((p) => ({ seat: p.seat, card: p.card, msg: p.msg, alts: (p.alts || []).slice() })), claim: null, bot: null });
                    wiz.lineIdx = wiz.lines.length - 1;
                    render();
                });
                on("wizLineDel", () => {
                    if (wiz.lines.length <= 1) return;
                    wiz.lines.splice(wiz.lineIdx, 1);
                    wiz.lineIdx = Math.max(0, wiz.lineIdx - 1);
                    render();
                });
                document.querySelectorAll("[data-line]").forEach((el) => el.onclick = () => { wiz.lineIdx = parseInt(el.dataset.line); render(); });
                // text inputs update the draft without re-render (keep focus);
                // comment/reasoning fields also expand !s/!h/!d/!c to suit glyphs
                const bindInput = (id, fn) => { const el = $(id); if (el) el.oninput = () => fn(el.value); };
                const bindSymbol = (id, fn) => {
                    const el = $(id);
                    if (el) el.oninput = () => {
                        const start = el.selectionStart;
                        const t = replaceSymbols(el.value);
                        if (t !== el.value) { el.value = t; try { el.setSelectionRange(start, start); } catch (e) { } }
                        fn(el.value);
                    };
                };
                bindInput("wizTitle", (v) => { wiz.title = v; });
                bindSymbol("wizBidComment", (v) => { wiz.bidComment = v; });
                bindSymbol("wizProblemComment", (v) => { wiz.problemComment = v; });
                bindSymbol("wizExplanation", (v) => { wiz.explanation = v; });
                bindSymbol("msgText", (v) => { if (modal) modal.msg = v; });
                document.querySelectorAll("[data-alt]").forEach((el) => {
                    el.onclick = () => {
                        if (!modal) return;
                        const c = el.dataset.alt;
                        const i = modal.alts.indexOf(c);
                        if (i >= 0) modal.alts.splice(i, 1); else modal.alts.push(c);
                        render();
                    };
                });
                // save button live-enables as the play step fills in
                const rec = document.querySelector("[data-rec], #wizUndoPlay");
                if (rec) { const sv = $("wizSave"); if (sv) sv.disabled = !playOk(); }
                // modals
                document.querySelectorAll("[data-modal-cancel]").forEach((el) => el.onclick = () => { modal = null; render(); });
                on("msgOk", () => {
                    const el = $("msgText");
                    const msg = (el ? el.value : modal.msg).trim();
                    if (modal.index !== undefined && modal.index !== null) {
                        // editing an old play: validate against the rest of
                        // the line before touching it
                        const err = applyPlayEdit(modal.index, msg, (modal.alts || []).slice());
                        if (err) { showToast(err, true); return; }
                        modal = null; render();
                        return;
                    }
                    wizLine().plays.push({ seat: modal.seat, card: modal.card, msg, alts: (modal.alts || []).slice() });
                    modal = null; render();
                });
                on("claimOk", () => {
                    const line = wizLine();
                    if (modal.kind === "bot") { line.bot = {}; line.claim = null; modal = null; render(); return; }
                    const t = parseInt(($("claimTricks") || {}).value);
                    if (isNaN(t) || t < modal.min || t > modal.max) { showToast("Tricks out of range", true); return; }
                    line.claim = { tricks: t }; line.bot = null;
                    modal = null; render();
                });
                on("claimRemove", () => {
                    const line = wizLine();
                    if (modal.kind === "bot") line.bot = null; else line.claim = null;
                    modal = null; render();
                });
                on("delOk", () => { if (modal && modal.id) deleteProblem(modal.id); });
                on("archOk", () => {
                    const el = $("archName");
                    const name = (el ? el.value : "").trim();
                    if (!name) { showToast("Give the archive a name", true); return; }
                    createArchive(name);
                });
                document.querySelectorAll("[data-archpick]").forEach((el) => {
                    el.onclick = () => {
                        if (!modal || modal.kind !== "archiveAdd") return;
                        const id = el.getAttribute("data-archpick");
                        if (modal.sel.has(id)) modal.sel.delete(id); else modal.sel.add(id);
                        render();
                    };
                });
                on("archAddOk", () => {
                    if (modal && modal.kind === "archiveAdd") addDrillsToArchive([...modal.sel]);
                });
                on("archDelOk", () => { if (modal && modal.id) deleteArchive(modal.id); });
                const ct = $("claimTricks");
                if (ct) ct.oninput = () => refreshClaimPreview();
                on("wizAllowWrong", () => { wiz.allowWrong = !wiz.allowWrong; render(); });
                const tg = $("wizTarget");
                if (tg) tg.oninput = () => {
                    wiz.target = parseInt(tg.value) || 0;
                    const c = wizContract();
                    const prev = $("wizTargetPrev");
                    if (prev) prev.innerHTML = (wiz.target >= 1 && wiz.target <= 13 && c)
                        ? dcolorSuits(resultText(c, wiz.role === "declarer" ? wiz.target : 13 - wiz.target)) + " or better"
                        : "1\u201313 tricks \u2014 at least this many for a success";
                    const sv = $("wizSave"); if (sv) sv.disabled = !playOk();
                };
            }

            // tapping anywhere outside the hands drops a lifted card
            document.addEventListener("click", (e) => {
                if (selectedCard && !e.target.closest(".cb-fan-play, .cb-flat")) {
                    selectedCard = null;
                    render();
                }
            });

            // ---- bootstrap ----
            document.addEventListener("authchange", () => {
                if (window.currentUser) {
                    loadLibrary();
                    const sid = localStorage.getItem(SESSION_KEY);
                    if (sid) resumeSession(sid);
                } else {
                    view = "lobby"; state = null; wiz = null; modal = null;
                    archives = null; selArchive = "all";
                    localStorage.removeItem(SESSION_KEY);
                    render();
                }
            });
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden && view === "session") drivePlay();
            });
            refreshAuthState();
            render();
            if (window.currentUser) loadLibrary();
        </script>
    </body>
</html>
