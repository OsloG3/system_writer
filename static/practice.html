<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Bridge Trainer | Practice</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Work+Sans:wght@300;400;500&amp;family=Inter:wght@400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script src="/static/shared.js"></script>
        <link rel="stylesheet" href="/static/shared.css" />
    </head>
    <body
        class="bg-background text-on-surface font-body selection:bg-tertiary-container/30 overflow-hidden"
    >
        <div id="app"></div>

        <script>
            document.getElementById("app").innerHTML = renderLayout({
                mode: "practice",
                badge: "Practice",
                title: "Loading...",
                titleId: "practiceTitle",
                subtitle:
                    "A random sequence from the root down to a leaf is picked flashcard style. Recall what each bid shows, then reveal the answer.",
            });
            const id = window.location.pathname.split("/").pop();
            document.getElementById("viewLink").href = "/view/" + id;
            document.getElementById("editLink").href = "/edit/" + id;

            let treeData = { roots: [] };
            let scopeRootId =
                new URLSearchParams(window.location.search).get("root") || "";
            let deck = [];
            let deckPos = 0;
            let currentCard = null;
            let revealed = false;
            let stats = { good: 0, again: 0 };

            // ---- Session persistence ----
            // The deck is stored as node-id paths, never as node content, so
            // a system edited between sessions is picked up correctly: cards
            // always render the freshly fetched names/descriptions, paths
            // whose nodes were deleted drop out, and cards added since are
            // mixed into the un-practiced tail of the deck.
            const PRACTICE_KEY = "atheneum_practice_" + id;

            function loadSessions() {
                try {
                    const all = JSON.parse(
                        localStorage.getItem(PRACTICE_KEY) || "{}",
                    );
                    if (all && all.v === 1 && all.sessions) return all;
                } catch (e) {}
                return { v: 1, sessions: {} };
            }

            function storeSessions(all) {
                try {
                    localStorage.setItem(PRACTICE_KEY, JSON.stringify(all));
                } catch (e) {}
            }

            function saveSession() {
                const all = loadSessions();
                all.sessions[scopeRootId] = {
                    deckIds: deck.map((c) => c.ids),
                    pos: deckPos,
                    stats: stats,
                    saved: Date.now(),
                };
                storeSessions(all);
            }

            function clearSession() {
                const all = loadSessions();
                delete all.sessions[scopeRootId];
                storeSessions(all);
            }

            function restoreSession() {
                const s = loadSessions().sessions[scopeRootId];
                if (!s || !Array.isArray(s.deckIds) || !s.deckIds.length)
                    return false;
                const fresh = collectCards();
                const byKey = new Map();
                for (const c of fresh) byKey.set(c.ids.join(">"), c);
                const savedKeys = new Set(
                    s.deckIds.map((ids) => ids.join(">")),
                );
                const restored = [];
                let pos = 0;
                let lastShownIdx = -1;
                const savedPos = s.pos || 0;
                s.deckIds.forEach((ids, i) => {
                    const c = byKey.get(ids.join(">"));
                    if (!c) return; // node deleted or no longer a card
                    restored.push(c);
                    if (i < savedPos) {
                        pos++;
                        lastShownIdx = restored.length - 1;
                    }
                });
                if (!restored.length) return false;
                // cards the system gained since: shuffle into the tail the
                // player has not reached yet
                const added = shuffle(
                    fresh.filter((c) => !savedKeys.has(c.ids.join(">"))),
                );
                for (const c of added) {
                    const slot =
                        pos +
                        Math.floor(
                            Math.random() * (restored.length - pos + 1),
                        );
                    restored.splice(slot, 0, c);
                }
                // re-show the card that was on screen only if it still
                // exists; otherwise continue at the next un-practiced one
                const shownIds = s.deckIds[Math.max(0, savedPos - 1)];
                const shownSurvived =
                    lastShownIdx >= 0 &&
                    shownIds &&
                    shownIds.join(">") ===
                        restored[lastShownIdx].ids.join(">");
                deck = restored;
                deckPos = shownSurvived
                    ? Math.max(0, Math.min(lastShownIdx, deck.length))
                    : Math.max(0, Math.min(pos, deck.length));
                stats = {
                    good: (s.stats && s.stats.good) || 0,
                    again: (s.stats && s.stats.again) || 0,
                };
                return true;
            }

            function startSession() {
                if (!restoreSession()) rebuildDeck();
                else nextCard();
            }

            async function init() {
                const res = await fetch("/api/tree/" + id);
                if (!res.ok) {
                    document.getElementById("main-content").innerHTML =
                        '<p class="text-on-surface-variant">System not found. <a class="text-primary" href="/">Back to collections</a></p>';
                    return;
                }
                treeData = await res.json();
                if (treeData.root && !treeData.roots) {
                    treeData.roots = [treeData.root];
                }
                treeData.roots = treeData.roots || [];
                treeData.editors = treeData.editors || [];
                window.currentTree = treeData;
                applyTreePerms(treeData);
                document.getElementById("practiceTitle").innerText =
                    treeData.name ||
                    (treeData.roots[0] && treeData.roots[0].name) ||
                    id;
                if (
                    scopeRootId &&
                    !treeData.roots.some((r) => r.id === scopeRootId)
                ) {
                    scopeRootId = "";
                }
                renderControls();
                startSession();
            }

            function renderControls() {
                const content = document.getElementById("main-content");
                content.innerHTML = `
                    <div class="game-panel pop-in flex flex-wrap items-center gap-3 px-4 py-3 mb-5">
                        <label for="scopeSelect" class="text-[10px] uppercase tracking-[0.2em] text-outline font-label font-bold flex items-center gap-1.5">
                            <span class="material-symbols-outlined text-sm text-[#bababa]">filter_alt</span>Scope
                        </label>
                        <select id="scopeSelect" class="text-sm rounded-xl border-outline-variant/30 bg-surface-container-lowest text-on-surface px-3 py-2 font-label shadow-sm"></select>
                        <button id="restartBtn" title="Restart this scope: fresh shuffle, stats reset" class="flex items-center gap-1 px-2.5 py-2 bg-surface-container text-on-surface-variant rounded-xl font-label text-xs font-semibold hover:bg-surface-container-high transition-colors">
                            <span class="material-symbols-outlined text-sm">restart_alt</span>
                        </button>
                        <div class="ml-auto flex items-center gap-2 min-w-[140px]">
                            <div class="xp-bar flex-1"><div id="deckBar" class="xp-bar-fill" style="width:0%"></div></div>
                            <span id="deckCount" class="text-[10px] font-label font-semibold text-on-surface-variant whitespace-nowrap"></span>
                        </div>
                    </div>
                    <div id="card-area"></div>
                `;

                const scopeSelect = document.getElementById("scopeSelect");
                const opts = [{ id: "", name: "Whole system" }].concat(
                    treeData.roots.map((r) => ({
                        id: r.id,
                        name: r.name || "Untitled",
                    })),
                );
                scopeSelect.innerHTML = opts
                    .map(
                        (o) =>
                            `<option value="${escapeHtml(o.id)}" ${
                                o.id === scopeRootId ? "selected" : ""
                            }>${colorSuits(o.name)}</option>`,
                    )
                    .join("");
                scopeSelect.onchange = () => {
                    saveSession(); // keep this scope's progress
                    scopeRootId = scopeSelect.value;
                    const url = new URL(window.location);
                    if (scopeRootId) url.searchParams.set("root", scopeRootId);
                    else url.searchParams.delete("root");
                    history.replaceState({}, "", url);
                    startSession();
                };
                document.getElementById("restartBtn").onclick = () => {
                    clearSession();
                    rebuildDeck();
                };
            }

            function scopedRoots() {
                if (scopeRootId)
                    return treeData.roots.filter((r) => r.id === scopeRootId);
                return treeData.roots;
            }

            function meaningfulChildren(node) {
                return (node.children || []).filter(
                    (c) => c && (c.name || c.description),
                );
            }

            // One card per root-to-leaf sequence; question is the names,
            // answer is the description of every node in the sequence.
            // `ids` is the stable identity used to persist the deck.
            function collectCards() {
                const cards = [];
                function walk(node, path) {
                    const children = meaningfulChildren(node);
                    if (children.length === 0) {
                        if (
                            path.some(
                                (n) => n.description && n.description.trim(),
                            )
                        ) {
                            cards.push({
                                path: path,
                                ids: path.map(
                                    (n) => n.id || "n:" + (n.name || ""),
                                ),
                            });
                        }
                        return;
                    }
                    children.forEach((c) => walk(c, path.concat([c])));
                }
                scopedRoots().forEach((root) => walk(root, [root]));
                return cards;
            }

            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function rebuildDeck() {
                deck = shuffle(collectCards());
                deckPos = 0;
                stats = { good: 0, again: 0 };
                nextCard();
            }

            function nextCard() {
                if (deck.length === 0) {
                    currentCard = null;
                    saveSession();
                    renderEmptyDeck();
                    return;
                }
                if (deckPos >= deck.length) {
                    shuffle(deck);
                    deckPos = 0;
                }
                currentCard = deck[deckPos];
                deckPos++;
                revealed = false;
                saveSession();
                renderCard();
            }

            function renderEmptyDeck() {
                document.getElementById("card-area").innerHTML = `
                    <div class="game-panel pop-in py-12 px-6 text-center">
                        <div class="card-fan-deco">
                            <span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span>
                        </div>
                        <p class="text-on-surface-variant text-lg font-headline font-bold mt-2">No cards to practice in this scope.</p>
                        <p class="text-sm text-on-surface-variant mt-2 max-w-md mx-auto leading-relaxed">
                            Cards are root-to-leaf sequences whose nodes have descriptions. Add some in the <a href="/edit/${id}" class="text-[#bababa] font-semibold underline">editor</a>.
                        </p>
                    </div>
                `;
            }

            function renderCard() {
                const area = document.getElementById("card-area");

                const sequence = currentCard.path
                    .map(
                        (n) => `
                        <div class="pcard-holder px-3 py-1.5 rounded-xl bg-surface-container border border-black/10 shadow-[0_2px_0_rgba(0,0,0,0.08)]">
                            <span class="font-headline font-extrabold text-on-surface text-sm">${colorSuits(
                                n.name,
                            )}</span>
                        </div>`,
                    )
                    .join('<span class="text-outline-variant px-0.5 material-symbols-outlined text-sm">arrow_forward</span>');

                area.innerHTML = `
                    <div class="game-panel pop-in relative p-5 sm:p-8 min-h-[260px] overflow-hidden">
                        <span class="absolute top-3 left-4 font-headline font-extrabold text-2xl text-[#bababa] select-none pointer-events-none">♠</span>
                        <span class="absolute bottom-3 right-4 font-headline font-extrabold text-2xl text-[#c0392b] rotate-180 select-none pointer-events-none">♥</span>
                        <div class="text-[10px] uppercase tracking-[0.2em] text-outline font-label font-bold mb-3 mt-1 text-center">
                            Sequence — what does each bid show?
                        </div>
                        <div class="flex flex-wrap items-center justify-center gap-y-2 mb-4">
                            ${sequence}
                        </div>
                        <div id="answer" class="practice-answer"></div>
                    </div>
                    <div class="flex flex-wrap items-center justify-center gap-3 mt-6" id="card-buttons"></div>
                    <div class="text-center text-xs text-on-surface-variant mt-4" id="card-meta"></div>
                `;
                renderButtons();
                renderMeta();
            }

            function reveal() {
                if (!currentCard || revealed) return;
                revealed = true;
                const answer = document.getElementById("answer");

                answer.innerHTML =
                    `<div class="text-[10px] uppercase tracking-widest text-outline font-label mb-2 mt-4 pt-4 border-t border-outline-variant/10">Answer</div>` +
                    currentCard.path
                        .map(
                            (n) => `
                        <div class="flex items-baseline gap-2 sm:gap-4 py-2 border-b border-outline-variant/10 last:border-b-0">
                            <span class="font-headline font-bold text-on-surface min-w-[60px] sm:min-w-[70px]">${colorSuits(
                                n.name,
                            )}</span>
                            <span class="text-sm text-on-surface-variant">${
                                n.description && n.description.trim()
                                    ? colorSuits(n.description)
                                    : '<em class="text-outline-variant">no description</em>'
                            }</span>
                        </div>`,
                        )
                        .join("");
                answer.classList.add("revealed");
                renderButtons();
                renderMeta();
            }

            function grade(good) {
                if (!currentCard || !revealed) return;
                if (good) {
                    stats.good++;
                } else {
                    stats.again++;
                    const insertAt = Math.min(deckPos + 2, deck.length);
                    deck.splice(insertAt, 0, currentCard);
                }
                nextCard();
            }

            function renderButtons() {
                const bar = document.getElementById("card-buttons");
                if (!bar) return;
                if (!revealed) {
                    bar.innerHTML = `
                        <button id="revealBtn" class="btn-gold flex items-center gap-2 px-7 py-3 rounded-xl font-label text-sm font-bold">
                            <span class="material-symbols-outlined text-sm">visibility</span>
                            Show answer
                        </button>
                        <button id="skipBtn" class="px-5 py-3 bg-surface-container text-on-surface-variant rounded-xl font-label text-sm font-semibold hover:bg-surface-container-high transition-colors">
                            Skip
                        </button>
                    `;
                    document.getElementById("revealBtn").onclick = reveal;
                    document.getElementById("skipBtn").onclick = nextCard;
                } else {
                    bar.innerHTML = `
                        <button id="againBtn" class="flex items-center gap-2 px-6 py-3 rounded-xl font-label text-sm font-bold text-[#e8e6e3] bg-[#4a4642] border border-white/10 shadow-[0_3px_0_rgba(0,0,0,0.4)] hover:brightness-105 transition-all active:translate-y-0.5 active:shadow-none">
                            <span class="material-symbols-outlined text-sm">close</span>
                            Again
                        </button>
                        <button id="goodBtn" class="flex items-center gap-2 px-6 py-3 rounded-xl font-label text-sm font-bold text-[#161512] bg-[#e8e6e3] shadow-[0_3px_0_rgba(0,0,0,0.4)] hover:brightness-105 transition-all active:translate-y-0.5 active:shadow-none">
                            <span class="material-symbols-outlined text-sm">check</span>
                            Got it
                        </button>
                    `;
                    document.getElementById("againBtn").onclick = () =>
                        grade(false);
                    document.getElementById("goodBtn").onclick = () =>
                        grade(true);
                }
            }

            function renderMeta() {
                const meta = document.getElementById("card-meta");
                if (!meta) return;
                const seen = stats.good + stats.again;
                const pct =
                    seen > 0 ? Math.round((stats.good / seen) * 100) : null;
                const bar = document.getElementById("deckBar");
                if (bar) {
                    const progress = Math.min(
                        Math.round((deckPos / deck.length) * 100),
                        100,
                    );
                    bar.style.width = progress + "%";
                }
                const count = document.getElementById("deckCount");
                if (count) count.innerText = `${deckPos}/${deck.length} cards`;
                meta.innerHTML = `Card ${deckPos} of ${deck.length} · Reviewed ${seen}${
                    pct !== null ? ` · <b class="${pct >= 70 ? "text-[#e8e6e3]" : "text-[#908f8d]"}">${pct}% recalled</b>` : ""
                } <span class="text-outline-variant ml-3 hidden md:inline">Space: reveal / got it · M: again · S: skip</span>`;
            }

            document.addEventListener("keydown", (e) => {
                const tag = (e.target.tagName || "").toLowerCase();
                if (tag === "input" || tag === "textarea" || tag === "select")
                    return;
                if (!currentCard) return;
                if (e.code === "Space" || e.code === "Enter") {
                    e.preventDefault();
                    if (!revealed) reveal();
                    else grade(true);
                } else if (e.key === "g" || e.key === "G") {
                    if (revealed) grade(true);
                } else if (e.key === "m" || e.key === "M") {
                    if (revealed) grade(false);
                } else if (e.key === "s" || e.key === "S") {
                    if (!revealed) nextCard();
                }
            });

            document.addEventListener("authchange", () => {
                if (window.currentTree) applyTreePerms(window.currentTree);
            });

            refreshAuthState();
            init();
        </script>
    </body>
</html>
