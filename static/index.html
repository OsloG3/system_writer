<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Atheneum | Bidding Systems</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Work+Sans:wght@300;400;500&amp;family=Inter:wght@400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script src="/static/shared.js"></script>
        <link rel="stylesheet" href="/static/shared.css" />
    </head>
    <body
        class="bg-background text-on-surface font-body selection:bg-tertiary-container/30 overflow-hidden"
    >
        <div id="app"></div>

        <script>
            document.getElementById("app").innerHTML = renderLayout({
                mode: "index",
                badge: "Home",
                title: "My Bidding Systems",
                subtitle:
                    "Create, view and practice your bidding system collections.",
            });

            let treesCache = [];

            document.addEventListener("authchange", loadList);

            async function loadList() {
                const res = await fetch("/api/list");
                const trees = (await res.json()) || [];
                treesCache = trees;
                const content = document.getElementById("main-content");

                if (trees.length === 0) {
                    content.innerHTML = `
                        <div class="text-center py-16">
                            <span class="material-symbols-outlined text-outline-variant text-6xl mb-4">account_tree</span>
                            <p class="text-on-surface-variant text-lg font-body">No collections yet.</p>
                            <p class="text-on-surface-variant text-sm font-body mt-2">${
                                window.currentUser
                                    ? 'Click "New Collection" to get started.'
                                    : "Create an account to build your first system."
                            }</p>
                        </div>
                    `;
                    return;
                }

                content.innerHTML = `
                    <div class="space-y-3">
                        ${trees
                            .map(
                                (t) => `
                            <div class="tree-list-item flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 p-4 rounded-lg border border-outline-variant/10 bg-surface-container-lowest">
                                <div class="flex items-center gap-3 min-w-0">
                                    <span class="material-symbols-outlined text-primary text-xl">account_tree</span>
                                    <div class="min-w-0">
                                        <span class="font-headline font-semibold text-on-surface truncate block">${colorSuits(t.name)}</span>
                                        <span class="text-xs text-on-surface-variant font-label">by ${t.owner ? escapeHtml(t.owner) : "<em>unclaimed</em>"}${
                                            treeCanEdit(t) && !treeIsOwner(t)
                                                ? ' <span class="text-primary">· you can edit</span>'
                                                : ""
                                        }</span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 flex-wrap shrink-0">
                                    <a href="/practice/${t.id}" title="Practice" class="flex items-center gap-1 px-3 py-1.5 bg-primary text-on-primary rounded text-xs font-label hover:bg-primary-dim transition-colors no-underline">
                                        <span class="material-symbols-outlined text-sm">school</span>
                                        Practice
                                    </a>
                                    <a href="/view/${t.id}" title="View" class="flex items-center gap-1 px-3 py-1.5 bg-surface-container text-on-surface rounded text-xs font-label hover:bg-surface-container-high transition-colors no-underline">
                                        <span class="material-symbols-outlined text-sm">visibility</span>
                                        View
                                    </a>
                                    <button onclick="duplicateTree('${t.id}')" title="Create your own copy of this system" class="flex items-center gap-1 px-3 py-1.5 bg-surface-container text-on-surface rounded text-xs font-label hover:bg-surface-container-high transition-colors">
                                        <span class="material-symbols-outlined text-sm">content_copy</span>
                                        Copy
                                    </button>
                                    ${
                                        treeCanEdit(t)
                                            ? `
                                    <a href="/edit/${t.id}" title="Edit" class="flex items-center gap-1 px-3 py-1.5 bg-surface-container text-on-surface rounded text-xs font-label hover:bg-surface-container-high transition-colors no-underline">
                                        <span class="material-symbols-outlined text-sm">edit</span>
                                        Edit
                                    </a>`
                                            : ""
                                    }
                                    ${
                                        treeIsOwner(t)
                                            ? `
                                    <button onclick="deleteTree('${t.id}')" title="Delete" class="flex items-center gap-1 px-2 py-1.5 bg-error-container/40 text-on-error-container rounded text-xs font-label hover:bg-error-container transition-colors">
                                        <span class="material-symbols-outlined text-sm">delete</span>
                                    </button>`
                                            : ""
                                    }
                                </div>
                            </div>
                        `,
                            )
                            .join("")}
                    </div>
                `;
            }

            function createTree() {
                if (!window.currentUser) {
                    showAuthDialog("login");
                    return;
                }
                showCreateDialog();
            }

            // Duplicate any public system as a new one owned by the current user
            async function duplicateTree(treeId) {
                if (!window.currentUser) {
                    showAuthDialog("login");
                    return;
                }
                const res = await fetch(`/api/tree/${treeId}/copy`, {
                    method: "POST",
                });
                if (res.ok) {
                    const data = await res.json();
                    window.location.href = "/edit/" + data.id;
                } else if (res.status === 401) {
                    showAuthDialog("login");
                } else {
                    showToast("Could not copy system", true);
                }
            }

            function showCreateDialog() {
                if (document.getElementById("createOverlay")) return;
                const overlay = document.createElement("div");
                overlay.id = "createOverlay";
                overlay.className = "unlock-overlay";
                overlay.innerHTML = `
                    <div class="unlock-card">
                        <span class="material-symbols-outlined text-primary text-3xl mb-2">account_tree</span>
                        <h2 class="font-headline font-bold text-on-surface text-lg mb-1">New system</h2>
                        <p class="text-sm text-on-surface-variant mb-4">Give your bidding system a name.</p>
                        <form id="createForm">
                            <input id="createName" type="text" placeholder="System name" autocomplete="off" class="unlock-input" />
                            <div class="flex justify-end gap-2 mt-4">
                                <button type="button" id="createCancel" class="px-4 py-2 bg-surface-container text-on-surface-variant rounded font-label text-sm hover:bg-surface-container-high transition-colors">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-primary text-on-primary rounded font-label text-sm hover:bg-primary-dim transition-colors">Create</button>
                            </div>
                        </form>
                    </div>
                `;
                document.body.appendChild(overlay);
                const input = overlay.querySelector("#createName");
                input.focus();
                overlay.querySelector("#createCancel").onclick = () =>
                    overlay.remove();
                overlay.addEventListener("click", (e) => {
                    if (e.target === overlay) overlay.remove();
                });
                overlay.querySelector("#createForm").onsubmit = async (e) => {
                    e.preventDefault();
                    const res = await fetch("/api/new", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name: input.value.trim() }),
                    });
                    if (res.status === 401) {
                        overlay.remove();
                        showAuthDialog("login");
                        return;
                    }
                    if (!res.ok) {
                        showToast("Could not create system", true);
                        return;
                    }
                    const data = await res.json();
                    window.location.href = "/edit/" + data.id;
                };
            }

            async function deleteTree(treeId) {
                const t = treesCache.find((x) => x.id === treeId);
                const name = t ? t.name : treeId;
                if (!confirm(`Delete "${name}"? This cannot be undone.`))
                    return;
                const res = await fetch("/api/tree/" + treeId, {
                    method: "DELETE",
                });
                if (res.ok) {
                    showToast("System deleted");
                    loadList();
                } else if (res.status === 401) {
                    showToast("Log in first", true);
                    showAuthDialog("login");
                } else if (res.status === 403) {
                    showToast("Only the owner can delete this system", true);
                } else {
                    showToast("Delete failed", true);
                }
            }

            refreshAuthState();
            loadList();
        </script>
    </body>
</html>
