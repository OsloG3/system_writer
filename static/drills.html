                const legal = new Set(recLegal(next, contract));
                const hero = recHeroSeats(contract);
                const done = wiz.plays.length === 52;
                return [0, 1, 2, 3].map((s) => {
                    const played = new Set(wiz.plays.filter((p) => p.seat === s).map((p) => p.card));
                    const cards = sortHand(handToCards(hands[s])).map((c) => {
                        const red = c[1] === "H" || c[1] === "D";
                        const rank = c[0] === "T" ? "10" : c[0];
                        const isPlayed = played.has(c);
                        const clickable = !done && s === next && legal.has(c);
                        return `<span class="dr-rc ${red ? "red" : "blk"}${isPlayed ? " played" : ""}${clickable ? " legal" : ""}" ${clickable ? `data-rec="${c}"` : ""}>${rank}<span class="sym">${SUIT_SYMBOL[c[1]]}</span></span>`;
                    }).join("");
                    return `<div class="dr-rechand${!done && s === next ? " act" : ""}">
                        <div class="who">${SEAT_NAMES[s]}${hero.indexOf(s) >= 0 ? " \u2605" : ""}</div>
                        <div class="dr-reccards">${cards}</div></div>`;
                }).join("");
            }
            function wizStepPlay() {
                const c = wizContract();
                if (!c) return `<div class="dr-hint">Complete the auction first.</div>`;
                if (!heroOk()) return `<div class="dr-hint">Choose the hero defender first.</div>`;
                if (wiz.role === "declarer") wiz.heroSeat = c.declarer;
                const n = wiz.plays.length;
                const won = recDeclTricks(c);
                const remaining = Math.floor((52 - n) / 4);
                const canClaim = n >= 4 && n % 4 === 0 && n < 52;
                const claimTxt = wiz.claim
                    ? `Claim: declarer takes ${wiz.claim.tricks} tricks, result <b>${scoreText(wiz.claim.scoreNs)}</b> (N-S).`
                    : (n === 52 ? "All 52 cards scripted \u2014 the result is scored from the play." : `Script the play, or claim at a trick boundary.`);
                return `<div class="dr-hint" style="margin-bottom:.5rem">${dcolorSuits(contractText(c))} \u00b7 trump ${c.denom === "N" ? "NT" : SUIT_SYMBOL[c.denom]} \u00b7 hero ${SEAT_NAMES[wiz.heroSeat]}. Click a highlighted card of the seat to play; \u2605 seats ask for your reasoning.</div>
                    <div class="dr-panel" style="margin-bottom:.5rem;padding:.6rem">${recTrickHtml(c)}</div>
                    <div class="dr-rec">${recHandsHtml(c)}</div>
                    <div class="dr-filters" style="margin-top:.7rem">
                        <span class="dr-hint" style="flex:1">${n}/52 played \u00b7 declarer ${won} trick${won === 1 ? "" : "s"}${remaining ? " \u00b7 " + remaining + " to come" : ""}</span>
                        <button class="dr-btn ghost" id="wizUndoPlay" ${n ? "" : "disabled"}><span class="material-symbols-outlined">undo</span>Undo</button>
                        <button class="dr-btn ghost" id="wizClaimBtn" ${canClaim || wiz.claim ? "" : "disabled"}><span class="material-symbols-outlined">flag</span>${wiz.claim ? "Edit claim" : "Claim"}</button>
                    </div>
                    <div class="dr-hint">${claimTxt}</div>`;
            }
            function wizHtml() {
                const steps = WIZ_STEPS.map((name, i) => {
                    const cls = i === wiz.step ? "on" : (i < wiz.step && stepOk(i) ? "done" : "");
                    return `<div class="dr-step ${cls}" data-goto="${i}">${i + 1}. ${name}</div>`;
                }).join("");
                let body = "";
                if (wiz.step === 0) body = wizStepSetup();
                else if (wiz.step === 1) body = wizStepHands();
                else if (wiz.step === 2) body = wizStepAuction();
                else if (wiz.step === 3) body = wizStepHero();
                else body = wizStepPlay();
                const last = wiz.step === WIZ_STEPS.length - 1;
                return `<div class="dr-wrap">
                    <div class="dr-panel">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem">
                            <button class="dr-btn ghost" id="wizCancel"><span class="material-symbols-outlined">close</span>${wiz.id ? "Close" : "Cancel"}</button>
                            <h3 style="margin:0">${wiz.id ? "Edit problem" : "New problem"}</h3>
                            <button class="dr-btn gold" id="wizSave" ${playOk() ? "" : "disabled"}><span class="material-symbols-outlined">save</span>Save</button>
                        </div>
                        <div class="dr-steps">${steps}</div>
                        ${body}
                        <div class="dr-nav">
                            <button class="dr-btn ghost" id="wizBack" ${wiz.step === 0 ? "disabled" : ""}><span class="material-symbols-outlined">arrow_back</span>Back</button>
                            ${last ? `<span></span>` : `<button class="dr-btn" id="wizNext" ${stepOk(wiz.step) ? "" : "disabled"}>Next<span class="material-symbols-outlined">arrow_forward</span></button>`}
                        </div>
                    </div>
                </div>`;
            }

            // ---- modal state (shared by wizard + lobby) ----
            let modal = null; // {kind:'msg'|'claim'|'delete', ...}
            function defaultMsg(card) { return `I just decided to play the ${cardNameJS(card)} instead.`; }
            function modalHtml() {
                if (!modal) return "";
                if (modal.kind === "msg") {
                    return `<div class="dr-overlay"><div class="dr-modal">
                        <h3>Why the ${cardNameJS(modal.card)}?</h3>
                        <div class="dr-hint" style="margin-bottom:.5rem">${SEAT_NAMES[modal.seat]} (hero) plays the ${cardNameJS(modal.card)}. Explain the reasoning \u2014 it is revealed to anyone who picks a different card.</div>
                        <textarea class="dr-input" id="msgText" rows="3">${escapeHtml(modal.msg)}</textarea>
                        <div class="dr-modalfoot"><button class="dr-btn ghost" data-modal-cancel>Cancel</button><button class="dr-btn gold" id="msgOk"><span class="material-symbols-outlined">playing_cards</span>Play card</button></div>
                    </div></div>`;
                }
                if (modal.kind === "claim") {
                    return `<div class="dr-overlay"><div class="dr-modal">
                        <h3>Claim the remaining tricks</h3>
                        <div class="dr-hint" style="margin-bottom:.6rem">Declarer has won ${modal.min} trick${modal.min === 1 ? "" : "s"} so far; ${modal.max - modal.min} remain to be played. Set the total declarer takes and the final score.</div>
                        <div class="dr-field"><label class="dr-label">Tricks declarer takes (total)</label>
                            <input class="dr-input" id="claimTricks" type="number" min="${modal.min}" max="${modal.max}" value="${modal.tricks}"></div>
                        <div class="dr-field"><label class="dr-label">Final score (N-S positive)</label>
                            <input class="dr-input" id="claimScore" type="number" step="10" value="${modal.scoreNs}"></div>
                        <div class="dr-modalfoot">
                            <button class="dr-btn ghost" data-modal-cancel>Cancel</button>
                            ${wiz && wiz.claim ? `<button class="dr-btn danger" id="claimRemove">Remove claim</button>` : ""}
                            <button class="dr-btn gold" id="claimOk">Set claim</button>
                        </div>
                    </div></div>`;
                }
                if (modal.kind === "delete") {
                    return `<div class="dr-overlay"><div class="dr-modal">
                        <h3>Delete this problem?</h3>
                        <div class="dr-hint">It is removed from the library for everyone. This cannot be undone.</div>
                        <div class="dr-modalfoot"><button class="dr-btn ghost" data-modal-cancel>Cancel</button><button class="dr-btn danger" id="delOk"><span class="material-symbols-outlined">delete</span>Delete</button></div>
                    </div></div>`;
                }
                return "";
            }

            // ---- wizard actions ----
            function wizSet(field, val) {
                if (field === "role") {
                    wiz.role = val;
                    const c = wizContract();
                    if (val === "declarer" && c) wiz.heroSeat = c.declarer;
                    else if (val === "defense") wiz.heroSeat = -1;
                } else if (field === "dealer") {
                    wiz.dealer = parseInt(val);
                    wiz.calls = []; // dealer defines the auction's meaning
                    wiz.heroSeat = wiz.role === "defense" ? -1 : wiz.heroSeat;
                } else if (["difficulty", "vuln", "heroseat"].indexOf(field) >= 0) {
                    wiz[field === "heroseat" ? "heroSeat" : field] = parseInt(val);
                }
                render();
            }
            function addCall(tok) {
                wiz.calls.push(tok);
                if (auctionOver(wiz.calls) && wiz.role === "declarer") {
                    const c = wizContract();
                    if (c) wiz.heroSeat = c.declarer;
                }
                render();
            }
            function undoCall() { wiz.calls.pop(); render(); }
            function assignCard(tok) {
                if (wiz.assign[tok] === wiz.selSeat) delete wiz.assign[tok];
                else wiz.assign[tok] = wiz.selSeat;
                render();
            }
            function recCard(token) {
                const c = wizContract();
                if (!c) return;
                const seat = recNextSeat(c);
                if (!recLegal(seat, c).includes(token)) return;
                if (recHeroSeats(c).indexOf(seat) >= 0) {
                    modal = { kind: "msg", seat, card: token, msg: defaultMsg(token) };
                    render();
                } else {
                    wiz.plays.push({ seat, card: token, msg: "" });
                    render();
                }
            }
            function recUndo() { wiz.plays.pop(); render(); }
            function openClaimModal() {
                const c = wizContract();
                if (!c) return;
                const won = recDeclTricks(c);
                const remaining = Math.floor((52 - wiz.plays.length) / 4);
                const tricks = wiz.claim ? wiz.claim.tricks : Math.min(13, won + remaining);
                modal = { kind: "claim", min: won, max: won + remaining, tricks, scoreNs: wiz.claim ? wiz.claim.scoreNs : 0 };
                render();
                suggestScore(c, tricks);
            }
            async function suggestScore(c, tricks) {
                try {
                    const r = await api("POST", "/api/drills/score", { level: c.level, denom: c.denom, penalty: c.penalty, declarer: c.declarer, vuln: wiz.vuln, tricks });
                    if (r.ok && modal && modal.kind === "claim") {
                        modal.scoreNs = r.data.scoreNs;
                        const el = document.getElementById("claimScore");
                        if (el && document.activeElement !== el) el.value = r.data.scoreNs;
                    }
                } catch (e) { /* ignore */ }
            }
            async function saveWiz() {
                if (!playOk()) { showToast("Finish the deal, auction, hero and play first", true); return; }
                const problem = {
                    title: (wiz.title || "").trim(), role: wiz.role, heroSeat: wiz.heroSeat,
                    difficulty: wiz.difficulty, dealer: wiz.dealer, vuln: wiz.vuln,
                    hands: handsFromAssign(wiz.assign), calls: wiz.calls,
                    bidComment: wiz.bidComment, problemComment: wiz.problemComment,
                    plays: wiz.plays, claim: wiz.claim,
                };
                busy = true; render();
                try {
                    const r = wiz.id ? await api("PUT", `/api/drills/${wiz.id}`, problem) : await api("POST", "/api/drills", problem);
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Save failed", true); render(); return; }
                    showToast("Problem saved");
                    wiz = null; view = "lobby"; lobbyTab = "create"; render(); loadLibrary();
                } catch (e) { busy = false; render(); }
            }
            async function editProblem(id) {
                busy = true; render();
                try {
                    const r = await api("GET", `/api/drills/${id}`);
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Cannot open", true); render(); return; }
                    startWiz(r.data);
                } catch (e) { busy = false; render(); }
            }
            async function deleteProblem(id) {
                busy = true; render();
                try {
                    const r = await api("DELETE", `/api/drills/${id}`);
                    busy = false;
                    if (!r.ok) { showToast((r.data && r.data.error) || "Delete failed", true); render(); return; }
                    showToast("Deleted"); modal = null; render(); loadLibrary();
                } catch (e) { busy = false; render(); }
            }

            // ===================== Master render =====================
            function render() {
                const content = document.getElementById("main-content");
                if (!content) return;
                syncReveal();
                const full = view === "session" && state; // full-screen play table
                const header = content.previousElementSibling;
                if (header && header.tagName === "HEADER") header.style.display = full ? "none" : "";
                const appHeader = document.querySelector("#app > header");
                if (appHeader) appHeader.style.display = full ? "none" : "";
                const sidebar = document.getElementById("sidebar");
                if (sidebar) sidebar.style.display = full ? "none" : "";
                const shell = document.querySelector(".app-shell");
                if (shell) shell.style.paddingTop = full ? "0" : "";
                const wrap = content.parentElement;
                const main = content.closest("main");
                if (main) main.style.overflowY = full ? "hidden" : "";
                if (wrap) {
                    wrap.style.height = full ? "100%" : "";
                    wrap.style.display = full ? "flex" : "";
                    wrap.style.flexDirection = full ? "column" : "";
                    wrap.style.padding = full ? "0" : "";
                    wrap.style.maxWidth = full ? "none" : "";
                }
                content.className = full ? "flex-1 min-h-0 flex flex-col" : "";
                document.body.classList.toggle("dr-noscroll", !!full);

                if (!window.currentUser) {
                    content.innerHTML = loginCardHtml();
                    const lb = document.getElementById("loginBtn");
                    if (lb) lb.onclick = () => showAuthDialog("login");
                    return;
                }
                if (view === "session" && state) content.innerHTML = sessionHtml();
                else if (view === "wizard" && wiz) content.innerHTML = wizHtml();
                else content.innerHTML = lobbyHtml();

                // overlays (intro briefing + modal) mount on <body>
                document.querySelectorAll("#drIntro, #drModalHost").forEach((n) => n.remove());
                if (view === "session" && state && showIntro) {
                    const d = document.createElement("div");
                    d.innerHTML = introHtml();
                    document.body.appendChild(d.firstElementChild);
                }
                if (modal) {
                    const tmp = document.createElement("div");
                    tmp.innerHTML = modalHtml();
                    const ov = tmp.firstElementChild;
                    if (ov) { ov.id = "drModalHost"; document.body.appendChild(ov); }
                }
                wireEvents();
                if (view === "session") drivePlay();
            }

            function wireEvents() {
                const $ = (id) => document.getElementById(id);
                const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
                // session
                on("drBackBtn", () => leaveSession());
                on("drRestartBtn", () => restartSession());
                on("drAgainBtn", () => restartSession());
                on("drLibBtn", () => { view = "lobby"; state = null; localStorage.removeItem(SESSION_KEY); render(); loadLibrary(); });
                on("drIntroStart", () => { showIntro = false; render(); });
                on("drIntroClose", () => leaveSession());
                on("drAuctionBtn", () => { showAuction = !showAuction; showNotes = false; render(); });
                on("drNotesBtn", () => { showNotes = !showNotes; showAuction = false; render(); });
                on("drLastTrickBtn", () => { showLastTrick = !showLastTrick; render(); });
                on("drHintClose", () => { hintMsg = null; render(); });
                document.querySelectorAll("[data-play]").forEach((el) => {
                    el.onclick = () => onCardClick(el.getAttribute("data-play"));
                });
                // lobby
                document.querySelectorAll("[data-tab]").forEach((el) => {
                    el.onclick = () => { lobbyTab = el.dataset.tab; render(); };
                });
                document.querySelectorAll("[data-filter]").forEach((el) => {
                    el.onclick = () => {
                        const attr = el.dataset.filter;
                        let val = el.dataset.val;
                        if (attr === "difficulty") val = parseInt(val);
                        filters[attr] = val;
                        render();
                    };
                });
                const auth = $("drAuthor");
                if (auth) auth.onchange = () => { filters.author = auth.value; render(); };
                document.querySelectorAll("[data-practice]").forEach((el) => {
                    el.onclick = () => startSession(el.getAttribute("data-practice"));
                });
                document.querySelectorAll("[data-edit]").forEach((el) => {
                    el.onclick = () => editProblem(el.getAttribute("data-edit"));
                });
                document.querySelectorAll("[data-del]").forEach((el) => {
                    el.onclick = () => { modal = { kind: "delete", id: el.getAttribute("data-del") }; render(); };
                });
                on("drNewBtn", () => startWiz(null));
                // wizard nav
                on("wizCancel", () => { wiz = null; modal = null; view = "lobby"; render(); });
                on("wizSave", () => saveWiz());
                on("wizBack", () => { if (wiz.step > 0) { wiz.step--; render(); } });
                on("wizNext", () => { if (stepOk(wiz.step) && wiz.step < WIZ_STEPS.length - 1) { wiz.step++; render(); } });
                document.querySelectorAll("[data-goto]").forEach((el) => {
                    el.onclick = () => {
                        const s = parseInt(el.dataset.goto);
                        let ok = true;
                        for (let i = 0; i < s; i++) if (!stepOk(i)) { ok = false; break; }
                        if (ok) { wiz.step = s; render(); }
                        else showToast("Finish the earlier steps first", true);
                    };
                });
                document.querySelectorAll("[data-diff]").forEach((el) => el.onclick = () => wizSet("difficulty", el.dataset.diff));
                document.querySelectorAll("[data-dealer]").forEach((el) => el.onclick = () => wizSet("dealer", el.dataset.dealer));
                document.querySelectorAll("[data-vuln]").forEach((el) => el.onclick = () => wizSet("vuln", el.dataset.vuln));
                document.querySelectorAll("[data-role]").forEach((el) => el.onclick = () => wizSet("role", el.dataset.role));
                document.querySelectorAll("[data-heroseat]").forEach((el) => el.onclick = () => wizSet("heroseat", el.dataset.heroseat));
                document.querySelectorAll("[data-call]").forEach((el) => el.onclick = () => addCall(el.dataset.call));
                document.querySelectorAll("[data-card]").forEach((el) => el.onclick = () => assignCard(el.dataset.card));
                document.querySelectorAll("[data-sel]").forEach((el) => el.onclick = () => { wiz.selSeat = parseInt(el.dataset.sel); render(); });
                document.querySelectorAll("[data-rec]").forEach((el) => el.onclick = () => recCard(el.dataset.rec));
                on("wizClearHands", () => { wiz.assign = {}; render(); });
                on("wizUndoCall", () => undoCall());
                on("wizUndoPlay", () => recUndo());
                on("wizClaimBtn", () => openClaimModal());
                // text inputs update the draft without re-render (keep focus)
                const bindInput = (id, fn) => { const el = $(id); if (el) el.oninput = () => fn(el.value); };
                bindInput("wizTitle", (v) => { wiz.title = v; });
                bindInput("wizBidComment", (v) => { wiz.bidComment = v; });
                bindInput("wizProblemComment", (v) => { wiz.problemComment = v; });
                // save button live-enables as the play step fills in
                const rec = document.querySelector("[data-rec], #wizUndoPlay");
                if (rec) { const sv = $("wizSave"); if (sv) sv.disabled = !playOk(); }
                // modals
                document.querySelectorAll("[data-modal-cancel]").forEach((el) => el.onclick = () => { modal = null; render(); });
                on("msgOk", () => {
                    const el = $("msgText");
                    wiz.plays.push({ seat: modal.seat, card: modal.card, msg: (el ? el.value : modal.msg).trim() });
                    modal = null; render();
                });
                on("claimOk", () => {
                    const t = parseInt(($("claimTricks") || {}).value);
                    const s = parseInt(($("claimScore") || {}).value);
                    if (isNaN(t) || t < modal.min || t > modal.max) { showToast("Tricks out of range", true); return; }
                    wiz.claim = { tricks: t, scoreNs: isNaN(s) ? 0 : s };
                    modal = null; render();
                });
                on("claimRemove", () => { wiz.claim = null; modal = null; render(); });
                on("delOk", () => { if (modal && modal.id) deleteProblem(modal.id); });
                const ct = $("claimTricks");
                if (ct) ct.oninput = () => { const c = wizContract(); if (c) suggestScore(c, parseInt(ct.value) || modal.min); };
            }

            // ---- bootstrap ----
            document.addEventListener("authchange", () => {
                if (window.currentUser) {
                    loadLibrary();
                    const sid = localStorage.getItem(SESSION_KEY);
                    if (sid) resumeSession(sid);
                } else {
                    view = "lobby"; state = null; wiz = null; modal = null;
                    localStorage.removeItem(SESSION_KEY);
                    render();
                }
            });
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden && view === "session") drivePlay();
            });
            refreshAuthState();
            render();
            if (window.currentUser) loadLibrary();
        </script>
    </body>
</html>
