    <body
        class="cb-page text-white font-body selection:bg-tertiary-container/30 overflow-hidden"
    >
        <div id="app"></div>

        <script>
            document.getElementById("app").innerHTML = renderLayout({
                mode: "play",
                badge: "Play",
                title: "Play vs Bots",
                subtitle:
                    "Deal a solo board against three bidding-dt bots, or open a persistent partner table for two humans (North–South) against the East/West bots: an 8-board match dealt up front and bid in parallel. Every board is scored in IMPs versus double-dummy par.",
            });

            const SEAT_NAMES = ["North", "East", "South", "West"];
            const VULN_NAMES = ["None", "N-S", "E-W", "Both"];
            const SUIT_SYMBOL = { S: "♠", H: "♥", D: "♦", C: "♣", N: "NT" };
            const SUIT_ORDER = ["C", "D", "H", "S", "N"];
            const TILE_CLS = { C: "c", D: "d", H: "h", S: "s", N: "n" };
            const BOARD_KEY = "atheneum_play_board";
            const TEAM_KEY = "atheneum_play_team";
            const TURN_ALERT_KEY = "atheneum_play_turn_alerts";

            let state = null;
            let stats = null;
            let games = null;
            let allUsers = [];
            let busy = false;
            let autoRetries = 0;
            let bidLevelSel = null;
            let bidLevelKey = null;
            let pollTimer = null;
            let overlay = null;
            let turnAlertsOn = localStorage.getItem(TURN_ALERT_KEY) !== "0";
            let prevGamesTurn = null; // lobby: game id -> yourTurn, for transitions
            let pendingTurnToast = null; // alert text deferred while the page is hidden

            function dcolorSuits(text) {
                return escapeHtml(text)
                    .replace(/♣/g, '<span style="color:#8fd694;">♣</span>')
                    .replace(/♠/g, '<span style="color:#8fd694;">♠</span>')
                    .replace(/♦/g, '<span style="color:#f08a8a;">♦</span>')
                    .replace(/♥/g, '<span style="color:#f08a8a;">♥</span>');
            }

            function contractHtml(text) {
                const t = String(text || "").replace(
                    /([1-7])([CDHSN])/g,
                    (m, l, d) => l + (d === "N" ? "NT" : SUIT_SYMBOL[d]),
                );
                return dcolorSuits(t);
            }

            function contractString(c) {
                if (!c) return "passed out";
                const pen = ["", "X", "XX"][c.penalty] || "";
                const decl = "NESW"[c.declarer] || "?";
                return `${c.level}${c.denom}${pen} by ${decl}`;
            }

            function signed(n, digits) {
                const v = Number(n);
                const s = digits === undefined ? String(v) : v.toFixed(digits);
                return v > 0 ? "+" + s : s;
            }

            function scoreText(n) {
                return n > 0 ? "+" + n : String(n);
            }

            function hcpOf(handStr) {
                let t = 0;
                for (const c of String(handStr || "").replace(/\./g, "")) {
                    if (c === "A") t += 4;
                    else if (c === "K") t += 3;
                    else if (c === "Q") t += 2;
                    else if (c === "J") t += 1;
                }
                return t;
            }

            function cardFan(handStr, small) {
                const suits = [
                    ["S", "♠", 0, 0],
                    ["H", "♥", 1, 1],
                    ["C", "♣", 0, 3],
                    ["D", "♦", 1, 2],
                ];
                const parts = String(handStr || "").split(".");
                const cards = [];
                suits.forEach(([, sym, red, pi]) => {
                    (parts[pi] || "").split("").forEach((r) =>
                        cards.push({ r, sym, red }),
                    );
                });
                if (!cards.length) return "";
                return (
                    `<div class="cb-fan ${small ? "cb-fan-sm" : ""}">` +
                    cards
                        .map((c) => {
                            const rank = c.r === "T" ? "10" : c.r;
                            return `<span class="cb-card ${c.red ? "red" : "blk"}"><span class="cb-corner"><b>${rank}</b><i>${c.sym}</i></span><span class="cb-midsuit">${c.sym}</span></span>`;
                        })
                        .join("") +
                    `</div>`
                );
            }

            function diagramSeatHtml(seat, handStr, youSeat) {
                const suits = [
                    ["♠", 0, "s"],
                    ["♥", 1, "h"],
                    ["♦", 2, "d"],
                    ["♣", 3, "c"],
                ];
                const parts = String(handStr || "").split(".");
                const lines = suits
                    .map(([sym, pi, cls]) => {
                        const cards = (parts[pi] || "")
                            .split("")
                            .filter(Boolean)
                            .map((r) => (r === "T" ? "10" : r))
                            .join(" ");
                        return `<div class="cb-dg-line"><span class="cb-dg-su ${cls}">${sym}</span><span class="cb-dg-cards">${cards || "—"}</span></div>`;
                    })
                    .join("");
                return `
                    <div class="cb-dg-name">${SEAT_NAMES[seat]}${youSeat === seat ? " · you" : ""} · ${hcpOf(handStr)} HCP</div>
                    ${lines}`;
            }

            function handsDiagramHtml(hands, youSeat) {
                const cls = ["cb-dg-n", "cb-dg-e", "cb-dg-s", "cb-dg-w"];
                return (
                    `<div class="cb-diagram">` +
                    [0, 1, 2, 3]
                        .map(
                            (s) =>
                                `<div class="cb-dg-seat ${cls[s]}">${diagramSeatHtml(s, hands[s], youSeat)}</div>`,
                        )
                        .join("") +
                    `</div>`
                );
            }

            // Mobile only: N and S sit in separate full-width grid areas and
            // center to their own content width, so the narrower block's left
            // edge drifts right. Give both the wider block's width so they
            // share the same centered axis and left edge.
            function alignHandDiagram(root) {
                if (
                    !window.matchMedia ||
                    !window.matchMedia("(max-width: 400px)").matches
                )
                    return;
                root.querySelectorAll(".cb-diagram").forEach((d) => {
                    const n = d.querySelector(".cb-dg-n");
                    const s = d.querySelector(".cb-dg-s");
                    if (!n || !s) return;
                    n.style.width = s.style.width = "";
                    const w = Math.max(n.offsetWidth, s.offsetWidth);
                    n.style.width = s.style.width = w + "px";
                });
            }

            function impsColor(imps) {
                if (imps > 0) return "text-[#6ee7a0]";
                if (imps < 0) return "text-[#f08a8a]";
                return "text-[#9aa7b8]";
            }

            function timeAgo(ts) {
                const d = new Date(ts);
                if (isNaN(d)) return "";
                const mins = Math.floor((Date.now() - d.getTime()) / 60000);
                if (mins < 1) return "just now";
                if (mins < 60) return mins + "m ago";
                const hrs = Math.floor(mins / 60);
                if (hrs < 24) return hrs + "h ago";
                return Math.floor(hrs / 24) + "d ago";
            }

            // ---- Bid alerts (from the bot model's self-play tree) ----
            // state.alerts parallels state.calls (null for human seats and
            // unseen positions); state.optionAlerts parallels state.legal.
            const ALERT_SUITS = ["♠", "♥", "♦", "♣"]; // S,H,D,C server order

            function callLabel(c) {
                if (!c) return "";
                if (c === "P") return "pass";
                if (c === "X") return "double";
                if (c === "XX") return "redouble";
                return c[0] + (c[1] === "N" ? "NT" : SUIT_SYMBOL[c[1]]);
            }

            function alertText(a) {
                if (!a) return "";
                const suits = a.suits
                    .map((r, i) => `${ALERT_SUITS[i]} ${r[0]}–${r[1]}`)
                    .join(" · ");
                const pct =
                    a.pct > 0
                        ? ` · picked ${(a.pct * 100).toFixed(1)}% here`
                        : "";
                return `${a.hcp[0]}–${a.hcp[1]} HCP · ${suits} · ${a.n.toLocaleString()} self-play deals${pct}`;
            }

            function alertBoxLine(label, text, dim) {
                return `<span class="material-symbols-outlined">campaign</span>` +
                    `<span>${dim ? `<span class="dim">${escapeHtml(text)}</span>` : `${label ? `<b>${escapeHtml(label)}</b> — ` : ""}${escapeHtml(text)}`}</span>`;
            }

            function setAlertBox(html) {
                const el = document.getElementById("alertBox");
                if (el) el.innerHTML = html;
            }

            function hasAlertData() {
                if (!state) return false;
                return (
                    (state.alerts || []).some(Boolean) ||
                    (state.optionAlerts || []).some(Boolean)
                );
            }

            // Default box content: the alert of the most recent bot bid, so
            // every bid the bots make is announced as it lands.
            function defaultAlertLine() {
                const list = (state && state.calls) || [];
                for (let i = list.length - 1; i >= 0; i--) {
                    const a = state.alerts && state.alerts[i];
                    if (a) {
                        const seat = SEAT_NAMES[(state.dealer + i) % 4];
                        return alertBoxLine(
                            `${seat} · ${callLabel(list[i])}`,
                            alertText(a),
                        );
                    }
                }
                return alertBoxLine(
                    "",
                    "Bid alerts: tap a marked bid to see what it promises; hover or tap % on your own options.",
                    true,
                );
            }

            function showOptAlert(c) {
                if (!state) return;
                const i = (state.legal || []).indexOf(c);
                const a =
                    i >= 0 && state.optionAlerts
                        ? state.optionAlerts[i]
                        : null;
                if (a) setAlertBox(alertBoxLine(`Your ${callLabel(c)}`, alertText(a)));
            }

            function optionAlertMap() {
                const m = {};
                if (!state || !state.legal) return m;
                state.legal.forEach((c, i) => {
                    const a = state.optionAlerts && state.optionAlerts[i];
                    if (a) m[c] = a;
                });
                return m;
            }

            function alertBoxHtml() {
                if (!hasAlertData()) return "";
                return `<div id="alertBox" class="cb-alertbox">${defaultAlertLine()}</div>`;
            }

            // ---- Turn alerts (partner tables: 2 players vs 2 bots) ----
            // A table that was not waiting for you starts waiting for you ->
            // system notification where the browser allows it (desktop,
            // Android; on iOS Safari only for installed PWAs), plus toast,
            // vibration and a title badge as the everywhere fallbacks.

            function yourTurnBoards(s) {
                if (!s || s.mode !== "team") return [];
                return (s.boards || [])
                    .filter((b) => !b.done && b.yourTurn)
                    .map((b) => b.no);
            }

            function newTurnBoards(prev, next) {
                const had = new Set(yourTurnBoards(prev));
                return yourTurnBoards(next).filter((no) => !had.has(no));
            }

            function sendTurnAlert(title, body, tag, onclick) {
                if (
                    typeof Notification !== "undefined" &&
                    Notification.permission === "granted"
                ) {
                    try {
                        const n = new Notification(title, {
                            body,
                            tag,
                            renotify: true,
                        });
                        n.onclick = () => {
                            window.focus();
                            if (onclick) onclick();
                            n.close();
                        };
                    } catch (e) {}
                } else if (document.hidden) {
                    // No system notifications (iOS Safari): show it on return
                    pendingTurnToast = body;
                }
                if (navigator.vibrate) {
                    try {
                        navigator.vibrate([120, 60, 120]);
                    } catch (e) {}
                }
                if (!document.hidden) showToast(body);
            }

            // In-table: new boards of the open match became the player's turn
            function notifyBoardsTurn(s, boards) {
                const who = s.yourSeat === 2 ? s.partner : s.host;
                const label = `Board${boards.length > 1 ? "s" : ""} ${boards.join(", ")} — your turn to bid`;
                sendTurnAlert(
                    "Your turn · Bridge Trainer",
                    `${label} (table with ${who || "partner"})`,
                    `turn-${s.id}`,
                    () => {
                        if (
                            state &&
                            state.mode === "team" &&
                            state.id === s.id &&
                            state.boardSel !== boards[0]
                        )
                            teamSelectBoard(boards[0]);
                    },
                );
            }

            // Lobby: a table in the list became the player's turn
            function notifyGameTurn(g) {
                const who = g.yourSeat === 2 ? g.partner : g.host;
                sendTurnAlert(
                    "Your turn · Bridge Trainer",
                    `Table with ${who || "partner"} awaits your bid`,
                    `turn-${g.id}`,
                    () => teamOpen(g.id),
                );
            }

            // ---- Web Push: turn alerts while the page is closed ----
            // The server pushes when a team board flips to a member's turn;
            // static/sw.js shows it unless a focused window alerts in-page.
            // Needs a secure origin; iOS only delivers to sites installed
            // on the home screen (iOS 16.4+).

            function pushCapable() {
                return (
                    "serviceWorker" in navigator && "PushManager" in window
                );
            }

            function urlB64ToUint8(base64) {
                const pad = "=".repeat((4 - (base64.length % 4)) % 4);
                const b = atob(
                    (base64 + pad).replace(/-/g, "+").replace(/_/g, "/"),
                );
                const arr = new Uint8Array(b.length);
                for (let i = 0; i < b.length; i++) arr[i] = b.charCodeAt(i);
                return arr;
            }

            async function pushEnable() {
                if (!pushCapable()) return false;
                try {
                    const reg = await navigator.serviceWorker.ready;
                    const res = await fetch("/api/play/push/key");
                    if (!res.ok) return false;
                    const { key } = await res.json();
                    const opts = {
                        userVisibleOnly: true,
                        applicationServerKey: urlB64ToUint8(key),
                    };
                    let sub;
                    try {
                        sub = await reg.pushManager.subscribe(opts);
                    } catch (e) {
                        // an old subscription from a different VAPID key
                        const old = await reg.pushManager.getSubscription();
                        if (old) await old.unsubscribe();
                        sub = await reg.pushManager.subscribe(opts);
                    }
                    const r = await fetch("/api/play/push/subscribe", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(sub),
                    });
                    return r.ok;
                } catch (e) {
                    return false;
                }
            }

            async function pushDisable() {
                if (!pushCapable()) return;
                try {
                    const reg = await navigator.serviceWorker.ready;
                    const sub = await reg.pushManager.getSubscription();
                    if (!sub) return;
                    const endpoint = sub.endpoint;
                    await sub.unsubscribe();
                    await fetch("/api/play/push/unsubscribe", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ endpoint }),
                    });
                } catch (e) {}
            }

            async function enableTurnAlertsFlow() {
                if (
                    typeof Notification !== "undefined" &&
                    Notification.permission === "default"
                ) {
                    try {
                        await Notification.requestPermission();
                    } catch (e) {}
                }
                const pushed = await pushEnable();
                if (pushed)
                    showToast(
                        "Turn alerts on — delivered even with the page closed",
                    );
                else if (
                    typeof Notification !== "undefined" &&
                    Notification.permission === "granted"
                )
                    showToast(
                        "Turn alerts on (this browser delivers them only while the page is open)",
                    );
                else showToast("Turn alerts on (in-app only)");
                render();
            }

            function maybeAskNotifyPermission() {
                if (!turnAlertsOn) return;
                if (
                    typeof Notification !== "undefined" &&
                    Notification.permission === "default"
                ) {
                    Notification.requestPermission()
                        .then(() => pushEnable())
                        .catch(() => {});
                } else {
                    pushEnable(); // keep the server-side binding fresh
                }
            }

            function toggleTurnAlerts() {
                turnAlertsOn = !turnAlertsOn;
                localStorage.setItem(TURN_ALERT_KEY, turnAlertsOn ? "1" : "0");
                if (turnAlertsOn) {
                    enableTurnAlertsFlow();
                } else {
                    pushDisable();
                    showToast("Turn alerts off");
                }
                render();
            }

            function updateTitleAlert(s) {
                let n = 0;
                if (s && s.mode === "team") n = yourTurnBoards(s).length;
                else if (!s && games)
                    n = games.filter((g) => g.yourTurn).length;
                document.title =
                    turnAlertsOn && n > 0
                        ? `● Your turn (${n}) · Bridge Trainer`
                        : "Bridge Trainer | Play vs Bots";
            }

            function cbChip(c, alertIdx) {
                let chip;
                if (c === "P") chip = `<span class="cb-call cb-call-p">pass</span>`;
                else if (c === "X") chip = `<span class="cb-call cb-call-x">X</span>`;
                else if (c === "XX") chip = `<span class="cb-call cb-call-xx">XX</span>`;
                else {
                    const sym = c[1] === "N" ? "NT" : SUIT_SYMBOL[c[1]];
                    chip = `<span class="cb-call cb-call-${TILE_CLS[c[1]]}">${c[0]}<b style="font-size:.75rem;">${sym}</b></span>`;
                }
                if (alertIdx === null || alertIdx === undefined) return chip;
                return `<span class="cb-chipwrap" data-alert-call="${alertIdx}" title="What this bid showed">${chip}<i class="cb-alertdot">!</i></span>`;
            }

            function auctionHtml(dealer, vuln, calls, pending, youSeat, alerts) {
                const cols = [0, 1, 2, 3].map((k) => (dealer + k) % 4);
                const list = calls || [];
                const rows = [];
                for (let i = 0; i < list.length; i += 4)
                    rows.push(list.slice(i, i + 4).map((c, j) => ({ c, i: i + j })));
                if (pending !== null && pending !== undefined) {
                    const pos = (pending - dealer + 4) % 4;
                    let r = Math.floor(list.length / 4);
                    if (!rows[r]) rows[r] = [];
                    if (pos < rows[r].length) {
                        r++;
                        rows[r] = [];
                    }
                    while (rows[r].length < pos) rows[r].push({ c: null });
                    rows[r].push({ q: true });
                }
                const vulnSeat = (s) =>
                    vuln === 3 ||
                    (vuln === 1 && s % 2 === 0) ||
                    (vuln === 2 && s % 2 === 1);
                const head = cols
                    .map((s) => {
                        const v = vulnSeat(s);
                        const cls = `cb-seatv ${v ? "v" : "nv"}${s === dealer ? " dlr" : ""}${s === youSeat ? " you" : ""}`;
                        return `<div><span class="${cls}" title="${v ? "Vulnerable" : "Not vulnerable"}">${SEAT_NAMES[s][0]}</span></div>`;
                    })
                    .join("");
                const body = rows.length
                    ? rows
                          .map(
                              (row) =>
                                  `<div class="cb-auc-row">` +
                                  row
                                      .map(
                                          (cell) =>
                                               `<div class="cb-auc-cell">${
                                                   cell.q
                                                       ? `<span class="cb-q">?</span>`
                                                       : cell.c
                                                         ? cbChip(
                                                               cell.c,
                                                               alerts && alerts[cell.i]
                                                                   ? cell.i
                                                                   : null,
                                                           )
                                                         : ""
                                               }</div>`,
                                      )
                                      .join("") +
                                  `</div>`,
                          )
                          .join("")
                    : `<div class="cb-auc-empty">no calls yet</div>`;
                return `
                    <div class="cb-auction">
                        <div class="cb-auc-meta">
                            <span>Dealer ${SEAT_NAMES[dealer][0]} · <span class="${vuln === 0 ? "cb-vuln-nv" : "cb-vuln-v"}">Vuln ${VULN_NAMES[vuln]}</span></span>
                            <span>${list.length} call${list.length === 1 ? "" : "s"}</span>
                        </div>
                        <div class="cb-auc-head">${head}</div>
                        <div class="cb-auc-body">${body}</div>
                    </div>`;
            }

            async function handleResponse(res) {
                if (res.status === 401) {
                    busy = false;
                    render();
                    showAuthDialog("login");
                    return;
                }
                let data = null;
                try {
                    data = await res.json();
                } catch (e) {}
                if (!res.ok) {
                    busy = false;
                    autoRetries++;
                    if (res.status === 404) {
                        if (state) {
                            localStorage.removeItem(
                                state.mode === "team" ? TEAM_KEY : BOARD_KEY,
                            );
                            state = null;
                        }
                        refreshLobby();
                    }
                    showToast((data && data.error) || "Request failed", true);
                    render();
                    return;
                }
                if (data.mode === "team") {
                    if (
                        turnAlertsOn &&
                        state &&
                        state.mode === "team" &&
                        state.id === data.id
                    ) {
                        const added = newTurnBoards(state, data);
                        if (added.length) notifyBoardsTurn(data, added);
                    }
                    const changed =
                        !state ||
                        state.mode !== "team" ||
                        state.id !== data.id ||
                        JSON.stringify(state) !== JSON.stringify(data);
                    state = data;
                    localStorage.setItem(TEAM_KEY, data.id);
                    localStorage.removeItem(BOARD_KEY);
                    busy = false;
                    autoRetries = 0;
                    if (changed) render();
                    else schedulePoll();
                    return;
                }
                data.mode = "solo";
                state = data;
                localStorage.setItem(BOARD_KEY, data.id);
                localStorage.removeItem(TEAM_KEY);
                if (data.stats) stats = data.stats;
                busy = false;
                autoRetries = 0;
                render();
            }

            async function post(path, body) {
                busy = true;
                render();
                try {
                    const res = await fetch(path, {
                        method: "POST",
                        headers: body
                            ? { "Content-Type": "application/json" }
                            : {},
                        body: body ? JSON.stringify(body) : undefined,
                    });
                    await handleResponse(res);
                } catch (e) {
                    busy = false;
                    showToast("Network error", true);
                    render();
                }
            }

            async function newBoard() {
                if (!window.currentUser) {
                    showAuthDialog("login");
                    return;
                }
                if (busy) return;
                await post("/api/play/new");
            }

            async function makeCall(call) {
                if (!state || busy || state.done || !state.yourTurn) return;
                if (state.mode === "team") {
                    await post(`/api/play/team/${state.id}/call`, {
                        call: call,
                        board: state.boardSel,
                    });
                } else {
                    await post(`/api/play/${state.id}/call`, { call: call });
                }
            }

            async function refreshBoard(force) {
                if (!state || busy) return;
                if (
                    !force &&
                    !state.done &&
                    state.yourTurn &&
                    state.mode !== "team"
                )
                    return;
                if (!force && state.mode === "solo" && state.done) return;
                const quiet =
                    state.mode === "team" &&
                    !state.done &&
                    (state.yourTurn || state.noBoard);
                busy = true;
                if (!quiet) render();
                try {
                    const path =
                        state.mode === "team"
                            ? `/api/play/team/${state.id}` +
                              (state.boardSel
                                  ? `?board=${state.boardSel}`
                                  : "")
                            : `/api/play/${state.id}`;
                    const res = await fetch(path);
                    await handleResponse(res);
                } catch (e) {
                    busy = false;
                    render();
                }
            }

            async function teamStart() {
                if (!state || state.mode !== "team" || busy) return;
                await post(`/api/play/team/${state.id}/start`);
            }

            async function teamSelectBoard(no) {
                if (!state || state.mode !== "team" || busy) return;
                if (no === state.boardSel) return;
                busy = true;
                try {
                    const res = await fetch(
                        `/api/play/team/${state.id}?board=${no}`,
                    );
                    await handleResponse(res);
                } catch (e) {
                    busy = false;
                    showToast("Network error", true);
                    schedulePoll();
                }
            }

            async function teamCreate() {
                if (!window.currentUser) {
                    showAuthDialog("login");
                    return;
                }
                if (busy) return;
                const input = document.getElementById("partnerName");
                const partner = ((input && input.value) || "")
                    .trim()
                    .toLowerCase();
                if (!partner) {
                    showToast("Enter your partner's username", true);
                    return;
                }
                maybeAskNotifyPermission();
                await post("/api/play/team/new", { partner: partner });
            }

            async function teamOpen(id) {
                if (busy) return;
                maybeAskNotifyPermission();
                busy = true;
                render();
                try {
                    const res = await fetch(
                        "/api/play/team/" + encodeURIComponent(id),
                    );
                    await handleResponse(res);
                } catch (e) {
                    busy = false;
                    render();
                }
            }

            async function teamNext() {
                if (!state || state.mode !== "team" || busy) return;
                await post(`/api/play/team/${state.id}/next`);
            }

            function leaveTable() {
                if (state && state.mode === "team") {
                    localStorage.removeItem(TEAM_KEY);
                } else {
                    localStorage.removeItem(BOARD_KEY);
                }
                state = null;
                refreshLobby();
            }

            async function teamDelete(id) {
                if (
                    !confirm(
                        "Delete this table for good? Both players lose its history.",
                    )
                )
                    return;
                try {
                    const res = await fetch(
                        "/api/play/team/" + encodeURIComponent(id),
                        { method: "DELETE" },
                    );
                    if (res.ok) {
                        showToast("Table deleted");
                        refreshLobby();
                    } else {
                        showToast("Could not delete table", true);
                    }
                } catch (e) {
                    showToast("Network error", true);
                }
            }

            async function loadGames() {
                try {
                    const res = await fetch("/api/play/team/list");
                    if (res.ok) games = (await res.json()).games || [];
                } catch (e) {}
                checkLobbyTurnAlerts();
            }

            // Lobby polling: fire once per table when its yourTurn flips on
            function checkLobbyTurnAlerts() {
                if (!games) return;
                const now = {};
                for (const g of games) now[g.id] = !!g.yourTurn;
                if (turnAlertsOn && prevGamesTurn) {
                    for (const g of games) {
                        if (now[g.id] && prevGamesTurn[g.id] === false) {
                            notifyGameTurn(g);
                            break; // one alert per poll is enough
                        }
                    }
                }
                prevGamesTurn = now;
            }

            async function loadUsers() {
                try {
                    const res = await fetch("/api/users");
                    if (res.ok) allUsers = (await res.json()).users || [];
                } catch (e) {}
            }

            async function refreshLobby() {
                const input = document.getElementById("partnerName");
                if (input && (input.value || document.activeElement === input)) {
                    clearTimeout(pollTimer);
                    pollTimer = setTimeout(refreshLobby, 5000);
                    return;
                }
                await loadGames();
                render();
            }

            async function loadInitial() {
                try {
                    const res = await fetch("/api/play/stats");
                    if (res.ok) stats = await res.json();
                } catch (e) {}
                await loadGames();
                await loadUsers();

                const tid = localStorage.getItem(TEAM_KEY);
                if (tid) {
                    try {
                        const res = await fetch(
                            "/api/play/team/" + encodeURIComponent(tid),
                        );
                        if (res.ok) {
                            state = await res.json();
                            state.mode = "team";
                            localStorage.removeItem(BOARD_KEY);
                            busy = false;
                            render();
                            return;
                        }
                        localStorage.removeItem(TEAM_KEY);
                    } catch (e) {}
                }
                const bid = localStorage.getItem(BOARD_KEY);
                if (bid) {
                    try {
                        const res = await fetch(
                            "/api/play/" + encodeURIComponent(bid),
                        );
                        if (res.ok) {
                            state = await res.json();
                            state.mode = "solo";
                            if (state.stats) stats = state.stats;
                            busy = false;
                            render();
                            return;
                        }
                        localStorage.removeItem(BOARD_KEY);
                    } catch (e) {}
                }
                render();
            }

            function spinner(msg) {
                return `
                    <span class="material-symbols-outlined text-[#8fd694] animate-spin">progress_activity</span>
                    <span class="text-sm text-[#a9c3c3] font-label">${msg}</span>`;
            }

            function bidAreaHtml() {
                const legal = new Set(state.legal || []);
                const avail = [];
                for (let l = 1; l <= 7; l++)
                    if (SUIT_ORDER.some((d) => legal.has(l + d))) avail.push(l);
                const key = `${state.mode}|${state.boardSel}|${(state.calls || []).length}`;
                if (key !== bidLevelKey || !avail.includes(bidLevelSel)) {
                    bidLevelKey = key;
                    bidLevelSel = avail.length ? avail[0] : null;
                }
                const tabs = [1, 2, 3, 4, 5, 6, 7]
                    .map((l) => {
                        const ok = avail.includes(l) && !busy;
                        return `<button data-level="${l}" ${ok ? "" : "disabled"} class="cb-level ${l === bidLevelSel ? "sel" : ""}">${l}</button>`;
                    })
                    .join("");
                const l = bidLevelSel;
                const opt = optionAlertMap();
                const optBits = (c) => {
                    const a = opt[c];
                    if (!a) return { t: "", b: "" };
                    return {
                        t: ` title="${escapeHtml(alertText(a))}"`,
                        b:
                            a.pct > 0
                                ? `<i class="cb-pct">${Math.round(a.pct * 100)}%</i>`
                                : "",
                    };
                };
                const tiles = SUIT_ORDER.map((d) => {
                    const ok = l !== null && legal.has(l + d) && !busy;
                    const sym = d === "N" ? "NT" : SUIT_SYMBOL[d];
                    const o = optBits(`${l}${d}`);
                    return `<button data-call="${l}${d}" data-opt="${l}${d}" ${ok ? "" : "disabled"}${o.t} class="cb-tile cb-tile-${TILE_CLS[d]}">${l}<b>${sym}</b>${o.b}</button>`;
                }).join("");
                const xo = optBits("X");
                const dbl =
                    legal.has("X") && !busy
                        ? `<button data-call="X" data-opt="X"${xo.t} class="cb-tile cb-tile-x">X${xo.b}</button>`
                        : "";
                const xxo = optBits("XX");
                const rdbl =
                    legal.has("XX") && !busy
                        ? `<button data-call="XX" data-opt="XX"${xxo.t} class="cb-tile cb-tile-xx">XX${xxo.b}</button>`
                        : "";
                const po = optBits("P");
                const pass = `<button data-call="P" data-opt="P"${po.t} ${legal.has("P") && !busy ? "" : "disabled"} class="cb-pass">PASS${po.b}</button>`;
                return `<span id="bidArea" class="block">
                    <div class="cb-levels">${tabs}</div>
                    <div class="cb-bidpanel">${tiles}${dbl}${rdbl}${pass}</div>
                </span>`;
            }

            function wireBidArea(root) {
                const box = root.getElementById("bidArea");
                if (!box) return;
                box.querySelectorAll("[data-level]").forEach((btn) => {
                    btn.onclick = () => {
                        bidLevelSel = parseInt(btn.dataset.level, 10);
                        refreshBidArea();
                    };
                });
                box.querySelectorAll("[data-call]").forEach((btn) => {
                    btn.onclick = () => makeCall(btn.dataset.call);
                });
                box.querySelectorAll("[data-opt]").forEach((btn) => {
                    const c = btn.dataset.opt;
                    btn.onmouseenter = () => showOptAlert(c);
                    btn.onmouseleave = () => setAlertBox(defaultAlertLine());
                    const pct = btn.querySelector(".cb-pct");
                    if (pct)
                        pct.onclick = (e) => {
                            e.stopPropagation();
                            showOptAlert(c);
                        };
                });
            }

            function refreshBidArea() {
                const el = document.getElementById("bidArea");
                if (!el || !state) return;
                el.outerHTML = bidAreaHtml();
                wireBidArea(document);
            }

            // Tapping a marked auction chip explains what that bid showed.
            function wireAlertChips(root) {
                root.querySelectorAll("[data-alert-call]").forEach((el) => {
                    el.onclick = () => {
                        if (!state) return;
                        const i = parseInt(el.dataset.alertCall, 10);
                        const a = state.alerts && state.alerts[i];
                        if (!a) return;
                        const seat = SEAT_NAMES[(state.dealer + i) % 4];
                        const call = (state.calls || [])[i];
                        setAlertBox(
                            alertBoxLine(
                                `${seat} · ${callLabel(call)}`,
                                alertText(a),
                            ),
                        );
                    };
                });
            }

            function waitingHtml() {
                const team = state.mode === "team";
                const partnerSeat =
                    team && state.seatNames
                        ? state.seatNames[String(state.nextSeat)]
                        : "";
                let inner;
                if (busy) {
                    inner = spinner(
                        team ? "Updating the table…" : "The bots are bidding…",
                    );
                } else if (partnerSeat) {
                    inner = spinner(escapeHtml(partnerSeat) + " is thinking…");
                } else if (state.yourTurn) {
                    inner = `<span class="material-symbols-outlined text-[#9aa7b8]">wifi_off</span>
                             <span class="flex-1">Could not load your options.</span>
                             <button id="retryBtn" class="cb-btn-ghost">
                                 <span class="material-symbols-outlined text-sm">refresh</span>
                                 Retry
                             </button>`;
                } else {
                    inner = spinner("Waiting for the bots to bid…");
                }
                const otherYours =
                    team &&
                    !state.done &&
                    (state.boards || []).find(
                        (b) => !b.done && b.yourTurn && b.no !== state.boardSel,
                    );
                if (otherYours) {
                    inner += `<button data-board="${otherYours.no}" class="cb-nexthand ml-auto">
                        <span class="material-symbols-outlined text-sm">touch_app</span>Board ${otherYours.no} awaits
                    </button>`;
                }
                return `<div class="cb-wait">${inner}</div>`;
            }

            function resultHtml() {
                const r = state.result;
                let contractLine, trickLine;
                if (r.contract) {
                    const c = r.contract;
                    const side =
                        c.declarer % 2 === state.humanSeat % 2
                            ? "your side"
                            : "the bots";
                    const pen = ["", " doubled", " redoubled"][c.penalty] || "";
                    const need = c.level + 6;
                    const margin = r.tricks - need;
                    const made = margin >= 0;
                    contractLine = `${c.level}${SUIT_SYMBOL[c.denom]}${pen} by ${SEAT_NAMES[c.declarer]} (${side})`;
                    trickLine = `${r.tricks} double-dummy tricks — ${made ? "made " + (margin > 0 ? "+" + margin : "exactly") : margin + " down"}`;
                } else {
                    contractLine = "Passed out";
                    trickLine = "no contract was reached";
                }
                return `
                    <div class="cb-result pop-in">
                        <div class="min-w-0 flex-1">
                            <div class="font-headline font-extrabold text-lg text-white">${dcolorSuits(contractLine)}</div>
                            <div class="text-xs text-[#9fc0c0] mt-0.5">${trickLine}</div>
                            <div class="text-[11px] text-[#7fa0a0] mt-1 font-label">
                                Par (N-S) <b>${scoreText(r.parNs)}</b> · Your score (N-S) <b>${scoreText(r.scoreNs)}</b>
                            </div>
                        </div>
                        <div class="text-center px-3 py-1 rounded-xl" style="background:rgba(0,0,0,.25);">
                            <div class="text-[9px] uppercase tracking-[0.2em] text-[#7fa0a0] font-label font-bold">IMPs vs par</div>
                            <div class="victory-imps text-3xl font-headline font-extrabold leading-tight ${impsColor(r.imps)}">${signed(r.imps)}</div>
                        </div>
                        <div class="w-full flex flex-wrap gap-2 mt-1">
                            <button id="nextBoardBtn" class="cb-btn-green">
                                <span class="material-symbols-outlined text-sm">${state.mode === "team" && state.matchDone ? "restart_alt" : "casino"}</span>
                                ${state.mode === "team" && state.matchDone ? "Start next match" : "Next board"}
                            </button>
                        </div>
                    </div>`;
            }

            function allHandsHtml() {
                if (!state.hands) return "";
                return handsDiagramHtml(state.hands, state.humanSeat);
            }

            function teamReadyHtml() {
                return `
                    <div class="cb-ready pop-in">
                        <span class="material-symbols-outlined text-4xl text-[#f2ca4c]" style="font-variation-settings:'FILL' 1;">playing_cards</span>
                        <p class="font-headline font-extrabold text-xl text-white mt-3">Table ready</p>
                        <p class="text-xs text-[#9aa7b8] mt-2 leading-relaxed max-w-xs">You &amp; ${escapeHtml(state.partner)} vs the East/West bots. An 8-board match is dealt all at once — every board runs its own auction, and you bid them in any order.</p>
                        <button id="dealFirstBtn" class="cb-btn-green mt-5">
                            <span class="material-symbols-outlined text-sm">casino</span>Start 8-board match
                        </button>
                    </div>`;
            }

            function dealingHtml() {
                return `
                    <div class="cb-ready pop-in">
                        ${spinner("Dealing the 8 boards and letting the bots open…")}
                    </div>`;
            }

            function nextTeamBoardTarget() {
                const list = state.boards || [];
                if (!list.length) return null;
                const idx = Math.max(
                    list.findIndex((b) => b.no === state.boardSel),
                    0,
                );
                for (let pass = 0; pass < 2; pass++) {
                    for (let k = 1; k <= list.length; k++) {
                        const b = list[(idx + k) % list.length];
                        if (b.done) continue;
                        if (pass === 0 && !b.yourTurn) continue;
                        return b.no;
                    }
                }
                return null;
            }

            function topBarHtml() {
                const team = state.mode === "team";
                const list = state.boards || [];
                let no, sub;
                if (team) {
                    const partner =
                        state.yourSeat === 2 ? state.partner : state.host;
                    no = state.noBoard ? "—" : state.boardSel;
                    const done = list.filter((b) => b.done).length;
                    sub =
                        escapeHtml(partner || "") +
                        (list.length
                            ? ` · ${done}/${list.length} boards · ${signed(state.matchImps || 0)} IMPs`
                            : "");
                } else {
                    no = stats ? stats.boards + (state.done ? 0 : 1) : 1;
                    sub = `Solo vs bots · dealer ${SEAT_NAMES[state.dealer][0]} · ${VULN_NAMES[state.vuln]} vuln`;
                }
                const arrows =
                    team && list.length
                        ? `
                        <button id="prevHandBtn" class="cb-iconbtn" title="Previous hand" ${state.boardSel <= 1 ? "disabled" : ""}>
                            <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1;">arrow_back_ios</span>
                        </button>
                        <button id="nextHandBtn" class="cb-iconbtn" title="Next hand" ${state.boardSel >= list.length ? "disabled" : ""}>
                            <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1;">arrow_forward_ios</span>
                        </button>`
                        : "";
                const target =
                    team && !state.noBoard ? nextTeamBoardTarget() : null;
                const jump =
                    target !== null
                        ? `<button id="jumpHandBtn" class="cb-nexthand" title="Go to the next hand where it is your turn to bid">
                               <span class="material-symbols-outlined text-sm">touch_app</span>Next hand
                           </button>`
                        : "";
                const bell = team
                    ? `<button id="alertBellBtn" class="cb-iconbtn" title="${turnAlertsOn ? "Turn alerts on (also while the page is closed) — tap to disable" : "Turn alerts off — tap to enable"}" style="${turnAlertsOn ? "color:#f2ca4c;" : "opacity:.5;"}">
                           <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' ${turnAlertsOn ? 1 : 0};">${turnAlertsOn ? "notifications_active" : "notifications_off"}</span>
                       </button>`
                    : "";
                const menu = `
                    <div class="cb-menuwrap">
                        <button id="cbMenuBtn" class="cb-plainbtn" title="Menu">
                            <span class="material-symbols-outlined">menu</span>
                        </button>
                        <div id="cbMenu" class="cb-menu" style="display:none;">
                            <button id="historyBtn"><span class="material-symbols-outlined text-base">history</span>Past boards</button>
                            ${team && state.matchDone ? `<button id="newMatchBtn"><span class="material-symbols-outlined text-base">restart_alt</span>Start next match</button>` : ""}
                            ${!team ? `<button id="abandonBtn"><span class="material-symbols-outlined text-base">casino</span>New board</button>` : ""}
                            <button id="leaveBtn"><span class="material-symbols-outlined text-base">logout</span>${team ? "Leave table" : "Leave board"}</button>
                        </div>
                    </div>`;
                return `
                    <div class="cb-topbar">
                        <button id="backBtn" class="cb-plainbtn" title="Back to lobby">
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <div class="cb-title">
                            <div class="t">Hand ${no}</div>
                            <div class="s">${sub}</div>
                        </div>
                        ${arrows}${jump}${bell}${menu}
                    </div>`;
            }

            function handFooterHtml() {
                if (state.noBoard || !state.hand || state.done) return "";
                return `
                    <div class="cb-handfoot">
                        <div class="cb-handlabel">${SEAT_NAMES[state.humanSeat]} ${hcpOf(state.hand)} HCP</div>
                        ${cardFan(state.hand, false)}
                    </div>`;
            }

            function tableView() {
                const team = state.mode === "team";
                let mid;
                if (team && state.noBoard) {
                    mid = busy ? dealingHtml() : teamReadyHtml();
                } else if (state.done) {
                    // End of hand: score, the bidding, and the four hands
                    mid =
                        resultHtml() +
                        auctionHtml(
                            state.dealer,
                            state.vuln,
                            state.calls,
                            null,
                            state.humanSeat,
                        ) +
                        allHandsHtml();
                } else {
                    const parts = [
                        auctionHtml(
                            state.dealer,
                            state.vuln,
                            state.calls,
                            state.nextSeat,
                            state.humanSeat,
                            state.alerts,
                        ),
                        alertBoxHtml(),
                    ];
                    if (
                        busy ||
                        !state.yourTurn ||
                        (state.yourTurn && !state.legal)
                    ) {
                        parts.push(waitingHtml());
                    } else {
                        parts.push(bidAreaHtml());
                    }
                    mid = parts.join("");
                }
                return `
                    <div class="flex-1 min-h-0 flex flex-col">
                        ${topBarHtml()}
                        <div class="cb-mid ${state.done ? "" : "cb-mid-bid"}">${mid}</div>
                        ${handFooterHtml()}
                    </div>`;
            }

            function statsBarHtml() {
                if (!stats || !stats.boards) return "";
                return `
                    <div class="flex flex-wrap items-center gap-2 mb-4">
                        <span class="cb-pill"><span class="material-symbols-outlined text-base text-[#f2ca4c]">military_tech</span>Avg <b class="font-headline text-sm ${impsColor(stats.avgImps)}">${signed(stats.avgImps.toFixed(2))}</b> IMPs/board vs par</span>
                        <span class="cb-pill"><span class="material-symbols-outlined text-base text-[#43b78d]">style</span><b class="font-headline text-sm">${stats.boards}</b> boards</span>
                        <span class="cb-pill"><span class="material-symbols-outlined text-base text-[#7ea2e8]">trending_up</span>Total <b class="font-headline text-sm ${impsColor(stats.impsTotal)}">${signed(stats.impsTotal)}</b> IMPs</span>
                    </div>`;
            }

            function soloCardHtml() {
                return `
                    <div class="cb-cardpanel p-5 flex flex-col">
                        <span class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-b from-[#5b8def] to-[#2a5193] shadow-[0_3px_0_rgba(0,0,0,0.25)]">
                            <span class="material-symbols-outlined text-2xl text-white" style="font-variation-settings:'FILL' 1;">smart_toy</span>
                        </span>
                        <div class="font-headline font-extrabold text-white mt-3 text-lg">Solo vs 3 bots</div>
                        <p class="text-sm text-[#9aa7b8] mt-1.5 flex-1 leading-relaxed">
                            You sit South; a bidding-dt bot fills every other seat. Each board is scored in IMPs against double-dummy par.
                        </p>
                        <button id="dealBtn" class="cb-btn-green mt-4 justify-center !px-5 !py-3 !text-sm">
                            <span class="material-symbols-outlined text-sm">casino</span>Deal a board
                        </button>
                    </div>`;
            }

            function teamCardHtml() {
                return `
                    <div class="cb-cardpanel p-5 flex flex-col">
                        <span class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-b from-[#43b78d] to-[#1c5535] shadow-[0_3px_0_rgba(0,0,0,0.25)]">
                            <span class="material-symbols-outlined text-2xl text-white" style="font-variation-settings:'FILL' 1;">group</span>
                        </span>
                        <div class="font-headline font-extrabold text-white mt-3 text-lg">
                            Partner table
                            <span class="ml-1 px-1.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase tracking-wider bg-gold/90 text-on-gold align-middle">2 players vs 2 bots</span>
                        </div>
                        <p class="text-sm text-[#9aa7b8] mt-1.5 flex-1 leading-relaxed">
                            Team up with a partner (North–South) against the East/West bots. Each match is 8 boards dealt all at once — bid them in any order, switching between boards as the auctions unfold. Tables stay open while you are disconnected.
                        </p>
                        <div class="mt-4 flex flex-col gap-2">
                            <input id="partnerName" list="partnerList" placeholder="Partner username" autocomplete="off" class="cb-input" />
                            <datalist id="partnerList"></datalist>
                            <button id="createTableBtn" class="cb-btn-green justify-center !px-5 !py-3 !text-sm">
                                <span class="material-symbols-outlined text-sm">add</span>Create a table
                            </button>
                        </div>
                    </div>`;
            }

            function teamGamesHtml() {
                if (!games || games.length === 0) return "";
                const rows = games
                    .map((g) => {
                        const other = g.yourSeat === 2 ? g.partner : g.host;
                        const label = other
                            ? escapeHtml(other)
                            : "no partner yet";
                        let status, cls;
                        if (g.inProgress && g.yourTurn) {
                            status = "your turn";
                            cls = "bg-gradient-to-b from-[#37b26a] to-[#1e7d47] text-white";
                        } else if (g.inProgress) {
                            status = g.boards
                                ? "match in progress"
                                : "in progress";
                            cls = "bg-white/10 text-[#9aa7b8]";
                        } else {
                            status = g.boards
                                ? "match complete"
                                : "ready to start";
                            cls = "bg-gold/20 text-[#e5c558]";
                        }
                        return `
                        <div class="cb-cardpanel flex items-center gap-3 px-3 py-2.5">
                            <span class="flex items-center justify-center w-9 h-9 rounded-full bg-gradient-to-b from-[#43b78d] to-[#1c5535] shrink-0">
                                <span class="material-symbols-outlined text-lg text-white" style="font-variation-settings:'FILL' 1;">group</span>
                            </span>
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-label font-semibold text-white truncate">You &amp; ${label}</div>
                                <div class="text-[11px] text-[#8fa0b5] font-label">${g.boards} board${g.boards === 1 ? "" : "s"} · ${timeAgo(g.updated)}</div>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider whitespace-nowrap ${cls}">${status}</span>
                            <button data-open-game="${g.id}" class="cb-btn-green !px-4 !py-2 !text-xs">Resume</button>
                            <button data-del-game="${g.id}" title="Delete table" class="shrink-0 flex items-center justify-center w-8 h-8 rounded-full text-[#8fa0b5] hover:bg-[#e2543f]/20 hover:text-[#f08a8a] transition-colors">
                                <span class="material-symbols-outlined text-base">delete</span>
                            </button>
                        </div>`;
                    })
                    .join("");
                return `
                    <div class="mt-6">
                        <div class="text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label mb-2">Your tables</div>
                        <div class="space-y-2">${rows}</div>
                    </div>`;
            }

            function recentHtml() {
                if (!stats || !stats.recent || stats.recent.length === 0)
                    return "";
                const rows = stats.recent
                    .slice(0, 12)
                    .map(
                        (rec) => `
                        <tr class="border-t border-white/5">
                            <td class="px-3 py-1.5 text-xs text-[#8fa0b5] whitespace-nowrap">${timeAgo(rec.ts)}</td>
                            <td class="px-3 py-1.5 text-xs text-[#8fa0b5] whitespace-nowrap">${SEAT_NAMES[rec.dealer][0]} · ${VULN_NAMES[rec.vuln]}</td>
                            <td class="px-3 py-1.5 text-sm font-headline font-semibold text-white">${contractHtml(rec.contract)}</td>
                            <td class="px-3 py-1.5 text-xs text-[#8fa0b5] whitespace-nowrap">${rec.tricks === null || rec.tricks === undefined ? "—" : rec.tricks + " tricks"} · par ${scoreText(rec.parNs)}</td>
                            <td class="px-3 py-1.5 text-sm font-headline font-bold text-right ${impsColor(rec.imps)}">${signed(rec.imps)}</td>
                        </tr>`,
                    )
                    .join("");
                return `
                    <div class="mt-8">
                        <div class="flex items-center justify-between mb-2">
                            <div class="text-[10px] uppercase tracking-[0.2em] text-[#8fa0b5] font-label font-bold flex items-center gap-1.5">
                                <span class="material-symbols-outlined text-sm text-[#f2ca4c]">history</span>Recent solo boards
                            </div>
                            <button id="historyBtn" class="flex items-center gap-1 text-xs font-label font-semibold text-[#6ee7a0] hover:text-[#8fd694]">
                                <span class="material-symbols-outlined text-sm">style</span>Review cards &amp; auctions
                            </button>
                        </div>
                        <div class="cb-cardpanel overflow-x-auto">
                            <table class="w-full border-collapse min-w-[520px]">
                                <thead><tr>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">When</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">Deal</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">Contract</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">Result</th>
                                    <th class="px-3 py-1.5 text-right text-[10px] uppercase tracking-widest text-[#8fa0b5] font-label">IMPs</th>
                                </tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>`;
            }

            function lobbyHtml() {
                return `
                    ${statsBarHtml()}
                    <div class="grid gap-3 sm:grid-cols-2">
                        ${soloCardHtml()}
                        ${teamCardHtml()}
                    </div>
                    ${teamGamesHtml()}
                    ${recentHtml()}`;
            }

            function loginCardHtml() {
                return `
                    <div class="cb-cardpanel pop-in py-12 px-6 text-center">
                        <div class="card-fan-deco">
                            <span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span>
                        </div>
                        <p class="text-white text-xl font-headline font-extrabold mt-2">Log in to play</p>
                        <p class="text-sm text-[#9aa7b8] mt-2 max-w-sm mx-auto leading-relaxed">Solo history and persistent partner tables are kept for your account. Climb the IMP ladder.</p>
                        <button id="loginBtn" class="cb-btn-green mt-6 !px-7 !py-3 !text-sm">
                            <span class="material-symbols-outlined text-sm">login</span>
                            Log in
                        </button>
                    </div>`;
            }

            function historyItemFromSolo(rec, idx) {
                return {
                    no: null,
                    ts: rec.ts,
                    dealer: rec.dealer,
                    vuln: rec.vuln,
                    calls: rec.calls || [],
                    contract: rec.contract,
                    tricks: rec.tricks,
                    parNs: rec.parNs,
                    scoreNs: rec.scoreNs,
                    imps: rec.imps,
                    hands: rec.hands || null,
                };
            }

            function historyItemFromTeam(b) {
                const r = b.result;
                return {
                    no: b.no,
                    ts: null,
                    dealer: b.dealer,
                    vuln: b.vuln,
                    calls: b.calls || [],
                    contract:
                        r && r.contract ? contractString(r.contract) : "passed out",
                    tricks: r ? r.tricks : null,
                    parNs: r ? r.parNs : 0,
                    scoreNs: r ? r.scoreNs : 0,
                    imps: r ? r.imps : 0,
                    hands: b.hands || null,
                };
            }

            async function openHistory() {
                overlay = { items: null, detail: null, loading: true, error: false };
                renderOverlay();
                if (state && state.mode === "team") {
                    try {
                        const res = await fetch(
                            `/api/play/team/${state.id}/history`,
                        );
                        if (res.ok) {
                            const data = await res.json();
                            overlay.items = (data.boards || [])
                                .filter((b) => b.result)
                                .map(historyItemFromTeam)
                                .reverse();
                        } else {
                            overlay.error = true;
                        }
                    } catch (e) {
                        overlay.error = true;
                    }
                } else {
                    overlay.items = (stats && stats.recent
                        ? stats.recent
                        : []
                    ).map(historyItemFromSolo);
                }
                overlay.loading = false;
                renderOverlay();
            }

            function closeHistory() {
                overlay = null;
                renderOverlay();
            }

            function historyRowHtml(item, i) {
                const label = item.no
                    ? "Board " + item.no
                    : timeAgo(item.ts) || "Board";
                const resultTxt =
                    item.tricks === null || item.tricks === undefined
                        ? ""
                        : ` · ${item.tricks} tricks`;
                return `
                    <button data-hist-item="${i}" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left hover:brightness-125 transition-all" style="background:#202836;">
                        <span class="text-xs text-[#8fa0b5] font-label w-20 shrink-0">${label}</span>
                        <span class="text-sm font-headline font-semibold text-white min-w-0 truncate">${contractHtml(item.contract)}</span>
                        <span class="text-xs text-[#8fa0b5] font-label hidden sm:inline">${VULN_NAMES[item.vuln]}${resultTxt}</span>
                        <span class="ml-auto text-xs text-[#8fa0b5] font-label">par ${scoreText(item.parNs)}</span>
                        <span class="text-sm font-headline font-bold ${impsColor(item.imps)} w-10 text-right">${signed(item.imps)}</span>
                    </button>`;
            }

            function historyDetailHtml(item) {
                const youSeat = state ? state.humanSeat : 2;
                const hands = item.hands
                    ? `<div class="mt-3">${handsDiagramHtml(item.hands, youSeat)}</div>`
                    : `<p class="text-xs text-[#8fa0b5] mt-3 italic">Cards were not recorded for this board.</p>`;
                return `
                    <div class="flex items-center gap-2 mb-3">
                        <button id="histBackBtn" class="cb-btn-ghost">
                            <span class="material-symbols-outlined text-sm">arrow_back</span>All boards
                        </button>
                        <div class="font-headline font-bold text-white min-w-0 truncate">${contractHtml(item.contract)}</div>
                        ${item.no ? `<span class="text-xs text-[#8fa0b5] font-label">· board ${item.no}</span>` : ""}
                    </div>
                    <div class="text-xs text-[#8fa0b5] font-label">
                        ${SEAT_NAMES[item.dealer]} dealt · ${VULN_NAMES[item.vuln]} vuln
                        ${item.tricks === null || item.tricks === undefined ? "" : ` · ${item.tricks} DD tricks`}
                        · par ${scoreText(item.parNs)} · your score ${scoreText(item.scoreNs)}
                        · <b class="${impsColor(item.imps)}">${signed(item.imps)} IMPs</b>
                    </div>
                    <div class="mt-3">${auctionHtml(item.dealer, item.vuln, item.calls, null, youSeat)}</div>
                    ${hands}`;
            }

            function historyListHtml() {
                let body;
                if (overlay.loading) {
                    body = `<div class="flex items-center gap-2 py-6 justify-center">${spinner("Loading boards…")}</div>`;
                } else if (overlay.error) {
                    body = `<p class="text-sm text-[#9aa7b8] italic py-6 text-center">Could not load the boards just now.</p>`;
                } else if (!overlay.items || overlay.items.length === 0) {
                    body = `<p class="text-sm text-[#9aa7b8] italic py-6 text-center">No completed boards yet.</p>`;
                } else {
                    body = `<div class="space-y-1.5">${overlay.items.map(historyRowHtml).join("")}</div>`;
                }
                return `
                    <div class="flex items-center justify-between mb-3">
                        <div class="font-headline font-bold text-white">Board history</div>
                        <button id="histCloseBtn" class="material-symbols-outlined text-[#9aa7b8] hover:text-white">close</button>
                    </div>
                    ${body}`;
            }

            function renderOverlay() {
                let el = document.getElementById("histOverlay");
                if (!overlay) {
                    if (el) el.remove();
                    return;
                }
                if (!el) {
                    el = document.createElement("div");
                    el.id = "histOverlay";
                    document.body.appendChild(el);
                }
                el.className = "history-overlay";
                el.innerHTML = `<div class="history-card">${
                    overlay.detail === null
                        ? historyListHtml()
                        : historyDetailHtml(overlay.detail)
                }</div>`;
                alignHandDiagram(el);
                el.onclick = (e) => {
                    if (e.target === el) closeHistory();
                };
                const close = el.querySelector("#histCloseBtn");
                if (close) close.onclick = closeHistory;
                const back = el.querySelector("#histBackBtn");
                if (back)
                    back.onclick = () => {
                        overlay.detail = null;
                        renderOverlay();
                    };
                el.querySelectorAll("[data-hist-item]").forEach((btn) => {
                    btn.onclick = () => {
                        overlay.detail = overlay.items[parseInt(btn.dataset.histItem, 10)];
                        renderOverlay();
                    };
                });
            }

            function closeMenu() {
                const m = document.getElementById("cbMenu");
                if (m) m.style.display = "none";
            }

            function render() {
                const content = document.getElementById("main-content");
                if (!content) return;
                const header = content.previousElementSibling;
                if (header && header.tagName === "HEADER") {
                    header.style.display = state ? "none" : "";
                }
                const appHeader = document.querySelector("#app > header");
                if (appHeader) appHeader.style.display = state ? "none" : "";
                const sidebar = document.getElementById("sidebar");
                if (sidebar) sidebar.style.display = state ? "none" : "";
                const shell = document.querySelector(".app-shell");
                if (shell) shell.style.paddingTop = state ? "0" : "";
                const wrap = content.parentElement;
                const main = content.closest("main");
                if (main) main.style.overflowY = state ? "hidden" : "";
                if (wrap) {
                    wrap.style.height = state ? "100%" : "";
                    wrap.style.display = state ? "flex" : "";
                    wrap.style.flexDirection = state ? "column" : "";
                    wrap.style.padding = state ? "0" : "";
                }
                content.className = state ? "flex-1 min-h-0 flex flex-col" : "";

                if (!window.currentUser) {
                    content.innerHTML = loginCardHtml();
                    const lb = document.getElementById("loginBtn");
                    if (lb) lb.onclick = () => showAuthDialog("login");
                    renderOverlay();
                    return;
                }
                const prevInput = document.getElementById("partnerName");
                const keepPartner =
                    prevInput && state === null
                        ? {
                              value: prevInput.value,
                              focused: document.activeElement === prevInput,
                              sel: [
                                  prevInput.selectionStart,
                                  prevInput.selectionEnd,
                              ],
                          }
                        : null;
                // Keep following the auction's latest call across re-renders,
                // unless the player scrolled up to review earlier calls
                const prevAuc = document.querySelector(
                    ".cb-mid-bid .cb-auc-body",
                );
                const followAuc =
                    !prevAuc ||
                    prevAuc.scrollHeight -
                        prevAuc.scrollTop -
                        prevAuc.clientHeight <
                        24;
                content.innerHTML = state ? tableView() : lobbyHtml();

                const deal = document.getElementById("dealBtn");
                if (deal) deal.onclick = () => newBoard();
                const create = document.getElementById("createTableBtn");
                if (create) create.onclick = () => teamCreate();
                const partnerInput = document.getElementById("partnerName");
                if (partnerInput) {
                    if (keepPartner) {
                        partnerInput.value = keepPartner.value;
                        if (keepPartner.focused) {
                            partnerInput.focus();
                            try {
                                partnerInput.setSelectionRange(
                                    keepPartner.sel[0],
                                    keepPartner.sel[1],
                                );
                            } catch (e) {}
                        }
                    }
                    partnerInput.onkeydown = (e) => {
                        if (e.key === "Enter") teamCreate();
                    };
                }
                const partnerList = document.getElementById("partnerList");
                if (partnerList)
                    partnerList.innerHTML = allUsers
                        .filter((u) => u !== window.currentUser)
                        .map((u) => `<option value="${escapeHtml(u)}"></option>`)
                        .join("");
                content.querySelectorAll("[data-open-game]").forEach((btn) => {
                    btn.onclick = () => teamOpen(btn.dataset.openGame);
                });
                content.querySelectorAll("[data-del-game]").forEach((btn) => {
                    btn.onclick = () => teamDelete(btn.dataset.delGame);
                });

                const back = document.getElementById("backBtn");
                if (back) back.onclick = () => leaveTable();
                const prev = document.getElementById("prevHandBtn");
                if (prev)
                    prev.onclick = () => teamSelectBoard(state.boardSel - 1);
                const nxt = document.getElementById("nextHandBtn");
                if (nxt)
                    nxt.onclick = () => teamSelectBoard(state.boardSel + 1);
                const jump = document.getElementById("jumpHandBtn");
                if (jump)
                    jump.onclick = () => {
                        const t = nextTeamBoardTarget();
                        if (t !== null) teamSelectBoard(t);
                    };
                const bell = document.getElementById("alertBellBtn");
                if (bell) bell.onclick = toggleTurnAlerts;
                const mbtn = document.getElementById("cbMenuBtn");
                if (mbtn)
                    mbtn.onclick = (e) => {
                        e.stopPropagation();
                        const m = document.getElementById("cbMenu");
                        m.style.display =
                            m.style.display === "none" ? "block" : "none";
                    };
                const newMatch = document.getElementById("newMatchBtn");
                if (newMatch)
                    newMatch.onclick = () => {
