<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Atheneum | Digital Workspace</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Work+Sans:wght@300;400;500&amp;family=Inter:wght@400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script src="/static/shared.js"></script>
        <link rel="stylesheet" href="/static/shared.css" />
    </head>
    <body
        class="bg-background text-on-surface font-body selection:bg-tertiary-container/30 overflow-hidden"
    >
        <div id="app"></div>

        <script>
            document.getElementById("app").innerHTML = renderLayout({
                mode: "view",
                badge: "Tree View",
                title: "Loading...",
                titleId: "treeId",
                subtitle: "Read-only view of the knowledge tree structure.",
            });
            document.getElementById("treeId").innerText =
                window.location.pathname.split("/").pop();
            document.getElementById("editLink").href =
                "/edit/" + window.location.pathname.split("/").pop();

            const id = window.location.pathname.split("/").pop();

            let treeData = { roots: [] };

            async function loadTree() {
                const res = await fetch("/api/tree/" + id);
                if (!res.ok) {
                    console.error("Failed to fetch tree data:", res.statusText);
                    return;
                }
                treeData = await res.json();
                // Migration: if it's an old file with .root instead of .roots
                if (treeData.root && !treeData.roots) {
                    treeData.roots = [treeData.root];
                }
                if (treeData.roots && treeData.roots.length > 0) {
                    document.getElementById("treeId").innerText =
                        treeData.roots[0].name || id;
                }
                renderTree();
            }

            function renderTree() {
                const container = document.getElementById("main-content");
                container.innerHTML = "";
                if (treeData.roots && treeData.roots.length > 0) {
                    treeData.roots.forEach((root) => {
                        renderNode(root, container, 0);
                    });
                }
            }

            function renderNode(node, container, depth) {
                const hasChildren = node.children && node.children.length > 0;

                const coloredName = node.name
                    .replace(/♣/g, '<span style="color:green;">♣</span>')
                    .replace(/♦/g, '<span style="color:red;">♦</span>')
                    .replace(/♥/g, '<span style="color:red;">♥</span>')
                    .replace(/♠/g, '<span style="color:green;">♠</span>');

                const coloredDescription = node.description
                    .replace(/♣/g, '<span style="color:green;">♣</span>')
                    .replace(/♦/g, '<span style="color:red;">♦</span>')
                    .replace(/♥/g, '<span style="color:red;">♥</span>')
                    .replace(/♠/g, '<span style="color:green;">♠</span>');

                const isRoot = depth === 0;

                const nodeWrapper = document.createElement("div");
                nodeWrapper.className = isRoot
                    ? "relative group mt-6 pt-4 border-t border-outline-variant/10 first:mt-0 first:border-t-0 first:pt-0"
                    : "relative";

                // Tree connector lines
                if (!isRoot) {
                    const lineH = document.createElement("div");
                    lineH.className =
                        "absolute -left-5 top-1/2 w-5 h-[1px] bg-outline-variant/20";
                    nodeWrapper.appendChild(lineH);
                }

                const flexRow = document.createElement("div");
                flexRow.className = "flex items-center gap-2";

                // Toggle button
                const toggleIcon = document.createElement("span");
                toggleIcon.className = `material-symbols-outlined ${
                    hasChildren ? "text-primary" : "text-outline-variant"
                } ${isRoot ? "text-lg" : "text-base"} cursor-pointer select-none`;
                toggleIcon.innerHTML = "chevron_right";

                const contentDiv = document.createElement("div");
                contentDiv.className = "flex items-center gap-2 flex-wrap";

                // Name
                const nameEl = document.createElement("h3");
                nameEl.className = `font-headline font-bold text-on-surface ${
                    depth === 0
                        ? "text-lg"
                        : depth === 1
                          ? "text-sm font-semibold"
                          : "text-sm"
                }`;
                nameEl.innerHTML = coloredName;

                // Description inline with name
                const descEl = document.createElement("span");
                descEl.className = "text-on-surface-variant text-sm";
                descEl.innerHTML = coloredDescription;

                contentDiv.appendChild(nameEl);
                if (coloredDescription) {
                    contentDiv.appendChild(descEl);
                }

                flexRow.appendChild(toggleIcon);
                flexRow.appendChild(contentDiv);

                nodeWrapper.appendChild(flexRow);

                // Children container
                if (hasChildren) {
                    const childrenWrapper = document.createElement("div");
                    childrenWrapper.className = `relative`;
                    if (isRoot) {
                        childrenWrapper.className +=
                            " ml-5 border-l border-outline-variant/20 pl-5 space-y-4 relative mt-4";
                    } else {
                        childrenWrapper.className +=
                            " ml-5 border-l border-outline-variant/20 pl-5 space-y-4 relative mt-4";
                    }

                    node.children.forEach((child) =>
                        renderNode(child, childrenWrapper, depth + 1),
                    );

                    // Initially hidden
                    childrenWrapper.style.display = "none";

                    toggleIcon.onclick = (e) => {
                        const isHidden =
                            childrenWrapper.style.display === "none";
                        childrenWrapper.style.display = isHidden
                            ? "block"
                            : "none";
                        toggleIcon.innerHTML = isHidden
                            ? "expand_more"
                            : "chevron_right";
                    };

                    nodeWrapper.appendChild(childrenWrapper);
                }

                container.appendChild(nodeWrapper);
            }

            loadTree();
        </script>
    </body>
</html>
