<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Atheneum | Play vs Bots</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Work+Sans:wght@300;400;500&amp;family=Inter:wght@400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script src="/static/shared.js"></script>
        <link rel="stylesheet" href="/static/shared.css" />
    </head>
    <body
        class="bg-background text-on-surface font-body selection:bg-tertiary-container/30 overflow-hidden"
    >
        <div id="app"></div>

        <script>
            document.getElementById("app").innerHTML = renderLayout({
                mode: "play",
                badge: "Play",
                title: "Play vs Bots",
                subtitle:
                    "Deal a solo board against three bidding-dt bots, or open a persistent partner table for two humans (North–South) against the East/West bots: an 8-board match dealt up front and bid in parallel. Every board is scored in IMPs versus double-dummy par.",
            });

            const SEAT_NAMES = ["North", "East", "South", "West"];
            const VULN_NAMES = ["None", "N-S", "E-W", "Both"];
            const SUIT_SYMBOL = { S: "♠", H: "♥", D: "♦", C: "♣", N: "NT" };
            const SUIT_ORDER = ["C", "D", "H", "S", "N"]; // ascending bid rank
            const AUCTION_COLS = [3, 0, 1, 2]; // W N E S: South rightmost
            const BOARD_KEY = "atheneum_play_board";
            const TEAM_KEY = "atheneum_play_team";

            let state = null; // active table: a solo board or a team game view
            let stats = null; // solo career stats { boards, impsTotal, avgImps, recent }
            let games = null; // team tables this user is part of
            let allUsers = []; // account names, for the partner autocomplete
            let busy = false; // a request is in flight (bots thinking)
            let autoRetries = 0; // failed auto-recovery attempts in a row
            let bidLevelSel = null; // bidding-box selection, kept across renders
            let bidStrainSel = null;
            let pollTimer = null; // pending background refresh
            let overlay = null; // board-history overlay state

            // ---- formatting helpers ----

            function callLabel(c) {
                if (c === "P") return "Pass";
                if (c === "X") return "Dbl";
                if (c === "XX") return "Rdbl";
                if (c.length === 2) return c[0] + SUIT_SYMBOL[c[1]];
                return c;
            }

            function callHtml(c) {
                return colorSuits(callLabel(c));
            }

            // "4S by W" / "1HX by E" / "passed out" -> suit-symbolized html
            function contractHtml(text) {
                const t = String(text || "").replace(
                    /([1-7])([CDHSN])/g,
                    (m, l, d) => l + (d === "N" ? "NT" : SUIT_SYMBOL[d]),
                );
                return colorSuits(t);
            }

            // contract object from the sidecar -> "4SX by N"
            function contractString(c) {
                if (!c) return "passed out";
                const pen = ["", "X", "XX"][c.penalty] || "";
                const decl = "NESW"[c.declarer] || "?";
                return `${c.level}${c.denom}${pen} by ${decl}`;
            }

            function seatIsVul(seat, vuln) {
                const ns = seat % 2 === 0;
                return (
                    vuln === 3 || (vuln === 1 && ns) || (vuln === 2 && !ns)
                );
            }

            function signed(n, digits) {
                const v = Number(n);
                const s = digits === undefined ? String(v) : v.toFixed(digits);
                return v > 0 ? "+" + s : s;
            }

            function scoreText(n) {
                return n > 0 ? "+" + n : String(n);
            }

            // A hand rendered as little playing cards per suit.
            function handHtml(handStr, small) {
                const parts = String(handStr || "").split("."); // S,H,D,C
                const suits = [
                    ["S", "♠", "blk"],
                    ["H", "♥", "red"],
                    ["D", "♦", "red"],
                    ["C", "♣", "blk"],
                ];
                return suits
                    .map(([ch, sym, col], i) => {
                        const cards = (parts[i] || "").split("");
                        const tiles = cards.length
                            ? cards
                                  .map((c) => {
                                      const ten =
                                          c === "T"
                                              ? "font-size:9px;letter-spacing:-0.08em;"
                                              : "";
                                      return `<span class="pcard ${col}${small ? " pcard-sm" : ""}"><span class="r" style="${ten}">${c === "T" ? "10" : escapeHtml(c)}</span><span class="s">${sym}</span></span>`;
                                  })
                                  .join("")
                            : `<span class="text-outline-variant text-xs font-label px-1">—</span>`;
                        const suitColor =
                            col === "red"
                                ? "color:#c0392b;"
                                : "color:#17252a;";
                        return `<div class="flex items-center gap-1.5 min-w-0">
                            <span class="w-4 shrink-0 ${small ? "text-xs" : "text-base"} leading-none" style="${suitColor}">${sym}</span>
                            <span class="flex flex-wrap gap-[2px]">${tiles}</span>
                        </div>`;
                    })
                    .join("");
            }

            function hiddenHandHtml() {
                let cards = "";
                for (let i = 0; i < 13; i++)
                    cards += `<span class="card-back"></span>`;
                return `<div class="card-fan mt-1 overflow-hidden">${cards}</div>`;
            }

            function impsColor(imps) {
                if (imps > 0) return "text-green-700";
                if (imps < 0) return "text-error";
                return "text-on-surface-variant";
            }

            function timeAgo(ts) {
                const d = new Date(ts);
                if (isNaN(d)) return "";
                const mins = Math.floor((Date.now() - d.getTime()) / 60000);
                if (mins < 1) return "just now";
                if (mins < 60) return mins + "m ago";
                const hrs = Math.floor(mins / 60);
                if (hrs < 24) return hrs + "h ago";
                return Math.floor(hrs / 24) + "d ago";
            }

            // ---- server calls ----

            async function handleResponse(res) {
                if (res.status === 401) {
                    busy = false;
                    render();
                    showAuthDialog("login");
                    return;
                }
                let data = null;
                try {
                    data = await res.json();
                } catch (e) {}
                if (!res.ok) {
                    busy = false;
                    autoRetries++;
                    if (res.status === 404) {
                        if (state) {
                            localStorage.removeItem(
                                state.mode === "team" ? TEAM_KEY : BOARD_KEY,
                            );
                            state = null;
                        }
                        refreshLobby();
                    }
                    showToast((data && data.error) || "Request failed", true);
                    render();
                    return;
                }
                if (data.mode === "team") {
                    // The team table polls continuously (other boards can
                    // move without this one changing); skip the re-render
                    // when the whole state is identical so a bid in progress
                    // is never disturbed.
                    const changed =
                        !state ||
                        state.mode !== "team" ||
                        state.id !== data.id ||
                        JSON.stringify(state) !== JSON.stringify(data);
                    state = data;
                    localStorage.setItem(TEAM_KEY, data.id);
                    localStorage.removeItem(BOARD_KEY);
                    busy = false;
                    autoRetries = 0;
                    if (changed) render();
                    else schedulePoll();
                    return;
                }
                data.mode = "solo";
                state = data;
                localStorage.setItem(BOARD_KEY, data.id);
                localStorage.removeItem(TEAM_KEY);
                if (data.stats) stats = data.stats;
                busy = false;
                autoRetries = 0;
                render();
            }

            async function post(path, body) {
                busy = true;
                render();
                try {
                    const res = await fetch(path, {
                        method: "POST",
                        headers: body
                            ? { "Content-Type": "application/json" }
                            : {},
                        body: body ? JSON.stringify(body) : undefined,
                    });
                    await handleResponse(res);
                } catch (e) {
                    busy = false;
                    showToast("Network error", true);
                    render();
                }
            }

            async function newBoard() {
                if (!window.currentUser) {
                    showAuthDialog("login");
                    return;
                }
                if (busy) return;
                await post("/api/play/new");
            }

            async function makeCall(call) {
                if (!state || busy || state.done || !state.yourTurn) return;
                if (state.mode === "team") {
                    await post(`/api/play/team/${state.id}/call`, {
                        call: call,
                        board: state.boardSel,
                    });
                } else {
                    await post(`/api/play/${state.id}/call`, { call: call });
                }
            }

            async function refreshBoard(force) {
                if (!state || busy) return;
                if (
                    !force &&
                    !state.done &&
                    state.yourTurn &&
                    state.mode !== "team"
                )
                    return;
                if (!force && state.mode === "solo" && state.done) return;
                // Team tables poll continuously; while the selected board is
                // waiting for this player, fetch quietly instead of flashing
                // a spinner over the bidding box.
                const quiet =
                    state.mode === "team" && state.yourTurn && !state.done;
                busy = true;
                if (!quiet) render();
                try {
                    const path =
                        state.mode === "team"
                            ? `/api/play/team/${state.id}` +
                              (state.boardSel
                                  ? `?board=${state.boardSel}`
                                  : "")
                            : `/api/play/${state.id}`;
                    const res = await fetch(path);
                    await handleResponse(res);
                } catch (e) {
                    busy = false;
                    render();
                }
            }

            // POST /start: deal a fresh 8-board match (table ready screen or
            // after a match completes)
            async function teamStart() {
                if (!state || state.mode !== "team" || busy) return;
                await post(`/api/play/team/${state.id}/start`);
            }

            // Switch the table view to another board of the match. The
            // current board stays on screen while loading (no busy render).
            async function teamSelectBoard(no) {
                if (!state || state.mode !== "team" || busy) return;
                if (no === state.boardSel) return;
                busy = true;
                try {
                    const res = await fetch(
                        `/api/play/team/${state.id}?board=${no}`,
                    );
                    await handleResponse(res);
                } catch (e) {
                    busy = false;
                    showToast("Network error", true);
                    schedulePoll();
                }
            }

            async function teamCreate() {
                if (!window.currentUser) {
                    showAuthDialog("login");
                    return;
                }
                if (busy) return;
                const input = document.getElementById("partnerName");
                const partner = ((input && input.value) || "")
                    .trim()
                    .toLowerCase();
                if (!partner) {
                    showToast("Enter your partner's username", true);
                    return;
                }
                await post("/api/play/team/new", { partner: partner });
            }

            async function teamOpen(id) {
                if (busy) return;
                busy = true;
                render();
                try {
                    const res = await fetch(
                        "/api/play/team/" + encodeURIComponent(id),
                    );
                    await handleResponse(res);
                } catch (e) {
                    busy = false;
                    render();
                }
            }

            async function teamNext() {
                if (!state || state.mode !== "team" || busy) return;
                await post(`/api/play/team/${state.id}/next`);
            }

            function leaveTable() {
                if (state && state.mode === "team") {
                    localStorage.removeItem(TEAM_KEY);
                } else {
                    localStorage.removeItem(BOARD_KEY);
                }
                state = null;
                refreshLobby();
            }

            async function teamDelete(id) {
                if (
                    !confirm(
                        "Delete this table for good? Both players lose its history.",
                    )
                )
                    return;
                try {
                    const res = await fetch(
                        "/api/play/team/" + encodeURIComponent(id),
                        { method: "DELETE" },
                    );
                    if (res.ok) {
                        showToast("Table deleted");
                        refreshLobby();
                    } else {
                        showToast("Could not delete table", true);
                    }
                } catch (e) {
                    showToast("Network error", true);
                }
            }

            async function loadGames() {
                try {
                    const res = await fetch("/api/play/team/list");
                    if (res.ok) games = (await res.json()).games || [];
                } catch (e) {}
            }

            async function loadUsers() {
                try {
                    const res = await fetch("/api/users");
                    if (res.ok) allUsers = (await res.json()).users || [];
                } catch (e) {}
            }

            async function refreshLobby() {
                // Never re-render the lobby out from under someone typing a
                // partner name: the poll fires on a timer armed before they
                // started typing, so re-check at fire time as well.
                const input = document.getElementById("partnerName");
                if (input && (input.value || document.activeElement === input)) {
                    clearTimeout(pollTimer);
                    pollTimer = setTimeout(refreshLobby, 5000);
                    return;
                }
                await loadGames();
                render();
            }

            async function loadInitial() {
                try {
                    const res = await fetch("/api/play/stats");
                    if (res.ok) stats = await res.json();
                } catch (e) {}
                await loadGames();
                await loadUsers();

                const tid = localStorage.getItem(TEAM_KEY);
                if (tid) {
                    try {
                        const res = await fetch(
                            "/api/play/team/" + encodeURIComponent(tid),
                        );
                        if (res.ok) {
                            state = await res.json();
                            state.mode = "team";
                            // A team table in progress outranks any stale
                            // solo board left in storage.
                            localStorage.removeItem(BOARD_KEY);
                            busy = false;
                            render();
                            return;
                        }
                        localStorage.removeItem(TEAM_KEY);
                    } catch (e) {}
                }
                const bid = localStorage.getItem(BOARD_KEY);
                if (bid) {
                    try {
                        const res = await fetch(
                            "/api/play/" + encodeURIComponent(bid),
                        );
                        if (res.ok) {
                            state = await res.json();
                            state.mode = "solo";
                            if (state.stats) stats = state.stats;
                            busy = false;
                            render();
                            return;
                        }
                        localStorage.removeItem(BOARD_KEY);
                    } catch (e) {}
                }
                render();
            }

            // ---- rendering ----

            // Contract for one seat ("You", seat name, partner, bot).
            function seatSub(seat) {
                if (state.humanSeat === seat) return "you";
                const named = state.seatNames
                    ? state.seatNames[String(seat)]
                    : "";
                if (named)
                    return escapeHtml(named) + " · your partner";
                const model = state.bots ? state.bots[String(seat)] : "";
                return "bot" + (model ? " · " + escapeHtml(model) : "");
            }

            function seatBox(seat) {
                const isHuman = state.humanSeat === seat;
                const named = state.seatNames
                    ? state.seatNames[String(seat)]
                    : "";
                const active = !state.done && state.nextSeat === seat;
                const dealer = state.dealer === seat;
                const vulChip = seatIsVul(seat, state.vuln)
                    ? `<span class="px-1.5 py-px rounded-full text-[9px] font-extrabold uppercase tracking-wider bg-[#b03226] text-white">vul</span>`
                    : "";
                const dealerChip = dealer
                    ? `<span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-gradient-to-b from-gold-light to-gold text-on-gold text-[9px] font-extrabold border border-black/25" title="Dealer">D</span>`
                    : "";
                const coinCls = isHuman
                    ? "avatar-you"
                    : named
                      ? "avatar-partner"
                      : "avatar-bot";
                const coinInitial = isHuman
                    ? window.currentUser || "?"
                    : (named || "?");
                const coinInner = isHuman || named
                    ? escapeHtml(coinInitial[0].toUpperCase())
                    : `<span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1;">smart_toy</span>`;
                let status = "";
                if (active) {
                    const label = isHuman
                        ? "your turn"
                        : named
                          ? "partner to act"
                          : "bot thinking…";
                    status = `<span class="flex items-center gap-1 text-[10px] ${isHuman ? "text-[#1e7d47] font-label font-bold" : "text-on-surface-variant font-label"}">${busy && !isHuman ? '<span class="material-symbols-outlined text-xs animate-spin">progress_activity</span>' : ""}${label}</span>`;
                }
                let hand;
                if (state.done && state.hands) {
                    hand = `<div class="mt-1 space-y-0">${handHtml(state.hands[seat], true)}</div>`;
                } else if (isHuman) {
                    hand = `<div class="mt-1 text-[10px] font-label text-on-surface-variant">your cards below</div>`;
                } else {
                    hand = hiddenHandHtml();
                }
                return `
                    <div class="player-plate ${active ? "seat-active" : ""} px-2.5 py-1.5 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="avatar-coin ${coinCls}">${coinInner}</span>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <span class="font-headline font-extrabold text-xs sm:text-sm text-on-surface truncate">${SEAT_NAMES[seat]}</span>
                                    ${vulChip}${dealerChip}
                                </div>
                                <div class="text-[10px] text-on-surface-variant font-label truncate">${seatSub(seat)}</div>
                            </div>
                        </div>
                        <div class="min-h-[14px] mt-0.5">${status}</div>
                        ${hand}
                    </div>`;
            }

            function auctionTableHtml(dealer, vuln, calls) {
                const list = calls || [];
                const rows = [];
                let row = null;
                let prevPos = -1;
                for (let i = 0; i < list.length; i++) {
                    const pos = AUCTION_COLS.indexOf((dealer + i) % 4);
                    if (!row || pos <= prevPos) {
                        row = [null, null, null, null];
                        rows.push(row);
                    }
                    row[pos] = list[i];
                    prevPos = pos;
                }
                const head = AUCTION_COLS.map((s) => {
                    const vul = seatIsVul(s, vuln);
                    const chip = vul
                        ? "bg-red-600 text-white"
                        : "bg-white text-neutral-800";
                    const atDealer =
                        s === dealer
                            ? "ring-2 ring-primary ring-offset-1 ring-offset-transparent"
                            : "";
                    return `<th class="px-0.5 sm:px-2 py-1 text-center">
                        <span class="inline-flex items-center justify-center w-5 h-5 rounded text-[10px] uppercase font-label font-bold border border-outline-variant/30 ${chip} ${atDealer}">${SEAT_NAMES[s][0]}</span>
                    </th>`;
                }).join("");
                const body = rows
                    .map(
                        (r) =>
                            `<tr class="border-t border-outline-variant/10">` +
                            r
                                .map(
                                    (c, i) =>
                                        `<td class="px-0.5 sm:px-2 py-0.5 text-center text-[11px] sm:text-sm font-headline font-semibold text-on-surface ${seatIsVul(AUCTION_COLS[i], vuln) ? "bg-red-600/5" : ""}">${c ? callHtml(c) : ""}</td>`,
                                )
                                .join("") +
                            `</tr>`,
                    )
                    .join("");
                return `
                    <table class="w-full border-collapse">
                        <thead><tr>${head}</tr></thead>
                        <tbody>${body || `<tr><td colspan="4" class="py-1.5 text-center text-[11px] text-outline-variant">no calls yet</td></tr>`}</tbody>
                    </table>`;
            }

            function auctionCardHtml() {
                return `
                    <div class="bg-[#f1f2ec] border border-black/10 rounded-xl shadow-sm px-1.5 sm:px-3 py-1.5 w-full">
                        <div class="flex items-center justify-center gap-1.5 text-[9px] uppercase tracking-[0.18em] text-[#8a6d1d] font-label mb-0.5 text-center truncate">
                            <span class="material-symbols-outlined text-[11px]">gavel</span>
                            Auction · dealer ${SEAT_NAMES[state.dealer][0]} · vuln ${VULN_NAMES[state.vuln]}
                        </div>
                        ${auctionTableHtml(state.dealer, state.vuln, state.calls)}
                    </div>`;
            }

            // Compact bidding pad styled like a real bridge bidding box:
            // card-like level/strain tiles, green Pass, red Double, blue
            // Redouble. Rebuilt in place on selection.
            function bidBoxInnerHtml() {
                const legal = new Set(state.legal || []);
                const levels = [];
                for (let l = 1; l <= 7; l++)
                    if (SUIT_ORDER.some((d) => legal.has(l + d))) levels.push(l);
                if (!levels.includes(bidLevelSel))
                    bidLevelSel = levels.length ? levels[0] : null;
                const strains = SUIT_ORDER.filter((d) =>
                    legal.has(bidLevelSel + d),
                );
                if (!strains.includes(bidStrainSel))
                    bidStrainSel = strains.length ? strains[0] : null;
                const token =
                    bidLevelSel !== null && bidStrainSel
                        ? bidLevelSel + bidStrainSel
                        : "";
                const canBid = token && legal.has(token) && !busy;

                const levelBtn = (l) =>
                    `<button data-level="${l}" ${busy ? "disabled" : ""} class="bid-tile ${l === bidLevelSel ? "selected" : ""}">${l}</button>`;
                const strainBtn = (d) => {
                    const ok = legal.has(bidLevelSel + d);
                    return `<button data-strain="${d}" ${ok && !busy ? "" : "disabled"} class="bid-tile ${ok && d === bidStrainSel ? "selected" : ""}">${colorSuits(SUIT_SYMBOL[d])}</button>`;
                };
                const special = (t, label, cls) => {
                    const ok = legal.has(t) && !busy;
                    return `<button data-call="${t}" ${ok ? "" : "disabled"} class="bid-tile ${cls}" style="height:2.6rem;font-family:Inter,sans-serif;font-size:12px;font-weight:800;letter-spacing:0.02em;">${label}</button>`;
                };
                const bidLabel = canBid
                    ? "Bid " +
                      colorSuits(bidLevelSel + SUIT_SYMBOL[bidStrainSel])
                    : "Bid";
                return `
                    <div class="w-full max-w-lg mx-auto">
                        <div class="flex items-baseline justify-between mb-1.5">
                            <span class="text-[10px] uppercase tracking-[0.2em] text-outline font-label font-bold">Your call</span>
                            <span class="text-[11px] font-label text-on-surface-variant">${
                                token
                                    ? "selected " +
                                      colorSuits(
                                          bidLevelSel +
                                              SUIT_SYMBOL[bidStrainSel],
                                      ) +
                                      " — press Bid"
                                    : "pick a level and a strain"
                            }</span>
                        </div>
                        <div class="grid grid-cols-7 gap-1.5 mb-1.5">
                            ${levels.map(levelBtn).join("")}
                        </div>
                        <div class="grid grid-cols-6 gap-1.5 mb-2">
                            ${SUIT_ORDER.map(strainBtn).join("")}
                            <button id="bidBtn" ${canBid ? "" : "disabled"} class="bid-tile btn-gold" style="font-family:Inter,sans-serif;font-size:12px;font-weight:800;">${bidLabel}</button>
                        </div>
                        <div class="grid grid-cols-3 gap-1.5">
                            ${special("P", "Pass", "btn-pass")}
                            ${special("X", "Double", "btn-dbl")}
                            ${special("XX", "Redouble", "btn-rdbl")}
                        </div>
                    </div>`;
            }

            function biddingBoxHtml() {
                return `
                    <span id="bidBox" class="block">${bidBoxInnerHtml()}</span>`;
            }

            function wireBidBox(root) {
                const box = root.getElementById("bidBox");
                if (!box) return;
                box.querySelectorAll("[data-level]").forEach((btn) => {
                    btn.onclick = () => {
                        bidLevelSel = parseInt(btn.dataset.level, 10);
                        refreshBidBox();
                    };
                });
                box.querySelectorAll("[data-strain]").forEach((btn) => {
                    btn.onclick = () => {
                        bidStrainSel = btn.dataset.strain;
                        refreshBidBox();
                    };
                });
                box.querySelectorAll("[data-call]").forEach((btn) => {
                    btn.onclick = () => makeCall(btn.dataset.call);
                });
                const bidBtn = box.querySelector("#bidBtn");
                if (bidBtn)
                    bidBtn.onclick = () =>
                        makeCall(bidLevelSel + bidStrainSel);
            }

            function refreshBidBox() {
                const box = document.getElementById("bidBox");
                if (!box || !state) return;
                box.innerHTML = bidBoxInnerHtml();
                wireBidBox(document);
            }

            function handStripHtml() {
                if (!state || state.done || !state.hand) return "";
                return `
                    <div class="px-3 py-2">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[10px] uppercase tracking-[0.2em] text-outline font-label font-bold">Your hand</span>
                            <span class="text-[10px] text-on-surface-variant font-label">${SEAT_NAMES[state.humanSeat]} · ${VULN_NAMES[state.vuln]} vuln</span>
                        </div>
                        <div class="grid grid-cols-1 gap-y-1">
                            ${handHtml(state.hand, false)}
                        </div>
                    </div>`;
            }

            function resultHtml() {
                const r = state.result;
                let contractLine, trickLine;
                if (r.contract) {
                    const c = r.contract;
                    const side =
                        c.declarer % 2 === (state.humanSeat % 2)
                            ? "your side"
                            : "the bots";
                    const pen = ["", " doubled", " redoubled"][c.penalty] || "";
                    const need = c.level + 6;
                    const margin = r.tricks - need;
                    const made = margin >= 0;
                    contractLine = `${c.level}${SUIT_SYMBOL[c.denom]}${pen ? '<span class="text-[#b03226] font-bold">' + escapeHtml(pen) + "</span>" : ""} by ${SEAT_NAMES[c.declarer]} (${side})`;
                    trickLine = `${r.tricks} double-dummy tricks — ${made ? "made " + (margin > 0 ? "+" + margin : "exactly") : margin + " down"}`;
                } else {
                    contractLine = "Passed out";
                    trickLine = "no contract was reached";
                }
                const st = state.stats || {};
                const won = r.imps > 0;
                const lost = r.imps < 0;
                const trophyCls = won
                    ? "bg-[#37b26a]/15 text-[#1e7d47]"
                    : lost
                      ? "bg-[#e2543f]/15 text-[#b03226]"
                      : "bg-surface-container text-on-surface-variant";
                const trophyIcon = won
                    ? "emoji_events"
                    : lost
                      ? "trending_down"
                      : "balance";
                return `
                    <div class="game-panel pop-in ${won ? "result-glow-pos" : lost ? "result-glow-neg" : ""} px-3 sm:px-4 py-2.5 flex flex-wrap items-center gap-x-6 gap-y-2">
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="flex items-center justify-center w-11 h-11 rounded-2xl ${trophyCls} shrink-0">
                                <span class="material-symbols-outlined text-2xl">${trophyIcon}</span>
                            </span>
                            <div class="min-w-0">
                                <div class="font-headline font-extrabold text-base text-on-surface">${contractLine}</div>
                                <div class="text-xs text-on-surface-variant mt-0.5">${trickLine}</div>
                                <div class="text-[11px] text-on-surface-variant mt-0.5 font-label">
                                    Par (N-S) <span class="font-semibold">${scoreText(r.parNs)}</span>
                                    · Your score (N-S) <span class="font-semibold">${scoreText(r.scoreNs)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-center px-4 py-1 rounded-2xl bg-surface-container-low">
                            <div class="text-[9px] uppercase tracking-[0.2em] text-outline font-label font-bold">IMPs vs par</div>
                            <div class="victory-imps text-3xl font-headline font-extrabold leading-tight ${impsColor(r.imps)}">${signed(r.imps)}</div>
                        </div>
                        <div class="text-center">
                            <div class="text-[9px] uppercase tracking-widest text-outline font-label">Average</div>
                            <div class="text-lg font-headline font-extrabold leading-tight ${impsColor(st.avgImps)}">${st.avgImps === undefined ? "—" : signed(st.avgImps.toFixed(2))}</div>
                            <div class="text-[10px] text-on-surface-variant font-label">${st.boards || 0} boards</div>
                        </div>
                        <button id="nextBoardBtn" class="btn-gold ml-auto shrink-0 flex items-center gap-2 px-5 py-2.5 rounded-xl font-label text-sm font-bold">
                            <span class="material-symbols-outlined text-sm">${state.mode === "team" && state.matchDone ? "restart_alt" : "casino"}</span>
                            ${state.mode === "team" && state.matchDone ? "Start next match" : "Next board"}
                        </button>
                    </div>`;
            }

            function spinner(msg) {
                return `
                    <span class="material-symbols-outlined text-primary animate-spin">progress_activity</span>
                    <span class="text-sm text-on-surface-variant font-label">${msg}</span>`;
            }

            function waitingHtml() {
                const team = state.mode === "team";
                const partnerSeat =
                    team && state.seatNames
                        ? state.seatNames[String(state.nextSeat)]
                        : "";
                let inner;
                if (busy) {
                    inner = spinner(
                        team ? "Updating the table…" : "The bots are bidding…",
                    );
                } else if (partnerSeat) {
                    inner = spinner(escapeHtml(partnerSeat) + " is thinking…");
                } else if (state.yourTurn) {
                    inner = `<span class="material-symbols-outlined text-outline">wifi_off</span>
                             <span class="text-sm text-on-surface-variant font-label">Could not load your options.</span>
                             <button id="retryBtn" class="ml-auto flex items-center gap-1 px-3 py-1.5 bg-surface-container text-on-surface rounded font-label text-xs hover:bg-surface-container-high transition-colors">
                                 <span class="material-symbols-outlined text-sm">refresh</span>
                                 Retry
                             </button>`;
                } else {
                    inner = spinner("Waiting for the bots to bid…");
                }
                // On a table, other boards of the match may already be
                // waiting for this player while the selected one is quiet.
                const otherYours =
                    team &&
                    !state.done &&
                    (state.boards || []).find(
                        (b) => !b.done && b.yourTurn && b.no !== state.boardSel,
                    );
                if (otherYours) {
                    inner += `<button data-board="${otherYours.no}" class="ml-auto shrink-0 flex items-center gap-1 px-3 py-1.5 btn-gold rounded-xl font-label text-xs font-bold">
                        <span class="material-symbols-outlined text-sm">touch_app</span>Board ${otherYours.no} awaits your call
                    </button>`;
                }
                return `
                    <div class="px-3 py-2.5 flex items-center gap-3 flex-wrap">
                        ${inner}
                    </div>`;
            }

            // Chips for every board of the current match: click to switch.
            // Done boards carry their IMPs; boards waiting for this player
            // pulse green so parallel bidding is discoverable. A little XP
            // bar tracks match progress.
            function boardStripHtml() {
                if (state.mode !== "team" || !state.boards) return "";
                const list = state.boards;
                if (!list.length) return "";
                const chips = list
                    .map((b) => {
                        let cls = "";
                        let right = "";
                        if (b.done) {
                            right = `<span class="font-extrabold ${impsColor(b.imps)}">${signed(b.imps)}</span>`;
                        } else if (b.yourTurn) {
                            cls = "chip-your-turn";
                            right = `<span class="material-symbols-outlined text-[13px] leading-none" style="font-variation-settings:'FILL' 1;">touch_app</span>`;
                        }
                        const sel = b.no === state.boardSel ? "chip-selected" : "";
                        const title = b.done
                            ? `Board ${b.no} · ${b.contract || "passed out"} · ${signed(b.imps)} IMPs`
                            : `Board ${b.no} · dealer ${SEAT_NAMES[b.dealer][0]} · vuln ${VULN_NAMES[b.vuln]}` +
                              (b.yourTurn ? " · your turn" : "");
                        return `<button data-board="${b.no}" title="${title}" class="board-chip ${cls} ${sel}">
                            <span>${b.no}</span>${right}
                        </button>`;
                    })
                    .join("");
                const done = list.filter((b) => b.done).length;
                const pct = Math.round((done / list.length) * 100);
                const waiting = list.filter((b) => !b.done && b.yourTurn)
                    .length;
                return `
                    <div class="flex items-center gap-1.5 flex-wrap shrink-0 min-w-0">
                        ${chips}
                        ${waiting > 0 ? `<span class="text-[10px] text-[#1e7d47] font-label font-bold ml-1 whitespace-nowrap">${waiting} board${waiting === 1 ? "" : "s"} to bid</span>` : ""}
                    </div>
                    <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto">
                        <div class="xp-bar flex-1 min-w-[80px] max-w-[240px]"><div class="xp-bar-fill" style="width:${pct}%"></div></div>
                        <span class="text-[10px] font-label font-semibold text-on-surface-variant whitespace-nowrap">${done}/${list.length} boards</span>
                    </div>`;
            }

            // The next board to jump to from a finished one: prefer a board
            // waiting for this player, else the next unfinished board.
            function nextTeamBoardTarget() {
                const list = state.boards || [];
                if (!list.length) return null;
                const idx = Math.max(
                    list.findIndex((b) => b.no === state.boardSel),
                    0,
                );
                for (let pass = 0; pass < 2; pass++) {
                    for (let k = 1; k <= list.length; k++) {
                        const b = list[(idx + k) % list.length];
                        if (b.done) continue;
                        if (pass === 0 && !b.yourTurn) continue;
                        return b.no;
                    }
                }
                return null;
            }

            function playHeaderHtml() {
                const team = state.mode === "team";
                let left, right;
                if (team) {
                    const partner =
                        state.yourSeat === 2 ? state.partner : state.host;
                    const list = state.boards || [];
                    const done = list.filter((b) => b.done).length;
                    left = state.noBoard
                        ? `Table · you &amp; ${escapeHtml(partner)} vs E/W bots · waiting to start`
                        : `Table · you &amp; ${escapeHtml(partner)} vs E/W bots · match ${done}/${list.length} boards · <span class="${impsColor(state.matchImps)}">${signed(state.matchImps || 0)} IMPs</span>`;
                    right = `
                        <button id="historyBtn" class="flex items-center gap-1 px-3.5 py-1.5 bg-white text-on-surface-variant rounded-full border border-black/10 font-label text-xs font-semibold hover:text-on-surface hover:border-black/20 shadow-[0_1px_2px_rgba(0,0,0,0.08)] transition-all">
                            <span class="material-symbols-outlined text-sm">history</span>Past boards
                        </button>
                        <button id="leaveBtn" title="Leave the table (it stays open)" class="shrink-0 flex items-center gap-1 px-3.5 py-1.5 bg-white text-on-surface-variant rounded-full border border-black/10 font-label text-xs font-semibold hover:text-[#b03226] hover:border-[#b03226]/30 shadow-[0_1px_2px_rgba(0,0,0,0.08)] transition-all">
                            <span class="material-symbols-outlined text-sm">logout</span>Leave
                        </button>`;
                } else {
                    left = `Board ${stats ? stats.boards + (state.done ? 0 : 1) : 1} · you sit South, North is your partner`;
                    right = `
                        <button id="historyBtn" class="flex items-center gap-1 px-3.5 py-1.5 bg-white text-on-surface-variant rounded-full border border-black/10 font-label text-xs font-semibold hover:text-on-surface hover:border-black/20 shadow-[0_1px_2px_rgba(0,0,0,0.08)] transition-all">
                            <span class="material-symbols-outlined text-sm">history</span>Past boards
                        </button>
                        <button id="leaveBtn" title="Leave this board (not scored)" class="shrink-0 flex items-center gap-1 px-3.5 py-1.5 bg-white text-on-surface-variant rounded-full border border-black/10 font-label text-xs font-semibold hover:text-[#b03226] hover:border-[#b03226]/30 shadow-[0_1px_2px_rgba(0,0,0,0.08)] transition-all">
                            <span class="material-symbols-outlined text-sm">logout</span>Leave
                        </button>
                        <button id="abandonBtn" title="Abandon this board and deal a new solo board" class="shrink-0 flex items-center gap-1 px-3.5 py-1.5 btn-gold rounded-full font-label text-xs font-bold">
                            <span class="material-symbols-outlined text-sm">restart_alt</span>New board
                        </button>`;
                }
                return `
                    <div class="flex items-center justify-between gap-2 shrink-0">
                        <div class="text-xs text-on-surface-variant font-label truncate">${left}</div>
                        <div class="flex items-center gap-1.5 shrink-0">${right}</div>
                    </div>`;
            }

            function teamReadyHtml() {
                return `
                    <div class="game-panel pop-in max-w-sm mx-auto mt-6 px-6 py-8 text-center border-2 border-dashed border-[#2b7a4b]/40">
                        <span class="flex items-center justify-center w-16 h-16 mx-auto rounded-full bg-gradient-to-b from-gold-light to-gold shadow-[0_3px_0_rgba(0,0,0,0.3)]">
                            <span class="material-symbols-outlined text-3xl text-on-gold" style="font-variation-settings:'FILL' 1;">playing_cards</span>
                        </span>
                        <p class="font-headline font-extrabold text-xl text-on-surface mt-3">Table ready</p>
                        <p class="text-xs text-on-surface-variant font-label mt-1.5 leading-relaxed">You &amp; ${escapeHtml(state.partner)} vs the East/West bots. An 8-board match is dealt all at once — every board runs its own auction, and you bid them in any order, switching freely between them.</p>
                        <button id="dealFirstBtn" class="btn-gold mt-5 inline-flex items-center gap-2 px-6 py-3 rounded-xl font-label text-sm font-bold">
                            <span class="material-symbols-outlined text-sm">casino</span>Start 8-board match
                        </button>
                    </div>`;
            }

            function dealingHtml() {
                return `
                    <div class="game-panel pop-in max-w-sm mx-auto mt-6 px-6 py-10 flex flex-col items-center gap-3">
                        <div class="card-fan-deco">
                            <span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span>
                        </div>
                        ${spinner("Dealing the 8 boards and letting the bots open…")}
                    </div>`;
            }

            // One unified play surface: seats + auction in a scrollable
            // table area, hand + bidding panel in a dock at the bottom —
            // all inside a single card. On phones the bidding panel comes
            // first so it is always visible.
            function tableView() {
                const team = state.mode === "team";
                let panel;
                if (team && state.noBoard) {
                    panel = "";
                } else if (state.done) {
                    panel = resultHtml();
                } else if (
                    busy ||
                    !state.yourTurn ||
                    (state.yourTurn && !state.legal)
                ) {
                    panel = waitingHtml();
                } else {
                    panel = biddingBoxHtml();
                }
                const tableBody =
                    team && state.noBoard
                        ? busy
                            ? dealingHtml()
                            : teamReadyHtml()
                        : `
                            <div class="grid grid-cols-3 gap-1.5 sm:gap-3 items-center max-w-3xl m-auto w-full py-1.5">
                                <div class="col-span-3 sm:hidden">${auctionCardHtml()}</div>
                                <div></div>
                                ${seatBox(0)}
                                <div></div>
                                ${seatBox(3)}
                                <div class="flex items-center justify-center"><div class="hidden sm:block w-full">${auctionCardHtml()}</div></div>
                                ${seatBox(1)}
                                <div></div>
                                ${seatBox(2)}
                                <div></div>
                            </div>`;
                const strip = state.noBoard ? "" : handStripHtml();
                const dock = state.noBoard
                    ? ""
                    : `<div class="bottom-dock shrink-0 border-t border-black/10 bg-[#f6f7f2] flex flex-col sm:flex-row gap-2 sm:gap-3 px-2 sm:px-3 py-2">
                           <div class="order-2 sm:order-1 flex-1 min-w-0">${strip}</div>
                           <div class="order-1 sm:order-2 flex-1 min-w-0">${panel}</div>
                       </div>`;
                return `
                    <div class="flex-1 min-h-0 flex flex-col gap-1.5">
                        ${playHeaderHtml()}
                        ${boardStripHtml()}
                        <div class="game-panel flex-1 min-h-0 flex flex-col overflow-hidden rounded-2xl">
                            <div id="tableBox" class="flex-1 min-h-0 flex flex-col overflow-y-auto">
                                ${tableBody}
                            </div>
                            ${dock}
                        </div>
                    </div>`;
            }

            function statsBarHtml() {
                if (!stats || !stats.boards) return "";
                return `
                    <div class="flex flex-wrap items-center gap-2 mb-4">
                        <span class="stat-pill"><span class="material-symbols-outlined text-base text-[#d4a017]">military_tech</span>Avg <b class="font-headline text-sm ${impsColor(stats.avgImps)}">${signed(stats.avgImps.toFixed(2))}</b> IMPs/board vs par</span>
                        <span class="stat-pill"><span class="material-symbols-outlined text-base text-[#2b7a4b]">style</span><b class="font-headline text-sm">${stats.boards}</b> boards</span>
                        <span class="stat-pill"><span class="material-symbols-outlined text-base text-[#2a5193]">trending_up</span>Total <b class="font-headline text-sm ${impsColor(stats.impsTotal)}">${signed(stats.impsTotal)}</b> IMPs</span>
                    </div>`;
            }

            function soloCardHtml() {
                return `
                    <div class="game-panel game-panel-hover p-5 flex flex-col">
                        <span class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-b from-[#5b8def] to-[#2a5193] shadow-[0_3px_0_rgba(0,0,0,0.25)]">
                            <span class="material-symbols-outlined text-2xl text-white" style="font-variation-settings:'FILL' 1;">smart_toy</span>
                        </span>
                        <div class="font-headline font-extrabold text-on-surface mt-3 text-lg">Solo vs 3 bots</div>
                        <p class="text-sm text-on-surface-variant mt-1.5 flex-1 leading-relaxed">
                            You sit South; a bidding-dt bot fills every other seat. Each board is scored in IMPs against double-dummy par.
                        </p>
                        <button id="dealBtn" class="btn-gold mt-4 inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl font-label text-sm font-bold">
                            <span class="material-symbols-outlined text-sm">casino</span>Deal a board
                        </button>
                    </div>`;
            }

            function teamCardHtml() {
                return `
                    <div class="game-panel game-panel-hover p-5 flex flex-col">
                        <span class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-b from-[#43b78d] to-[#1c5535] shadow-[0_3px_0_rgba(0,0,0,0.25)]">
                            <span class="material-symbols-outlined text-2xl text-white" style="font-variation-settings:'FILL' 1;">group</span>
                        </span>
                        <div class="font-headline font-extrabold text-on-surface mt-3 text-lg">
                            Partner table
                            <span class="ml-1 px-1.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase tracking-wider bg-gold/90 text-on-gold align-middle">2 players vs 2 bots</span>
                        </div>
                        <p class="text-sm text-on-surface-variant mt-1.5 flex-1 leading-relaxed">
                            Team up with a partner (North–South) against the East/West bots. Each match is 8 boards dealt all at once — bid them in any order, switching between boards as the auctions unfold. Tables stay open while you are disconnected.
                        </p>
                        <div class="mt-4 flex flex-col gap-2">
                            <input id="partnerName" list="partnerList" placeholder="Partner username" autocomplete="off" class="unlock-input !py-2.5 text-sm" />
                            <datalist id="partnerList"></datalist>
                            <button id="createTableBtn" class="btn-gold inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl font-label text-sm font-bold">
                                <span class="material-symbols-outlined text-sm">add</span>Create a table
                            </button>
                        </div>
                    </div>`;
            }

            function teamGamesHtml() {
                if (!games || games.length === 0) return "";
                const rows = games
                    .map((g) => {
                        const other = g.yourSeat === 2 ? g.partner : g.host;
                        const label = other
                            ? escapeHtml(other)
                            : "no partner yet";
                        let status, cls;
                        if (g.inProgress && g.yourTurn) {
                            status = "your turn";
                            cls = "bg-gradient-to-b from-[#37b26a] to-[#1e7d47] text-white";
                        } else if (g.inProgress) {
                            status = g.boards
                                ? "match in progress"
                                : "in progress";
                            cls = "bg-surface-container text-on-surface-variant";
                        } else {
                            status = g.boards
                                ? "match complete"
                                : "ready to start";
                            cls = "bg-gold/20 text-[#8a6d1d]";
                        }
                        return `
                        <div class="game-panel flex items-center gap-3 px-3 py-2.5">
                            <span class="flex items-center justify-center w-9 h-9 rounded-full bg-gradient-to-b from-[#43b78d] to-[#1c5535] shrink-0">
                                <span class="material-symbols-outlined text-lg text-white" style="font-variation-settings:'FILL' 1;">group</span>
                            </span>
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-label font-semibold text-on-surface truncate">You &amp; ${label}</div>
                                <div class="text-[11px] text-on-surface-variant font-label">${g.boards} board${g.boards === 1 ? "" : "s"} · ${timeAgo(g.updated)}</div>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider whitespace-nowrap ${cls}">${status}</span>
                            <button data-open-game="${g.id}" class="btn-gold shrink-0 px-4 py-2 rounded-xl font-label text-xs font-bold">Resume</button>
                            <button data-del-game="${g.id}" title="Delete table" class="shrink-0 flex items-center justify-center w-8 h-8 rounded-full text-on-surface-variant hover:bg-[#e2543f]/15 hover:text-[#b03226] transition-colors">
                                <span class="material-symbols-outlined text-base">delete</span>
                            </button>
                        </div>`;
                    })
                    .join("");
                return `
                    <div class="mt-6">
                        <div class="text-[10px] uppercase tracking-widest text-outline font-label mb-2">Your tables</div>
                        <div class="space-y-2">${rows}</div>
                    </div>`;
            }

            function recentHtml() {
                if (!stats || !stats.recent || stats.recent.length === 0)
                    return "";
                const rows = stats.recent
                    .slice(0, 12)
                    .map(
                        (rec) => `
                        <tr class="border-t border-outline-variant/10">
                            <td class="px-3 py-1.5 text-xs text-on-surface-variant whitespace-nowrap">${timeAgo(rec.ts)}</td>
                            <td class="px-3 py-1.5 text-xs text-on-surface-variant whitespace-nowrap">${SEAT_NAMES[rec.dealer][0]} · ${VULN_NAMES[rec.vuln]}</td>
                            <td class="px-3 py-1.5 text-sm font-headline font-semibold text-on-surface">${contractHtml(rec.contract)}</td>
                            <td class="px-3 py-1.5 text-xs text-on-surface-variant whitespace-nowrap">${rec.tricks === null || rec.tricks === undefined ? "—" : rec.tricks + " tricks"} · par ${scoreText(rec.parNs)}</td>
                            <td class="px-3 py-1.5 text-sm font-headline font-bold text-right ${impsColor(rec.imps)}">${signed(rec.imps)}</td>
                        </tr>`,
                    )
                    .join("");
                return `
                    <div class="mt-8">
                        <div class="flex items-center justify-between mb-2">
                            <div class="text-[10px] uppercase tracking-[0.2em] text-outline font-label font-bold flex items-center gap-1.5">
                                <span class="material-symbols-outlined text-sm text-[#d4a017]">history</span>Recent solo boards
                            </div>
                            <button id="historyBtn" class="flex items-center gap-1 text-xs font-label font-semibold text-[#2b7a4b] hover:text-[#1e7d47]">
                                <span class="material-symbols-outlined text-sm">style</span>Review cards &amp; auctions
                            </button>
                        </div>
                        <div class="game-panel overflow-x-auto">
                            <table class="w-full border-collapse min-w-[520px]">
                                <thead><tr>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-outline font-label">When</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-outline font-label">Deal</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-outline font-label">Contract</th>
                                    <th class="px-3 py-1.5 text-left text-[10px] uppercase tracking-widest text-outline font-label">Result</th>
                                    <th class="px-3 py-1.5 text-right text-[10px] uppercase tracking-widest text-outline font-label">IMPs</th>
                                </tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>`;
            }

            function lobbyHtml() {
                return `
                    ${statsBarHtml()}
                    <div class="grid gap-3 sm:grid-cols-2">
                        ${soloCardHtml()}
                        ${teamCardHtml()}
                    </div>
                    ${teamGamesHtml()}
                    ${recentHtml()}`;
            }

            function loginCardHtml() {
                return `
                    <div class="game-panel pop-in py-12 px-6 text-center">
                        <div class="card-fan-deco">
                            <span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span>
                        </div>
                        <p class="text-on-surface text-xl font-headline font-extrabold mt-2">Log in to play</p>
                        <p class="text-sm text-on-surface-variant mt-2 max-w-sm mx-auto leading-relaxed">Solo history and persistent partner tables are kept for your account. Climb the IMP ladder.</p>
                        <button id="loginBtn" class="btn-gold mt-6 inline-flex items-center gap-2 px-7 py-3 rounded-xl font-label text-sm font-bold">
                            <span class="material-symbols-outlined text-sm">login</span>
                            Log in
                        </button>
                    </div>`;
            }

            // ---- board history overlay ----

            function historyItemFromSolo(rec, idx) {
                return {
                    no: null,
                    ts: rec.ts,
                    dealer: rec.dealer,
                    vuln: rec.vuln,
                    calls: rec.calls || [],
                    contract: rec.contract,
                    tricks: rec.tricks,
                    parNs: rec.parNs,
                    scoreNs: rec.scoreNs,
                    imps: rec.imps,
                    hands: rec.hands || null,
                };
            }

            function historyItemFromTeam(b) {
                const r = b.result;
                return {
                    no: b.no,
                    ts: null,
                    dealer: b.dealer,
                    vuln: b.vuln,
                    calls: b.calls || [],
                    contract:
                        r && r.contract ? contractString(r.contract) : "passed out",
                    tricks: r ? r.tricks : null,
                    parNs: r ? r.parNs : 0,
                    scoreNs: r ? r.scoreNs : 0,
                    imps: r ? r.imps : 0,
                    hands: b.hands || null,
                };
            }

            async function openHistory() {
                overlay = { items: null, detail: null, loading: true, error: false };
                renderOverlay();
                if (state && state.mode === "team") {
                    try {
                        const res = await fetch(
                            `/api/play/team/${state.id}/history`,
                        );
                        if (res.ok) {
                            const data = await res.json();
                            overlay.items = (data.boards || [])
                                .filter((b) => b.result)
                                .map(historyItemFromTeam)
                                .reverse();
                        } else {
                            overlay.error = true;
                        }
                    } catch (e) {
                        overlay.error = true;
                    }
                } else {
                    overlay.items = (stats && stats.recent
                        ? stats.recent
                        : []
                    ).map(historyItemFromSolo);
                }
                overlay.loading = false;
                renderOverlay();
            }

            function closeHistory() {
                overlay = null;
                renderOverlay();
            }

            function historyRowHtml(item, i) {
                const label = item.no
                    ? "Board " + item.no
                    : timeAgo(item.ts) || "Board";
                const resultTxt =
                    item.tricks === null || item.tricks === undefined
                        ? ""
                        : ` · ${item.tricks} tricks`;
                return `
                    <button data-hist-item="${i}" class="w-full flex items-center gap-3 px-3 py-2 bg-surface-container-low rounded-lg text-left hover:bg-surface-container-high transition-colors">
                        <span class="text-xs text-on-surface-variant font-label w-20 shrink-0">${label}</span>
                        <span class="text-sm font-headline font-semibold text-on-surface min-w-0 truncate">${contractHtml(item.contract)}</span>
                        <span class="text-xs text-on-surface-variant font-label hidden sm:inline">${VULN_NAMES[item.vuln]}${resultTxt}</span>
                        <span class="ml-auto text-xs text-on-surface-variant font-label">par ${scoreText(item.parNs)}</span>
                        <span class="text-sm font-headline font-bold ${impsColor(item.imps)} w-10 text-right">${signed(item.imps)}</span>
                    </button>`;
            }

            function historyDetailHtml(item) {
                const contractLine = contractHtml(item.contract);
                const hands = item.hands
                    ? `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3">
                           ${[0, 1, 2, 3]
                               .map(
                                   (s) => `
                               <div class="bg-surface-container-low rounded-lg p-2">
                                   <div class="text-[10px] uppercase tracking-widest text-outline font-label mb-1">${SEAT_NAMES[s]}${state && state.humanSeat === s ? " · you" : ""}</div>
                                   <div class="space-y-0.5">${handHtml(item.hands[s], true)}</div>
                               </div>`,
                               )
                               .join("")}
                       </div>`
                    : `<p class="text-xs text-on-surface-variant mt-3 italic">Cards were not recorded for this board.</p>`;
                return `
                    <div class="flex items-center gap-2 mb-3">
                        <button id="histBackBtn" class="flex items-center gap-1 px-2 py-1 bg-surface-container text-on-surface-variant rounded font-label text-xs hover:bg-surface-container-high">
                            <span class="material-symbols-outlined text-sm">arrow_back</span>All boards
                        </button>
                        <div class="font-headline font-bold text-on-surface min-w-0 truncate">${contractLine}</div>
                        ${item.no ? `<span class="text-xs text-on-surface-variant font-label">· board ${item.no}</span>` : ""}
                    </div>
                    <div class="text-xs text-on-surface-variant font-label">
                        ${SEAT_NAMES[item.dealer]} dealt · ${VULN_NAMES[item.vuln]} vuln
                        ${item.tricks === null || item.tricks === undefined ? "" : ` · ${item.tricks} DD tricks`}
                        · par ${scoreText(item.parNs)} · your score ${scoreText(item.scoreNs)}
                        · <b class="${impsColor(item.imps)}">${signed(item.imps)} IMPs</b>
                    </div>
                    <div class="mt-3 bg-surface-container-lowest border border-outline-variant/10 rounded-lg p-2">
                        ${auctionTableHtml(item.dealer, item.vuln, item.calls)}
                    </div>
                    ${hands}`;
            }

            function historyListHtml() {
                let body;
                if (overlay.loading) {
                    body = `<div class="flex items-center gap-2 py-6 justify-center">${spinner("Loading boards…")}</div>`;
                } else if (overlay.error) {
                    body = `<p class="text-sm text-on-surface-variant italic py-6 text-center">Could not load the boards just now.</p>`;
                } else if (!overlay.items || overlay.items.length === 0) {
                    body = `<p class="text-sm text-on-surface-variant italic py-6 text-center">No completed boards yet.</p>`;
                } else {
                    body = `<div class="space-y-1.5">${overlay.items.map(historyRowHtml).join("")}</div>`;
                }
                return `
                    <div class="flex items-center justify-between mb-3">
                        <div class="font-headline font-bold text-on-surface">Board history</div>
                        <button id="histCloseBtn" class="material-symbols-outlined text-on-surface-variant hover:text-on-surface">close</button>
                    </div>
                    ${body}`;
            }

            function renderOverlay() {
                let el = document.getElementById("histOverlay");
                if (!overlay) {
                    if (el) el.remove();
                    return;
                }
                if (!el) {
                    el = document.createElement("div");
                    el.id = "histOverlay";
                    document.body.appendChild(el);
                }
                el.className = "history-overlay";
                el.innerHTML = `<div class="history-card">${
                    overlay.detail === null
                        ? historyListHtml()
                        : historyDetailHtml(overlay.detail)
                }</div>`;
                el.onclick = (e) => {
                    if (e.target === el) closeHistory();
                };
                const close = el.querySelector("#histCloseBtn");
                if (close) close.onclick = closeHistory;
                const back = el.querySelector("#histBackBtn");
                if (back)
                    back.onclick = () => {
                        overlay.detail = null;
                        renderOverlay();
                    };
                el.querySelectorAll("[data-hist-item]").forEach((btn) => {
                    btn.onclick = () => {
                        overlay.detail = overlay.items[parseInt(btn.dataset.histItem, 10)];
                        renderOverlay();
                    };
                });
            }

            // ---- main render ----

            function render() {
                const content = document.getElementById("main-content");
                if (!content) return;
                // While a table is open the page locks to the viewport: the
                // intro header and lobby step aside, the table area flexes and the
                // hand strip + bidder/result stay pinned below. Bidding,
                // reading the score and dealing the next board never need
                // page scrolling.
                const header = content.previousElementSibling;
                if (header && header.tagName === "HEADER") {
                    header.style.display = state ? "none" : "";
                }
                const wrap = content.parentElement;
                const main = content.closest("main");
                if (main) main.style.overflowY = state ? "hidden" : "";
                if (wrap) {
                    wrap.style.height = state ? "100%" : "";
                    wrap.style.display = state ? "flex" : "";
                    wrap.style.flexDirection = state ? "column" : "";
                    wrap.style.padding = state ? "0.75rem 1rem 0.75rem" : "";
                }
                content.className = state ? "flex-1 min-h-0 flex flex-col" : "";

                if (!window.currentUser) {
                    content.innerHTML = loginCardHtml();
                    const lb = document.getElementById("loginBtn");
                    if (lb) lb.onclick = () => showAuthDialog("login");
                    renderOverlay();
                    return;
                }
                // The lobby re-renders on polls and busy toggles; keep what
                // the user is typing in the partner box (value, caret and
                // focus) across the innerHTML swap.
                const prevInput = document.getElementById("partnerName");
                const keepPartner =
                    prevInput && state === null
                        ? {
                              value: prevInput.value,
                              focused: document.activeElement === prevInput,
                              sel: [
                                  prevInput.selectionStart,
                                  prevInput.selectionEnd,
                              ],
                          }
                        : null;
                content.innerHTML = state ? tableView() : lobbyHtml();

                // lobby buttons
                const deal = document.getElementById("dealBtn");
                if (deal) deal.onclick = () => newBoard();
                const create = document.getElementById("createTableBtn");
                if (create) create.onclick = () => teamCreate();
                const partnerInput = document.getElementById("partnerName");
                if (partnerInput) {
                    if (keepPartner) {
                        partnerInput.value = keepPartner.value;
                        if (keepPartner.focused) {
                            partnerInput.focus();
                            try {
                                partnerInput.setSelectionRange(
                                    keepPartner.sel[0],
                                    keepPartner.sel[1],
                                );
                            } catch (e) {}
                        }
                    }
                    partnerInput.onkeydown = (e) => {
                        if (e.key === "Enter") teamCreate();
                    };
                }
                const partnerList = document.getElementById("partnerList");
                if (partnerList)
                    partnerList.innerHTML = allUsers
                        .filter((u) => u !== window.currentUser)
                        .map((u) => `<option value="${escapeHtml(u)}"></option>`)
                        .join("");
                content.querySelectorAll("[data-open-game]").forEach((btn) => {
                    btn.onclick = () => teamOpen(btn.dataset.openGame);
                });
                content.querySelectorAll("[data-del-game]").forEach((btn) => {
                    btn.onclick = () => teamDelete(btn.dataset.delGame);
                });

                // table buttons
                const history = document.getElementById("historyBtn");
                if (history) history.onclick = openHistory;
                const leave = document.getElementById("leaveBtn");
                if (leave) leave.onclick = leaveTable;
                const first = document.getElementById("dealFirstBtn");
                if (first) first.onclick = teamStart;
                const abandon = document.getElementById("abandonBtn");
                if (abandon) abandon.onclick = () => newBoard();
                const next = document.getElementById("nextBoardBtn");
                if (next)
                    next.onclick = () => {
                        if (!state) return;
                        if (state.mode === "team") {
                            if (state.matchDone) {
                                teamStart();
                                return;
                            }
                            const target = nextTeamBoardTarget();
                            if (target) teamSelectBoard(target);
                        } else {
                            newBoard();
                        }
                    };
                content.querySelectorAll("[data-board]").forEach((btn) => {
                    btn.onclick = () =>
                        teamSelectBoard(parseInt(btn.dataset.board, 10));
                });
                content.querySelectorAll("[data-call]").forEach((btn) => {
                    btn.onclick = () => makeCall(btn.dataset.call);
                });
                wireBidBox(document);
                const retry = document.getElementById("retryBtn");
                if (retry) retry.onclick = () => refreshBoard(true);

                renderOverlay();
                schedulePoll();
            }

            function schedulePoll() {
                clearTimeout(pollTimer);
                pollTimer = null;
                if (!window.currentUser || busy) return;
                if (state && state.mode === "team") {
                    // Always poll the table: the partner may act on another
                    // board of the match while the selected one is quiet.
                    // handleResponse skips the re-render when nothing
                    // actually changed.
                    pollTimer = setTimeout(() => refreshBoard(true), 3000);
                    return;
                }
                if (state) {
                    // Solo: recover a board that stalled mid-bot-turn.
                    if (
                        !busy &&
                        !state.done &&
                        !state.yourTurn &&
                        autoRetries < 4
                    ) {
                        pollTimer = setTimeout(
                            refreshBoard,
                            1500 + autoRetries * 1500,
                        );
                    }
                    return;
                }
                // Lobby: keep the tables list fresh. refreshLobby re-checks
                // the partner-name input at fire time and skips the render
                // (re-arming) while it is being used, so arming here is
                // always safe.
                if (games !== null) pollTimer = setTimeout(refreshLobby, 5000);
            }

            document.addEventListener("authchange", () => {
                if (window.currentUser) {
                    loadInitial();
                } else {
                    state = null;
                    stats = null;
                    games = null;
                    render();
                }
            });

            document.addEventListener("visibilitychange", () => {
                if (!document.hidden && state && window.currentUser && !busy)
                    refreshBoard(true);
            });

            refreshAuthState();
        </script>
    </body>
</html>
