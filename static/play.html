                        closeMenu();
                        teamStart();
                    };
                const history = document.getElementById("historyBtn");
                if (history)
                    history.onclick = () => {
                        closeMenu();
                        openHistory();
                    };
                const leave = document.getElementById("leaveBtn");
                if (leave)
                    leave.onclick = () => {
                        closeMenu();
                        leaveTable();
                    };
                const abandon = document.getElementById("abandonBtn");
                if (abandon)
                    abandon.onclick = () => {
                        closeMenu();
                        newBoard();
                    };
                const next = document.getElementById("nextBoardBtn");
                if (next)
                    next.onclick = () => {
                        if (!state) return;
                        if (state.mode === "team") {
                            if (state.matchDone) {
                                teamStart();
                                return;
                            }
                            const target = nextTeamBoardTarget();
                            if (target) teamSelectBoard(target);
                        } else {
                            newBoard();
                        }
                    };
                content.querySelectorAll("[data-board]").forEach((btn) => {
                    btn.onclick = () =>
                        teamSelectBoard(parseInt(btn.dataset.board, 10));
                });
                wireBidArea(document);
                wireAlertChips(content);
                const retry = document.getElementById("retryBtn");
                if (retry) retry.onclick = () => refreshBoard(true);

                updateTitleAlert(state);
                alignHandDiagram(content);
                const aucBody = content.querySelector(
                    ".cb-mid-bid .cb-auc-body",
                );
                if (aucBody && followAuc)
                    aucBody.scrollTop = aucBody.scrollHeight;
                renderOverlay();
                schedulePoll();
            }

            function schedulePoll() {
                clearTimeout(pollTimer);
                pollTimer = null;
                if (!window.currentUser || busy) return;
                if (state && state.mode === "team") {
                    pollTimer = setTimeout(() => refreshBoard(true), 3000);
                    return;
                }
                if (state) {
                    if (
                        !busy &&
                        !state.done &&
                        !state.yourTurn &&
                        autoRetries < 4
                    ) {
                        pollTimer = setTimeout(
                            refreshBoard,
                            1500 + autoRetries * 1500,
                        );
                    }
                    return;
                }
                if (games !== null) pollTimer = setTimeout(refreshLobby, 5000);
            }

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".cb-menuwrap")) closeMenu();
            });

            document.addEventListener("authchange", () => {
                if (window.currentUser) {
                    loadInitial();
                    // bind this browser's push endpoint to the new account
                    if (
                        turnAlertsOn &&
                        typeof Notification !== "undefined" &&
                        Notification.permission === "granted"
                    )
                        pushEnable();
                } else {
                    state = null;
                    stats = null;
                    games = null;
                    render();
                }
            });

            document.addEventListener("visibilitychange", () => {
                if (!document.hidden && pendingTurnToast) {
                    showToast(pendingTurnToast);
                    pendingTurnToast = null;
                }
                if (!document.hidden && state && window.currentUser && !busy)
                    refreshBoard(true);
            });

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/sw.js").catch(() => {});
            }
            refreshAuthState();
        </script>
    </body>
</html>
