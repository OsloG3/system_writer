<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Atheneum | Edit System</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Work+Sans:wght@300;400;500&amp;family=Inter:wght@400;500;600&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script src="/static/shared.js"></script>
        <link rel="stylesheet" href="/static/shared.css" />
    </head>
    <body
        class="bg-background text-on-surface font-body selection:bg-tertiary-container/30 overflow-hidden"
    >
        <div id="app"></div>

        <script>
            document.getElementById("app").innerHTML = renderLayout({
                mode: "edit",
                badge: "Edit Mode",
                title: "Loading...",
                titleId: "treeNameDisplay",
                subtitle:
                    "Edit the bidding system structure. Drag nodes to reorder.",
            });
            document.getElementById("viewLink").href =
                "/view/" + window.location.pathname.split("/").pop();
            document.getElementById("practiceLink").href =
                "/practice/" + window.location.pathname.split("/").pop();

            const id = window.location.pathname.split("/").pop();

            let treeData = { roots: [] };
            let draggedNodeId = null;
            let dropPosition = null;
            let expandedNodes = new Set();
            let dirty = false;

            function markDirty() {
                dirty = true;
            }

            async function loadTree() {
                const res = await fetch("/api/tree/" + id);
                if (!res.ok) {
                    document.getElementById("main-content").innerHTML =
                        '<p class="text-on-surface-variant">System not found. <a class="text-primary" href="/">Back to collections</a></p>';
                    return;
                }
                treeData = await res.json();
                if (treeData.root && !treeData.roots) {
                    treeData.roots = [treeData.root];
                }
                treeData.roots = treeData.roots || [];
                if (!treeData.name) {
                    // migrate legacy files that used the first root as the name
                    treeData.name =
                        (treeData.roots[0] && treeData.roots[0].name) || "";
                }
                document.getElementById("treeNameDisplay").innerText =
                    treeData.name || "Untitled System";
                dirty = false;
                renderTree();
            }

            function addNewRoot() {
                treeData.roots.push({
                    id: "root-" + Math.random().toString(36).substr(2, 9),
                    name: "New Section",
                    description: "",
                    children: [],
                });
                markDirty();
                renderTree();
            }

            function renderNode(node, container, isTopLevel = false) {
                const hasChildren = node.children && node.children.length > 0;
                const isRoot = isTopLevel;

                const nodeWrapper = document.createElement("div");
                nodeWrapper.className = isRoot
                    ? "relative group mt-6 pt-4 border-t border-outline-variant/10 first:mt-0 first:border-t-0 first:pt-0"
                    : "relative";
                nodeWrapper.dataset.id = node.id;

                // Tree connector lines
                if (!isRoot) {
                    const lineH = document.createElement("div");
                    lineH.className =
                        "absolute -left-3 md:-left-5 top-1/2 w-3 md:w-5 h-[1px] bg-outline-variant/20";
                    nodeWrapper.appendChild(lineH);
                }

                // D&D Logic
                nodeWrapper.draggable = true;
                nodeWrapper.addEventListener("dragstart", (e) => {
                    draggedNodeId = node.id;
                    e.stopPropagation();
                    setTimeout(
                        () => nodeWrapper.classList.add("dragging"),
                        0,
                    );
                });
                nodeWrapper.addEventListener("dragend", (e) => {
                    e.stopPropagation();
                    nodeWrapper.classList.remove("dragging");
                    draggedNodeId = null;
                });

                nodeWrapper.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    nodeWrapper.classList.remove(
                        "drag-above",
                        "drag-below",
                        "drag-as-child",
                    );
                    const rect = nodeWrapper.getBoundingClientRect();
                    const relativeY = e.clientY - rect.top;
                    const height = rect.height;
                    if (relativeY < height * 0.25) {
                        dropPosition = "above";
                        nodeWrapper.classList.add("drag-above");
                    } else if (relativeY > height * 0.75) {
                        dropPosition = "below";
                        nodeWrapper.classList.add("drag-below");
                    } else {
                        dropPosition = "child";
                        nodeWrapper.classList.add("drag-as-child");
                    }
                });
                nodeWrapper.addEventListener("dragleave", (e) => {
                    e.stopPropagation();
                    nodeWrapper.classList.remove(
                        "drag-above",
                        "drag-below",
                        "drag-as-child",
                    );
                });
                nodeWrapper.addEventListener("drop", (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    nodeWrapper.classList.remove(
                        "drag-above",
                        "drag-below",
                        "drag-as-child",
                    );
                    if (draggedNodeId && draggedNodeId !== node.id)
                        moveNodeWithPosition(
                            draggedNodeId,
                            node.id,
                            dropPosition,
                        );
                });

                const flexRow = document.createElement("div");
                flexRow.className = "node-row flex flex-wrap items-center gap-2";

                // Toggle button or spacer
                if (hasChildren) {
                    const toggleBtn = document.createElement("span");
                    toggleBtn.className =
                        "node-toggle material-symbols-outlined text-primary cursor-pointer select-none text-base";
                    const isExpanded = expandedNodes.has(node.id);
                    toggleBtn.innerHTML = isExpanded
                        ? "expand_more"
                        : "chevron_right";
                    toggleBtn.onclick = (e) => {
                        e.stopPropagation();
                        const contentDiv =
                            nodeWrapper.querySelector(".node-content");
                        if (contentDiv.classList.contains("collapsed")) {
                            contentDiv.classList.remove("collapsed");
                            toggleBtn.innerHTML = "expand_more";
                            expandedNodes.add(node.id);
                        } else {
                            contentDiv.classList.add("collapsed");
                            toggleBtn.innerHTML = "chevron_right";
                            expandedNodes.delete(node.id);
                        }
                    };
                    flexRow.appendChild(toggleBtn);
                } else {
                    const spacer = document.createElement("span");
                    spacer.className =
                        "node-toggle material-symbols-outlined text-outline-variant text-base select-none";
                    spacer.innerHTML = "chevron_right";
                    flexRow.appendChild(spacer);
                }

                // Name input
                const nameInput = document.createElement("input");
                nameInput.type = "text";
                nameInput.value = node.name;
                nameInput.className =
                    "node-name-input text-sm font-headline font-bold text-on-surface";
                nameInput.dataset.nodeId = node.id;
                nameInput.oninput = (e) => {
                    const el = e.target;
                    const start = el.selectionStart;
                    const transformed = replaceSymbols(el.value);
                    if (transformed !== el.value) {
                        el.value = transformed;
                        el.setSelectionRange(start, start);
                    }
                    autoWidth(el);
                    node.name = el.value;
                    markDirty();
                };
                nameInput.onfocus = () =>
                    nodeWrapper.classList.add("node-focused");
                nameInput.onblur = () => {
                    setTimeout(() => {
                        if (!nodeWrapper.querySelector(":focus")) {
                            nodeWrapper.classList.remove("node-focused");
                        }
                    }, 100);
                };

                // Description input
                const descInput = document.createElement("textarea");
                descInput.value = node.description;
                descInput.className =
                    "node-desc-input text-on-surface-variant text-sm";
                descInput.dataset.nodeId = node.id;
                descInput.oninput = (e) => {
                    const el = e.target;
                    const start = el.selectionStart;
                    const transformed = replaceSymbols(el.value);
                    if (transformed !== el.value) {
                        el.value = transformed;
                        el.setSelectionRange(start, start);
                    }
                    autoGrow(el);
                    node.description = el.value;
                    markDirty();
                };
                descInput.onfocus = () =>
                    nodeWrapper.classList.add("node-focused");
                descInput.onblur = () => {
                    setTimeout(() => {
                        if (!nodeWrapper.querySelector(":focus")) {
                            nodeWrapper.classList.remove("node-focused");
                        }
                    }, 100);
                };

                flexRow.appendChild(nameInput);
                flexRow.appendChild(descInput);

                // Action buttons container (hidden by default, shown on focus)
                const actionButtons = document.createElement("div");
                actionButtons.className =
                    "action-buttons flex items-center gap-1 ml-2";

                const addBtn = document.createElement("button");
                addBtn.className =
                    "px-2 py-0.5 bg-primary-container text-on-primary-container rounded text-xs font-label hover:bg-primary-fixed transition-colors";
                addBtn.innerHTML =
                    '<span class="material-symbols-outlined text-sm align-middle">add</span>';
                addBtn.title = "Add Child";
                addBtn.onclick = () => {
                    if (!node.children) node.children = [];
                    const newChild = {
                        id: "node-" + Math.random().toString(36).substr(2, 9),
                        name: "",
                        description: "",
                        children: [],
                    };
                    node.children.push(newChild);
                    expandedNodes.add(node.id);
                    markDirty();
                    renderTree();
                    setTimeout(() => {
                        const input = document.querySelector(
                            `input[data-node-id="${newChild.id}"]`,
                        );
                        if (input) input.focus();
                    }, 50);
                };

                const deleteBtn = document.createElement("button");
                deleteBtn.className =
                    "px-2 py-0.5 bg-error-container text-on-error-container rounded text-xs font-label hover:bg-error-dim transition-colors";
                deleteBtn.innerHTML =
                    '<span class="material-symbols-outlined text-sm align-middle">delete</span>';
                deleteBtn.title = "Delete";
                deleteBtn.onclick = () => {
                    if (confirm("Delete this node and all its children?"))
                        deleteNode(node.id);
                };

                if (!hasChildren) expandedNodes.delete(node.id);

                const upBtn = document.createElement("button");
                upBtn.className =
                    "px-2 py-0.5 bg-surface-container text-on-surface rounded text-xs font-label hover:bg-surface-container-high transition-colors";
                upBtn.innerHTML =
                    '<span class="material-symbols-outlined text-sm align-middle">arrow_upward</span>';
                upBtn.title = "Move Up";
                upBtn.onclick = () => moveNodeUp(node.id);

                const downBtn = document.createElement("button");
                downBtn.className =
                    "px-2 py-0.5 bg-surface-container text-on-surface rounded text-xs font-label hover:bg-surface-container-high transition-colors";
                downBtn.innerHTML =
                    '<span class="material-symbols-outlined text-sm align-middle">arrow_downward</span>';
                downBtn.title = "Move Down";
                downBtn.onclick = () => moveNodeDown(node.id);

                actionButtons.appendChild(upBtn);
                actionButtons.appendChild(downBtn);
                actionButtons.appendChild(addBtn);
                actionButtons.appendChild(deleteBtn);
                flexRow.appendChild(actionButtons);

                nodeWrapper.appendChild(flexRow);

                // Collapsible content area for children
                const contentDiv = document.createElement("div");
                contentDiv.className =
                    "node-content" +
                    (expandedNodes.has(node.id) ? "" : " collapsed");
                contentDiv.className +=
                    " ml-3 md:ml-5 border-l border-outline-variant/20 pl-3 md:pl-5 space-y-4 relative mt-4";
                nodeWrapper.appendChild(contentDiv);

                if (hasChildren) {
                    node.children.forEach((child) =>
                        renderNode(child, contentDiv),
                    );
                }
                container.appendChild(nodeWrapper);
            }

            function moveNodeUp(nodeId) {
                const res = findNodeAndParentGlobal(nodeId);
                if (!res) return;
                let collection = res.parent
                    ? res.parent.children
                    : treeData.roots;
                const index = collection.findIndex((n) => n.id === nodeId);
                if (index > 0) {
                    [collection[index], collection[index - 1]] = [
                        collection[index - 1],
                        collection[index],
                    ];
                    markDirty();
                } else if (res.parent) {
                    const parentRes = findNodeAndParentGlobal(res.parent.id);
                    if (parentRes) {
                        const parentCollection = parentRes.parent
                            ? parentRes.parent.children
                            : treeData.roots;
                        const parentIndex = parentCollection.findIndex(
                            (n) => n.id === res.parent.id,
                        );
                        res.parent.children = res.parent.children.filter(
                            (n) => n.id !== nodeId,
                        );
                        parentCollection.splice(parentIndex + 1, 0, res.node);
                        markDirty();
                    }
                }
                renderTree();
            }

            function moveNodeDown(nodeId) {
                const res = findNodeAndParentGlobal(nodeId);
                if (!res) return;
                let collection = res.parent
                    ? res.parent.children
                    : treeData.roots;
                const index = collection.findIndex((n) => n.id === nodeId);
                if (index < collection.length - 1) {
                    [collection[index], collection[index + 1]] = [
                        collection[index + 1],
                        collection[index],
                    ];
                    markDirty();
                } else if (res.parent) {
                    const parentRes = findNodeAndParentGlobal(res.parent.id);
                    if (parentRes) {
                        const parentCollection = parentRes.parent
                            ? parentRes.parent.children
                            : treeData.roots;
                        const parentIndex = parentCollection.findIndex(
                            (n) => n.id === res.parent.id,
                        );
                        res.parent.children = res.parent.children.filter(
                            (n) => n.id !== nodeId,
                        );
                        parentCollection.splice(parentIndex + 1, 0, res.node);
                        markDirty();
                    }
                }
                renderTree();
            }

            function buildSystemNameField() {
                const wrap = document.createElement("div");
                wrap.className =
                    "mb-8 p-4 rounded-lg bg-surface-container-lowest border border-outline-variant/10";
                const label = document.createElement("label");
                label.className =
                    "text-xs uppercase tracking-widest text-outline font-label block mb-2";
                label.textContent = "System name";
                const input = document.createElement("input");
                input.type = "text";
                input.id = "systemNameInput";
                input.className =
                    "system-name-input font-headline font-bold text-on-surface";
                input.placeholder = "Untitled System";
                input.value = treeData.name || "";
                input.oninput = () => {
                    treeData.name = input.value;
                    document.getElementById(
                        "treeNameDisplay",
                    ).innerText =
                        input.value || "Untitled System";
                    markDirty();
                };
                wrap.appendChild(label);
                wrap.appendChild(input);
                return wrap;
            }

            function renderTree() {
                const container = document.getElementById("main-content");
                container.innerHTML = "";
                container.appendChild(buildSystemNameField());
                if (treeData.roots && treeData.roots.length > 0) {
                    treeData.roots.forEach((root) => {
                        renderNode(root, container, true);
                    });
                } else {
                    const empty = document.createElement("div");
                    empty.className = "text-center py-16";
                    empty.innerHTML = `
                        <span class="material-symbols-outlined text-outline-variant text-6xl mb-4">account_tree</span>
                        <p class="text-on-surface-variant text-lg font-body">No root nodes yet.</p>
                        <p class="text-on-surface-variant text-sm font-body mt-2">Click "New Root Node" in the sidebar to get started.</p>
                    `;
                    container.appendChild(empty);
                }
                requestAnimationFrame(() => {
                    document
                        .querySelectorAll(".node-desc-input")
                        .forEach(autoGrow);
                    document
                        .querySelectorAll(".node-name-input")
                        .forEach(autoWidth);
                });
            }

            function findNodeAndParentGlobal(searchId) {
                for (let i = 0; i < treeData.roots.length; i++) {
                    const res = findRecursive(
                        treeData.roots[i],
                        searchId,
                        null,
                    );
                    if (res) return { ...res, rootIndex: i };
                }
                return null;
            }

            function findRecursive(current, searchId, parent) {
                if (current.id === searchId)
                    return { node: current, parent: parent };
                if (current.children) {
                    for (let child of current.children) {
                        const res = findRecursive(child, searchId, current);
                        if (res) return res;
                    }
                }
                return null;
            }

            function moveNodeWithPosition(sourceId, targetId, position) {
                const source = findNodeAndParentGlobal(sourceId);
                const target = findNodeAndParentGlobal(targetId);
                if (!source || !target || source.node.id === target.node.id)
                    return;

                if (source.parent) {
                    source.parent.children = source.parent.children.filter(
                        (c) => c.id !== sourceId,
                    );
                } else {
                    treeData.roots = treeData.roots.filter(
                        (r) => r.id !== sourceId,
                    );
                }

                const targetCollection = target.parent
                    ? target.parent.children
                    : treeData.roots;
                const targetIndex = targetCollection.findIndex(
                    (n) => n.id === targetId,
                );

                if (position === "above") {
                    targetCollection.splice(targetIndex, 0, source.node);
                } else if (position === "below") {
                    targetCollection.splice(targetIndex + 1, 0, source.node);
                } else {
                    if (!target.node.children) target.node.children = [];
                    target.node.children.push(source.node);
                }
                markDirty();
                renderTree();
            }

            function deleteNode(targetId) {
                const res = findNodeAndParentGlobal(targetId);
                if (!res) return;
                if (res.parent) {
                    res.parent.children = res.parent.children.filter(
                        (c) => c.id !== targetId,
                    );
                } else {
                    treeData.roots.splice(res.rootIndex, 1);
                }
                markDirty();
                renderTree();
            }

            function replaceSymbols(text) {
                return text
                    .replace(/!c/g, "♣")
                    .replace(/!d/g, "♦")
                    .replace(/!h/g, "♥")
                    .replace(/!s/g, "♠");
            }

            function autoGrow(el) {
                el.style.height = "auto";
                el.style.height = el.scrollHeight + "px";
            }

            function autoWidth(el) {
                el.style.width = Math.max(70, el.value.length * 9 + 16) + "px";
            }

            async function saveTree() {
                try {
                    const res = await fetch("/api/tree/" + id, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(treeData),
                    });
                    if (res.status === 401) {
                        showToast("Passcode required", true);
                        showUnlockDialog();
                        return;
                    }
                    if (!res.ok) throw new Error(res.statusText);
                    dirty = false;
                    showToast("System saved");
                } catch (err) {
                    showToast("Save failed", true);
                }
            }

            function showLockScreen() {
                const content = document.getElementById("main-content");
                content.innerHTML = `
                    <div class="text-center py-16 bg-surface-container-lowest rounded-xl border border-outline-variant/10 max-w-md mx-auto">
                        <span class="material-symbols-outlined text-primary text-5xl mb-4">lock</span>
                        <p class="text-on-surface text-lg font-headline font-bold">Editing is protected</p>
                        <p class="text-on-surface-variant text-sm mt-2 mb-6">Enter the passcode to edit this system.</p>
                        <button onclick="showUnlockDialog()" class="px-5 py-2.5 bg-primary text-on-primary rounded font-label text-sm hover:bg-primary-dim transition-colors">
                            Enter passcode
                        </button>
                    </div>
                `;
            }

            let treeLoaded = false;

            document.addEventListener("authchange", () => {
                if (window.appUnlocked) {
                    if (!treeLoaded) {
                        treeLoaded = true;
                        loadTree();
                    } else {
                        renderTree();
                    }
                } else {
                    showLockScreen();
                }
            });

            document.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
                    e.preventDefault();
                    saveTree();
                }
            });

            window.addEventListener("beforeunload", (e) => {
                if (dirty && !window.treeDeleted) {
                    e.preventDefault();
                    e.returnValue = "";
                }
            });

            refreshAuthState();
        </script>
    </body>
</html>
