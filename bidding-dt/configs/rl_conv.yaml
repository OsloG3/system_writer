# GPU self-play run WITH system-convention enforcement: same two-table team
# reward as rl_small.yaml, plus a per-call penalty for every bid that breaks
# the enforced system. The system itself is written in the conventions text
# file (models/system.txt -- rl.system_file / --system / BIDDING_SYSTEM_FILE),
# interpreted at the start of training. The file is a sequence-pattern
# script: one entry per call kind, e.g.
#
#   1X-1Y-2Z; X<Z = reverse: 5+X 4+Z p>16 F @2.0
#   1X-(1Y)-2Z; Z<Y, first = 2/1 over their bid: 4+Z p>11.5 GF
#   ...-4N-(P)-5C; we_bid = RKCB response for {T}: kc=0/3 @!
#   ...-X; we_xx OR dbls_by_us>=2 OR gf OR their_bid>=4S = PENALTY
#
# -- generic suits X/Y/Z/W, opponent calls in parentheses, clause conditions
# (gf, balancing, jump=1, their_bid>=4S, ...) and descriptions that double as
# the enforcement spec (lengths, K&R point ranges, balanced, OR branches,
# F/GF forcing, TO/PENALTY double discipline). Top-level config lines tune
# the thresholds (kr_tolerance, conv_bonus, to_pass_min_len, ...). A matched
# entry with weight>0 replaces the built-in checks for that call; unmatched
# calls fall back to conventions/rules.py defaults (5-card majors, 15-17
# 1NT, strong 2C, GF 2/1, splinters, smolen, RKCB steps, XYZ, ...). The same
# file's entry descriptions are what the website serves as bid alerts. Hands
# are evaluated in Kaplan-Rubens points (rpbridge.net/8j19.htm); every range
# carries +-kr_tolerance slack. The penalty is conv_weight * sum(violated
# weights), subtracted from each offending call's row reward; correctly
# using an artificial convention (XYZ, RKCB, splinter, smolen, fourth suit,
# cuebid raise) instead adds the small flat conv_bonus reward. The
# conv_rules / conv_params below layer on top of the file for experiments
# (conv_rules tunes the built-in fallback weights).
#   uv run python -m bidding_dt.rl.train_ppo --config configs/rl_conv.yaml \
#       --preset small --bc-ckpt runs/small/best.pt --out runs/rl_conv
#
model:
  dropout: 0.0
rl:
  iters: 256
  deals_per_iter: 128
  lr: 1.0e-4
  warmup_iters: 64
  minibatch_size: 124
  ppo_epochs: 3
  reward_scale: 0.2
  team_weight: 1.0
  par_weight: 0.25
  rollout_temp: 1.5
  gamma: 1.0
  lam: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  ent_coef_end: 0.001
  kl_beta: 0.1
  kl_beta_end: 0.0
  league_prob: 0.5
  snapshot_every: 30
  max_snapshots: 24
  eval_every: 25
  eval_deals: 128
  cache_path: cache/dd.sqlite
  # --- convention enforcement ------------------------------------------------
  conv_weight: 1.0          # penalty units per rule weight (0 disables).
                            # Typical row rewards are +-0.5..5 units, so 1.0
                            # makes a single violation cost like losing ~5 IMPs;
                            # lower it if conv_viol_rate stays high and IMPs
                            # regress, raise it if the bot ignores the system.
  # conv_rules:             # per-rule weight overrides (0 disables a rule):
  #   gf_pass: 2.0
  #   open_values: 0.0
  # conv_params:            # threshold overrides (see ConventionConfig):
  #   kr_tolerance: 0.75
  #   js_range: [10.5, 12.5]
  #   conv_bonus: 0.1       # small reward per correct convention use
